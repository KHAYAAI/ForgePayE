name: "ForgePay — Docker Build & Push"

on:
  push:
    branches: ["claude/forgepay-platform-design-gEkgE", "main"]
    paths:
      - "forgepay/services/**"
      - "forgepay/apps/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build (all | unified-router | mor-layer | billing-engine | stablecoin-gateway | crypto-gateway | agent-identity | agent-negotiation | rwa-registry | enterprise-treasury | bank-whitelabel)"
        required: false
        default: "all"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/forgepay

jobs:
  # Determine which services changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      unified-router:         ${{ steps.filter.outputs.unified-router }}
      mor-layer:              ${{ steps.filter.outputs.mor-layer }}
      billing-engine:         ${{ steps.filter.outputs.billing-engine }}
      stablecoin-gateway:     ${{ steps.filter.outputs.stablecoin-gateway }}
      crypto-gateway:         ${{ steps.filter.outputs.crypto-gateway }}
      agent-identity:         ${{ steps.filter.outputs.agent-identity }}
      agent-negotiation:      ${{ steps.filter.outputs.agent-negotiation }}
      rwa-registry:           ${{ steps.filter.outputs.rwa-registry }}
      enterprise-treasury:    ${{ steps.filter.outputs.enterprise-treasury }}
      bank-whitelabel:        ${{ steps.filter.outputs.bank-whitelabel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            unified-router:
              - 'forgepay/services/unified-router/**'
              - 'forgepay/config/pricing.yaml'
            mor-layer:
              - 'forgepay/services/mor-layer/**'
            billing-engine:
              - 'forgepay/services/billing-engine/**'
            stablecoin-gateway:
              - 'forgepay/services/stablecoin-gateway/**'
            crypto-gateway:
              - 'forgepay/services/crypto-gateway/**'
            agent-identity:
              - 'forgepay/services/agent-identity/**'
            agent-negotiation:
              - 'forgepay/services/agent-negotiation/**'
            rwa-registry:
              - 'forgepay/services/rwa-registry/**'
            enterprise-treasury:
              - 'forgepay/services/enterprise-treasury/**'
            bank-whitelabel:
              - 'forgepay/services/bank-whitelabel/**'

  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: unified-router
            # Parent context (not forgepay/services/unified-router) so the
            # Dockerfile can COPY ../../config/pricing.yaml in — checkout.ts
            # reads it at runtime as the one source of truth for what it
            # charges, and Docker COPY cannot reach outside its build context.
            context: forgepay
            file: forgepay/services/unified-router/Dockerfile
            condition: ${{ needs.changes.outputs.unified-router == 'true' }}
          - service: mor-layer
            context: forgepay/services/mor-layer
            condition: ${{ needs.changes.outputs.mor-layer == 'true' }}
          - service: billing-engine
            context: forgepay/services/billing-engine
            condition: ${{ needs.changes.outputs.billing-engine == 'true' }}
          - service: stablecoin-gateway
            context: forgepay/services/stablecoin-gateway
            condition: ${{ needs.changes.outputs.stablecoin-gateway == 'true' }}
          - service: crypto-gateway
            context: forgepay/services/crypto-gateway
            condition: ${{ needs.changes.outputs.crypto-gateway == 'true' }}
          - service: agent-identity
            context: forgepay/services/agent-identity
            condition: ${{ needs.changes.outputs.agent-identity == 'true' }}
          - service: agent-negotiation
            context: forgepay/services/agent-negotiation
            condition: ${{ needs.changes.outputs.agent-negotiation == 'true' }}
          - service: rwa-registry
            context: forgepay/services/rwa-registry
            condition: ${{ needs.changes.outputs.rwa-registry == 'true' }}
          - service: enterprise-treasury
            context: forgepay/services/enterprise-treasury
            condition: ${{ needs.changes.outputs.enterprise-treasury == 'true' }}
          - service: bank-whitelabel
            context: forgepay/services/bank-whitelabel
            condition: ${{ needs.changes.outputs.bank-whitelabel == 'true' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ matrix.condition == 'true' || github.event_name == 'workflow_dispatch' }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: ${{ matrix.condition == 'true' || github.event_name == 'workflow_dispatch' }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ matrix.condition == 'true' || github.event_name == 'workflow_dispatch' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: ${{ matrix.condition == 'true' || github.event_name == 'workflow_dispatch' }}
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        if: ${{ matrix.condition == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report-only for now: surfaces CVEs in the Security tab without
      # blocking the pipeline on an unreviewed baseline. Tighten to
      # `exit-code: 1` on CRITICAL once that baseline has been triaged.
      - name: Scan image for known vulnerabilities (Trivy)
        if: ${{ matrix.condition == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned by commit; tag 0.24.0 no longer resolves)
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results to code scanning
        if: ${{ matrix.condition == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
