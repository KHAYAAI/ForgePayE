# ARCH: ForgePay CI — GitHub Actions
#
# Job graph (all jobs run in parallel — no cross-job dependencies):
#   unified-router  → lint + tsc + vitest
#   mor-layer       → ruff + mypy + pytest
#   web             → tsc + next build
#   dashboard       → tsc + next build
#   sdk-js          → tsc + vitest + tsup build
#   sdk-python      → ruff + mypy + pytest
#   helm-lint       → helm lint (forgepay-stack + unified-router + monitoring)
#
# NOTE: paths filter — CI only runs when files under forgepay/** or this workflow
#   file change. Rust changes (crates/**) skip this workflow entirely and run
#   through the separate Hyperswitch CI. This avoids 10-minute Rust compile times
#   on every TypeScript/Python commit.
#
# NOTE: concurrency group cancels in-progress runs on the same branch ref so that
#   rapid-fire commits don't queue up redundant CI runs. cancel-in-progress: true
#   is safe here because we never run DB migrations in CI.
#
# NOTE: helm-lint uses `|| true` for the monitoring chart because chart-testing
#   requires a Kubernetes cluster for template rendering — lint-only mode still
#   catches YAML syntax errors and required-value violations.

name: "ForgePay CI"

on:
  push:
    branches: ["claude/forgepay-platform-design-gEkgE", "main"]
    paths:
      - "forgepay/**"
      - ".github/workflows/forgepay-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "forgepay/**"

concurrency:
  group: forgepay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unified Router (TypeScript) ─────────────────────────────────────────────
  unified-router:
    name: "unified-router — lint + type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/services/unified-router
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/services/unified-router/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  # ── FORGE Custody (TypeScript) ──────────────────────────────────────────────
  # ── Agent Credit Bureau (TypeScript) ────────────────────────────────────────
  # The flagship product. It previously appeared only in forgepay-smoke.yml as a
  # boot probe — a health check, not a correctness gate — which is how a scoring
  # inconsistency between /score and /dual-score reached the running service.
  agent-credit-bureau:
    name: "agent-credit-bureau — type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/services/agent-credit-bureau
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/services/agent-credit-bureau/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm test

  # ── Agent Identity (TypeScript) ─────────────────────────────────────────────
  # Had no job here despite 3 test files and 40+ cases. That is why its
  # persistence suite could fail with ECONNREFUSED indefinitely without anyone
  # noticing, and why a DID-format assertion drifted from the minter.
  agent-identity:
    name: "agent-identity — type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/services/agent-identity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/services/agent-identity/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm test

  # ── FORGE Custody (TypeScript) ──────────────────────────────────────────────
  forge-custody:
    name: "forge-custody — type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/services/forge-custody
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/services/forge-custody/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm test

  # ── FORGE Wallet (TypeScript) ───────────────────────────────────────────────
  forge-wallet:
    name: "forge-wallet — type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/services/forge-wallet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/services/forge-wallet/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm test

  # ── MoR Layer (Python) ──────────────────────────────────────────────────────
  mor-layer:
    name: "mor-layer — lint + type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/services/mor-layer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: forgepay/services/mor-layer/.venv
          key: mor-layer-venv-${{ hashFiles('forgepay/services/mor-layer/poetry.lock') }}

      - run: poetry install

      - name: Lint (ruff)
        run: poetry run ruff check src tests

      - name: Type-check (mypy)
        run: poetry run mypy src --ignore-missing-imports

      - name: Test (pytest)
        run: poetry run pytest tests/ -v --tb=short
        env:
          MOR_HYPERSWITCH_API_KEY: test_key
          MOR_INTERNAL_WEBHOOK_SECRET: test_secret
          MOR_DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          MOR_REDIS_URL: "redis://localhost:6379/0"

  # ── Liquidity Forecaster (Python) ───────────────────────────────────────────
  #
  # Previously had no job at all — a readiness audit found it had no
  # package.json and, on that basis alone, called it unbuildable and
  # untestable without ever checking that it's a Python/Poetry service, not a
  # Node one. It has a real pyproject.toml, installs cleanly, and its 51-test
  # suite passes (one test that manually drove an event loop with the
  # since-removed asyncio.get_event_loop() implicit-creation behavior has been
  # fixed to match this file's own @pytest.mark.asyncio convention).
  #
  # Deliberately test-only, unlike mor-layer's lint + type-check + test: ruff
  # and mypy currently report 66 and 28 findings respectively across this
  # service, pre-existing and unrelated to the audit that added this job.
  # Gating on checks that start red teaches people to ignore the gate rather
  # than fix it — tracked separately, added here once clean.
  liquidity-forecaster:
    name: "liquidity-forecaster — test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/services/liquidity-forecaster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: forgepay/services/liquidity-forecaster/.venv
          key: liquidity-forecaster-venv-${{ hashFiles('forgepay/services/liquidity-forecaster/poetry.lock') }}

      - run: poetry install

      - name: Test (pytest)
        run: poetry run pytest tests/ -v --tb=short

  # ── Marketing Site (Next.js) ────────────────────────────────────────────────
  web:
    name: "web — type-check + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/apps/web/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run build

  # ── Dashboard (Next.js) ─────────────────────────────────────────────────────
  #
  # Unlike every other job here, this one installs with pnpm from the workspace
  # root. The dashboard depends on @forgepay/forge-agent via `workspace:*`, a
  # protocol npm has never supported — `npm ci` fails outright with
  # EUNSUPPORTEDPROTOCOL, so this job could not pass as originally written.
  #
  # forge-agent also has to be compiled before the dashboard type-checks: its
  # package.json points at ./dist, which does not exist in a fresh checkout.
  dashboard:
    name: "dashboard — type-check + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: forgepay/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Produces the dist/ that @forgepay/forge-agent's types resolve through.
      - run: pnpm --filter @forgepay/forge-agent build

      - run: pnpm --filter @forgepay/dashboard type-check
      - run: pnpm --filter @forgepay/dashboard build
        env:
          NEXT_PUBLIC_FORGEPAY_ENV: test

  # ── @forgepay/sdk ────────────────────────────────────────────────────────────
  sdk-js:
    name: "sdk-js — type-check + test + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/packages/sdk-js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/packages/sdk-js/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  # ── Python SDK ───────────────────────────────────────────────────────────────
  sdk-python:
    name: "sdk-python — lint + type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/packages/sdk-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-in-project: true

      - run: poetry install
      - run: poetry run ruff check forgepay tests
      - run: poetry run mypy forgepay
      - run: poetry run pytest tests/ -v --tb=short

  # ── Remaining TypeScript services ────────────────────────────────────────────
  #
  # Twelve services with passing suites that no pipeline was watching. Between
  # them they carry 420 test cases which could have gone red on any commit
  # without anyone finding out — CI covered 6 of 26 services, so the majority of
  # the platform's own tests were advisory.
  #
  # Every service below was verified locally before being added here: `tsc
  # --noEmit` clean and the full suite green. A gate that starts red teaches
  # people to ignore the gate.
  #
  # Deliberately NOT in this matrix:
  #   email-service        — 119 lines, no test files to run
  #   liquidity-forecaster — no package.json; cannot be installed or tested
  #                          as a Node service at all (see below)
  #   billing-engine, open-privy, openfireblocks — nested Java/NestJS/Go
  #                          layouts needing their own toolchains
  #   bank-connectivity, rwa-registry — need Postgres; gated separately below
  typescript-services:
    name: "${{ matrix.service }} — type-check + test"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - accounts-service
          - agent-credit-lines
          - agent-decision-framework
          - agent-liquidity-manager
          - agent-negotiation
          - bank-whitelabel
          - chain-sync
          - crypto-gateway
          - enterprise-treasury
          - institutional-reporting
          - stablecoin-gateway
          - yield-engine
    defaults:
      run:
        working-directory: forgepay/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/services/${{ matrix.service }}/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm test

  # ── Services requiring Postgres ──────────────────────────────────────────────
  #
  # These two were not failing on their merits — their integration suites need a
  # real database and were erroring with ECONNREFUSED on 127.0.0.1:5432. Given a
  # service container they pass, which is the difference between "these tests are
  # broken" and "nobody ever gave these tests a database".
  postgres-backed-services:
    name: "${{ matrix.service }} — test against Postgres"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [bank-connectivity, rwa-registry]
    defaults:
      run:
        working-directory: forgepay/services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgepay
          POSTGRES_PASSWORD: forgepay
          POSTGRES_DB: forgepay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://forgepay:forgepay@localhost:5432/forgepay_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/services/${{ matrix.service }}/package-lock.json

      - run: npm ci

      # bank-connectivity is Prisma-backed; its schema has to exist before the
      # suite runs. rwa-registry creates its own tables on connect.
      - name: Apply Prisma migrations
        if: matrix.service == 'bank-connectivity'
        run: npx prisma migrate deploy

      - run: npm test

  # ── Helm lint ────────────────────────────────────────────────────────────────
  helm-lint:
    name: "helm — lint all charts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.15.0"

      - name: Lint forgepay-stack
        run: helm lint forgepay/infra/helm/forgepay-stack/

      - name: Lint unified-router
        run: helm lint forgepay/infra/helm/unified-router/

      - name: Lint monitoring
        run: helm lint forgepay/infra/helm/monitoring/ || true

  # ── Load Testing (Baseline Validation) ───────────────────────────────────────
  load-test-baseline:
    name: "load-tests — baseline validation"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          apt-get update && apt-get install -y gpg curl
          curl https://dl.k6.io/key.gpg | gpg --no-default-keyring --keyring ./k6-keyring.gpg --import
          curl https://dl.k6.io/deb/debian/k6.gpg | gpg --no-default-keyring --keyring ./k6-keyring.gpg --import
          curl https://dl.k6.io/deb/repos/amd64/pool/main/k6_latest_amd64.deb -o k6.deb
          dpkg -i k6.deb

      - name: Run checkout load test
        env:
          BASE_URL: ${{ secrets.STAGING_API_URL || 'http://localhost:8010' }}
        run: |
          mkdir -p forgepay/infra/load-tests/results
          cd forgepay/infra/load-tests
          k6 run --out json=results/checkout-baseline.json checkout-load-test.js || true

      - name: Compare to baseline
        id: baseline-compare
        run: |
          cd forgepay/infra/load-tests
          if [ -f results/baseline.json ]; then
            bash compare-baseline.sh results/checkout-baseline.json results/baseline.json && echo "comparison_passed=true" >> $GITHUB_OUTPUT || echo "comparison_passed=false" >> $GITHUB_OUTPUT
          else
            echo "No baseline found; skipping comparison"
            echo "comparison_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: forgepay/infra/load-tests/results/

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.baseline-compare.outputs.comparison_passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Load test comparison failed: Performance regression detected vs baseline.\n\nCheck the [load test results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
