# ARCH: ForgePay CI — GitHub Actions
#
# Job graph (all jobs run in parallel — no cross-job dependencies):
#   unified-router  → lint + tsc + vitest
#   mor-layer       → ruff + mypy + pytest
#   web             → tsc + next build
#   dashboard       → tsc + next build
#   sdk-js          → tsc + vitest + tsup build
#   sdk-python      → ruff + mypy + pytest
#   helm-lint       → helm lint (forgepay-stack + unified-router + monitoring)
#
# NOTE: paths filter — CI only runs when files under forgepay/** or this workflow
#   file change. Rust changes (crates/**) skip this workflow entirely and run
#   through the separate Hyperswitch CI. This avoids 10-minute Rust compile times
#   on every TypeScript/Python commit.
#
# NOTE: concurrency group cancels in-progress runs on the same branch ref so that
#   rapid-fire commits don't queue up redundant CI runs. cancel-in-progress: true
#   is safe here because we never run DB migrations in CI.
#
# NOTE: helm-lint uses `|| true` for the monitoring chart because chart-testing
#   requires a Kubernetes cluster for template rendering — lint-only mode still
#   catches YAML syntax errors and required-value violations.

name: "ForgePay CI"

on:
  push:
    branches: ["claude/forgepay-platform-design-gEkgE", "main"]
    paths:
      - "forgepay/**"
      - ".github/workflows/forgepay-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "forgepay/**"

concurrency:
  group: forgepay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unified Router (TypeScript) ─────────────────────────────────────────────
  unified-router:
    name: "unified-router — lint + type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/services/unified-router
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/services/unified-router/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  # ── MoR Layer (Python) ──────────────────────────────────────────────────────
  mor-layer:
    name: "mor-layer — lint + type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/services/mor-layer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: forgepay/services/mor-layer/.venv
          key: mor-layer-venv-${{ hashFiles('forgepay/services/mor-layer/poetry.lock') }}

      - run: poetry install

      - name: Lint (ruff)
        run: poetry run ruff check src tests

      - name: Type-check (mypy)
        run: poetry run mypy src --ignore-missing-imports

      - name: Test (pytest)
        run: poetry run pytest tests/ -v --tb=short
        env:
          MOR_HYPERSWITCH_API_KEY: test_key
          MOR_INTERNAL_WEBHOOK_SECRET: test_secret
          MOR_DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          MOR_REDIS_URL: "redis://localhost:6379/0"

  # ── Marketing Site (Next.js) ────────────────────────────────────────────────
  web:
    name: "web — type-check + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/apps/web/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run build

  # ── Dashboard (Next.js) ─────────────────────────────────────────────────────
  dashboard:
    name: "dashboard — type-check + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/apps/dashboard/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_FORGEPAY_ENV: test

  # ── @forgepay/sdk ────────────────────────────────────────────────────────────
  sdk-js:
    name: "sdk-js — type-check + test + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/packages/sdk-js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: forgepay/packages/sdk-js/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  # ── Python SDK ───────────────────────────────────────────────────────────────
  sdk-python:
    name: "sdk-python — lint + type-check + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgepay/packages/sdk-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-in-project: true

      - run: poetry install
      - run: poetry run ruff check forgepay tests
      - run: poetry run mypy forgepay
      - run: poetry run pytest tests/ -v --tb=short

  # ── Helm lint ────────────────────────────────────────────────────────────────
  helm-lint:
    name: "helm — lint all charts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.15.0"

      - name: Lint forgepay-stack
        run: helm lint forgepay/infra/helm/forgepay-stack/

      - name: Lint unified-router
        run: helm lint forgepay/infra/helm/unified-router/

      - name: Lint monitoring
        run: helm lint forgepay/infra/helm/monitoring/ || true

  # ── Load Testing (Baseline Validation) ───────────────────────────────────────
  load-test-baseline:
    name: "load-tests — baseline validation"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          apt-get update && apt-get install -y gpg curl
          curl https://dl.k6.io/key.gpg | gpg --no-default-keyring --keyring ./k6-keyring.gpg --import
          curl https://dl.k6.io/deb/debian/k6.gpg | gpg --no-default-keyring --keyring ./k6-keyring.gpg --import
          curl https://dl.k6.io/deb/repos/amd64/pool/main/k6_latest_amd64.deb -o k6.deb
          dpkg -i k6.deb

      - name: Run checkout load test
        env:
          BASE_URL: ${{ secrets.STAGING_API_URL || 'http://localhost:8010' }}
        run: |
          mkdir -p forgepay/infra/load-tests/results
          cd forgepay/infra/load-tests
          k6 run --out json=results/checkout-baseline.json checkout-load-test.js || true

      - name: Compare to baseline
        id: baseline-compare
        run: |
          cd forgepay/infra/load-tests
          if [ -f results/baseline.json ]; then
            bash compare-baseline.sh results/checkout-baseline.json results/baseline.json && echo "comparison_passed=true" >> $GITHUB_OUTPUT || echo "comparison_passed=false" >> $GITHUB_OUTPUT
          else
            echo "No baseline found; skipping comparison"
            echo "comparison_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: forgepay/infra/load-tests/results/

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.baseline-compare.outputs.comparison_passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Load test comparison failed: Performance regression detected vs baseline.\n\nCheck the [load test results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
