name: Deploy ForgePay Platform

on:
  push:
    branches: [main, claude/forgepay-platform-design-gEkgE]
    paths:
      - 'forgepay/apps/platform/**'
      - '.github/workflows/deploy-platform.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: forgepay/platform

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: forgepay/apps/platform/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: forgepay/apps/platform

      - name: Build Next.js app
        run: npm run build
        working-directory: forgepay/apps/platform
        env:
          SKIP_ENV_VALIDATION: true

      - name: Run type check
        run: npm run type-check
        working-directory: forgepay/apps/platform

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Extract metadata
        id: meta
        run: |
          TAGS="${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          TAGS="${TAGS},${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: forgepay/apps/platform
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name forgepay-prod --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          cd forgepay/infra/helm/platform
          helm upgrade --install platform . \
            --namespace forgepay \
            --create-namespace \
            --values values.yaml \
            --values values-prod.yaml \
            --set image.tag=${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/platform -n forgepay --timeout=5m

      - name: Smoke test
        run: |
          kubectl run smoke-test --image=curlimages/curl --restart=Never -n forgepay -- \
            curl -f http://platform/api/health || exit 1

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_OPS_WEBHOOK }}
          payload: |
            {
              "text": "✅ ForgePay Platform deployed successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ ForgePay Platform Deployed*\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_OPS_WEBHOOK }}
          payload: |
            {
              "text": "❌ ForgePay Platform deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ ForgePay Platform Deployment Failed*\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
