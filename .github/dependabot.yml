version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions:
        patterns: ["*"]

  # ── Python services (pip) ───────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/forgepay/services/compliance-monitor"
    schedule: { interval: "weekly" }
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/forgepay/services/mor-layer"
    schedule: { interval: "weekly" }
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/forgepay/services/liquidity-forecaster"
    schedule: { interval: "weekly" }
    groups:
