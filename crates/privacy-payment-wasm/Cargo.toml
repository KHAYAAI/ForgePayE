[package]
name = "privacy-payment-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for auditable-privacy-payment (BN254 Groth16 ZK proofs)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Privacy payment circuit (when integrated)
# app-payment = { path = "../privacy-payment" }
# arkworks = { version = "0.4", features = ["parallel"] }

wasm-bindgen = "0.2.91"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
serde_json = "1.0"
rand = "0.8"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }

# Logging in WASM
wasm-logger = "0.2"
log = "0.4"

[dev-dependencies]
wasm-bindgen-test = "1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
