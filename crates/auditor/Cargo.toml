[package]
name = "auditor"
version = "0.1.0"
edition = "2021"
description = "Auditor service for decrypting shielded transactions and computing taxes (Privacy-Preserving MoR)"
license = "Apache-2.0"

[dependencies]
# TODO: Add when auditable-privacy-payment is integrated
# app-auditor = { path = "../privacy-payment/auditor" }
# ark-ff = "0.5"
# ark-ec = "0.5"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
hex = "0.4"
sha2 = { version = "0.10" }
aes-gcm = "0.10"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
