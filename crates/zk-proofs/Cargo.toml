[package]
name = "zk-proofs"
version = "0.1.0"
edition = "2021"
description = "ZK proof generation and verification bridge for ForgePay (Groth16 on BN254)"
license = "Apache-2.0"

[dependencies]
# TODO: Add arkworks dependencies when auditable-privacy-payment is integrated
# app-payment = { path = "../privacy-payment/payment" }
# ark-ff = "0.5"
# ark-ec = "0.5"
# ark-bn254 = "0.5"
# ark-groth16 = "0.5"
# ark-relations = "0.5"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
hex = "0.4"
