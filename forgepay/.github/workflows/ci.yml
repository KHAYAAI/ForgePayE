name: ForgePay CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

# Cancel in-flight runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript type-check ──────────────────────────────────────────────────
  typecheck:
    name: Type-check (${{ matrix.service }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - unified-router
          - agent-identity
          - enterprise-treasury
          - agent-credit-lines
          - stablecoin-gateway
          - crypto-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: forgepay/services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: forgepay/services/${{ matrix.service }}
        run: npm ci

      - name: Type-check
        working-directory: forgepay/services/${{ matrix.service }}
        run: npx tsc --noEmit

  # ── TypeScript tests ────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - unified-router
          - agent-identity
          - enterprise-treasury
          - agent-credit-lines
          - stablecoin-gateway
          - crypto-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: forgepay/services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: forgepay/services/${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: forgepay/services/${{ matrix.service }}
        # continue-on-error: services without a test script will not fail the build
        continue-on-error: true
        run: |
          if node -e "require('./package.json').scripts.test" 2>/dev/null; then
            npm test
          else
            echo "No test script defined for ${{ matrix.service }} — skipping."
          fi

  # ── Rust workspace check ───────────────────────────────────────────────────
  rust-check:
    name: Rust workspace check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Key on Cargo.lock so the cache is invalidated when deps change
          key: ${{ hashFiles('Cargo.lock') }}

      - name: cargo check (all workspace crates)
        run: cargo check --workspace

  # ── Docker image dry-run builds ────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - unified-router
          - agent-identity
          - enterprise-treasury
          - agent-credit-lines
          - stablecoin-gateway
          - crypto-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: forgepay/services/${{ matrix.service }}
          file: forgepay/services/${{ matrix.service }}/Dockerfile
          push: false
          # Load into local daemon so subsequent steps can inspect if needed
          load: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/forgepay/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/forgepay/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Helm chart linting ─────────────────────────────────────────────────────
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint all Helm charts
        run: |
          set -e
          EXIT=0
          for chart in forgepay/infra/helm/*/; do
            echo "--- Linting $chart ---"
            helm lint "$chart" || EXIT=$?
          done
          exit $EXIT
