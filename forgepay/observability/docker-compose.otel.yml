version: '3.8'

# OpenTelemetry, Prometheus, Jaeger, and Grafana stack for ForgePay observability
# Run with: docker compose -f forgepay/observability/docker-compose.otel.yml up

services:
  # OpenTelemetry Collector (OTLP receiver and exporter)
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command:
      - "--config=/etc/otel-collector-config.yml"
    ports:
      # OTLP receivers
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      # Prometheus exporter
      - "8888:8888"    # Metrics
      # Health check
      - "13133:13133"
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml
    environment:
      - GOGC=80
    depends_on:
      - jaeger
      - prometheus
    networks:
      - forgepay-otel

  # Jaeger all-in-one (traces storage + UI)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_HTTP_HOST_PORT=0.0.0.0:4318
      - COLLECTOR_OTLP_GRPC_HOST_PORT=0.0.0.0:4317
    ports:
      # OTLP HTTP receiver
      - "4318:4318"
      # OTLP gRPC receiver
      - "4317:4317"
      # Jaeger UI
      - "16686:16686"
      # Jaeger collector
      - "14269:14269"
      # Health check port
      - "14250:14250"
    networks:
      - forgepay-otel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:14269"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus (metrics scraping and storage)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=UTC
    networks:
      - forgepay-otel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - jaeger

  # Grafana (dashboards and visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - forgepay-otel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus

  # Optional: Prometheus Node Exporter (system metrics from host)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys)($|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - forgepay-otel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: cAdvisor (container metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - forgepay-otel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  forgepay-otel:
    driver: bridge
