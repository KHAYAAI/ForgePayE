        labels:
          service: 'cadvisor'
          type: 'kubernetes'

  # Blackbox exporter — TLS cert expiry probes
  - job_name: 'blackbox-tls'
    scrape_interval: 5m
    scrape_timeout: 30s
    metrics_path: '/probe'
    params:
      module: ['http_2xx']
    static_configs:
      - targets:
          - https://api.forgepay.io
          - https://dashboard.forgepay.io
          - https://checkout.forgepay.io
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

