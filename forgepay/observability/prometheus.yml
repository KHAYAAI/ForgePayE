# Prometheus Configuration for ForgePay Platform
# Scrape interval: 15s for payment-critical services, 30s for supporting services.
# All services expose metrics at GET /metrics (Prometheus text format).

global:
  scrape_interval: 30s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'forgepay-production'
    environment: 'production'

# ── Alertmanager ────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# ── Alert rules ─────────────────────────────────────────────────────────────
rule_files:
  - "monitoring/prometheus-alerts.yaml"

# ── Scrape configurations ───────────────────────────────────────────────────
# Relabeling convention:
#   - service_name is extracted from the job label so every time-series carries
#     a consistent `service` label used by dashboards and alert expressions.

scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
    relabel_configs:
      - source_labels: [job]
        target_label: service_name

  # ── Payment-critical services (15s) ───────────────────────────────────────

  # Unified Router — webhook normalizer, Fastify/TypeScript, port 8000
  - job_name: 'unified-router'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['unified-router:8000']
        labels:
          service: 'unified-router'
          type: 'webhook-normalizer'
          language: 'typescript'
          team: 'platform'
    relabel_configs:
      - source_labels: [job]
        target_label: service_name

  # MoR Layer — merchant-of-record, tax, checkout; FastAPI/Python, port 8010
