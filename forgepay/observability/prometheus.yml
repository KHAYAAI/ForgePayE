# Prometheus Configuration for ForgePay Platform
# Global scrape configuration with per-service metrics endpoints

global:
  scrape_interval: 30s        # Default scrape interval
  evaluation_interval: 30s    # How often to evaluate alerting rules
  external_labels:
    cluster: 'forgepay-local'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"  # Uncomment to enable alerting rules

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Unified Router (TypeScript/Fastify)
  - job_name: 'unified-router'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: 'unified-router'
          type: 'webhook-normalizer'
          language: 'typescript'
    relabel_configs:
      - source_labels: [__scheme__]
        replacement: 'http'
        target_label: __scheme__

  # MoR Layer (Python/FastAPI)
  - job_name: 'mor-layer'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:8010']
        labels:
          service: 'mor-layer'
          type: 'checkout-engine'
          language: 'python'

  # Billing Engine (Java/Kill Bill)
  - job_name: 'billing-engine'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:8020']
        labels:
          service: 'billing-engine'
          type: 'subscriptions'
          language: 'java'

  # Stablecoin Gateway (TypeScript)
  - job_name: 'stablecoin-gateway'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:8021']
        labels:
          service: 'stablecoin-gateway'
          type: 'payment-processor'
          language: 'typescript'

  # Crypto Gateway (TypeScript)
