<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FORGE Console — The Revenue Ontology</title>
<meta name="description" content="End-to-end demo console for the FORGE platform: payments, treasury, custody, wallet, stablecoin rails and the AI agent credit bureau — all resolving to one canonical event."/>
<style>
/* ══ FORGE console — editorial cream/ink system, matched to forgepay.io ══
   Paper #F4F2EE · Ink #0A0A0A · hairline grids · no radii · mono micro-labels
   Fonts: Inter Tight / JetBrains Mono are CDN-blocked in hosted artifacts,
   so the closest system stacks stand in. Swap the two @font-face rules in
   when self-hosting the real faces. */
:root{
  --ink:#0A0A0A; --ink-2:#1A1A1A; --ink-3:#242424;
  --paper:#F4F2EE; --paper-deep:#ECE8E0; --paper-soft:#EFEBE3;
  --steel:#6F6A62; --steel-2:#8B8579;
  --hair:#C9C3B7; --hair-lite:rgba(244,242,238,0.18);
  --on-ink:rgba(244,242,238,0.78); --on-ink-dim:rgba(244,242,238,0.5);
  /* validated categorical series — light mode, surface #F4F2EE */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#1baf7a; --warn:#eda100; --bad:#C4322F;
  --sans:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  --pad:clamp(18px,3vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.mono{font-family:var(--mono);letter-spacing:1.4px;text-transform:uppercase;font-size:11px;color:var(--steel)}
.num{font-variant-numeric:tabular-nums}

/* ── Shell ─────────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.sidebar{background:var(--paper);border-right:1px solid var(--hair);padding:20px 0 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 20px 20px;border-bottom:1px solid var(--hair);margin-bottom:6px}
.brand svg{display:block;flex:none}
.brand .sub{font-family:var(--mono);font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--steel);margin-top:3px}
.nav-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--steel-2);padding:16px 20px 7px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 20px;font-size:13.5px;width:100%;text-align:left;color:var(--ink-2);position:relative;transition:background .12s}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.65}
.nav-item:hover{background:var(--paper-deep)}
.nav-item.active{background:var(--ink);color:var(--paper)}
.nav-item.active svg{opacity:1}
.nav-item .flag{margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:1px;background:var(--ink);color:var(--paper);padding:1px 5px}
.nav-item.active .flag{background:var(--paper);color:var(--ink)}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--hair);padding-top:8px}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px 20px;width:100%;text-align:left}
.user-chip:hover{background:var(--paper-deep)}
.avatar{width:30px;height:30px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:11px;flex:none}
.user-meta{min-width:0}
.user-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-mail{font-family:var(--mono);font-size:9.5px;letter-spacing:.6px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none}

/* ── Topbar ────────────────────────────────────────────────────────── */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:0 var(--pad);height:60px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:rgba(244,242,238,0.9);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);z-index:40}
.burger{display:none;border:1px solid var(--hair);width:36px;height:36px;align-items:center;justify-content:center}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel)}
.crumb b{color:var(--ink);font-weight:500}
.top-spacer{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);padding:7px 12px;min-width:200px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--steel)}
.searchbox:hover{border-color:var(--ink)}
.searchbox kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--hair);padding:1px 5px;margin-left:auto}
.icon-btn{width:36px;height:36px;border:1px solid var(--hair);display:grid;place-items:center;color:var(--ink);position:relative}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;background:var(--bad)}
.envsel{display:flex;align-items:center;gap:7px;border:1px solid var(--hair);padding:7px 11px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase}
.envsel:hover{border-color:var(--ink)}
.envsel .lamp{width:6px;height:6px;background:var(--good)}
.envsel.live .lamp{background:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;padding:11px 18px;border:1px solid var(--ink);transition:opacity .15s}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--paper)}
.btn-ink:hover{opacity:.82}
.btn-sm{padding:6px 11px;font-size:9.5px;letter-spacing:1.3px}
.btn-danger{border-color:var(--bad);color:var(--bad)}
.btn-danger:hover{background:var(--bad);color:var(--paper)}
.btn[disabled]{opacity:.42;cursor:default}
.on-ink .btn-ghost{border-color:var(--paper);color:var(--paper)}
.on-ink .btn-ghost:hover{background:var(--paper);color:var(--ink)}
.on-ink .btn-ink{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* ── Page frame ────────────────────────────────────────────────────── */
.page{padding:26px var(--pad) 72px;max-width:1300px;width:100%;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.eye{display:flex;align-items:center;gap:11px}
.eye .tick{width:22px;height:1px;background:var(--steel)}
.eye-light .tick{background:var(--on-ink-dim)}
.eye-light .mono{color:var(--on-ink-dim)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:10px 0 26px;flex-wrap:wrap}
.page-head h1{font-size:clamp(28px,3.4vw,42px);font-weight:500;letter-spacing:-1.4px;line-height:1}
.page-head h1 em{font-style:italic;font-weight:300}
.page-sub{color:var(--steel);font-size:14px;margin-top:9px;max-width:62ch}

/* hairline grids — the core structural device */
.grid{display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair)}
/* min-width:0 is load-bearing — grid children default to min-content, which
   lets a wide table inside a cell push the whole page sideways. */
.grid > *{background:var(--paper);min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.gap{display:grid;gap:16px;background:none;border:0}
.gap > *{background:none;min-width:0}
/* two-column page splits — declared here, never inline, so the collapse
   breakpoints actually win the cascade */
.split,.split-r{display:grid;gap:16px}
.split{grid-template-columns:1.35fr 1fr}
.split-r{grid-template-columns:1fr 380px}
.split > *,.split-r > *{min-width:0}
@media (max-width:1080px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1000px){.split,.split-r{grid-template-columns:1fr}}
@media (max-width:640px){.g5,.g4,.g3,.g2{grid-template-columns:1fr}}

.card{border:1px solid var(--hair);background:var(--paper);padding:20px}
.card.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:4px}
.card h3{font-size:17px;font-weight:500;letter-spacing:-.3px}
.card .sub{color:var(--steel);font-size:12.5px;margin-top:3px}
.card.ink .sub{color:var(--on-ink-dim)}

/* KPI cell */
.kpi{padding:20px}
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--steel)}
.kpi .v{font-size:clamp(26px,2.8vw,34px);font-weight:500;letter-spacing:-1.2px;margin-top:8px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--steel)}
.kpi .d.up{color:var(--good)}.kpi .d.down{color:var(--bad)}

/* status marks — sharp rectangles, never rounded */
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;padding:2px 7px;border:1px solid var(--hair);color:var(--steel);white-space:nowrap}
.tag::before{content:'';width:5px;height:5px;background:currentColor;flex:none}
.tag-good{color:#137a55;border-color:#137a55}
.tag-warn{color:#8a5f00;border-color:#8a5f00}
.tag-bad{color:var(--bad);border-color:var(--bad)}
.tag-info{color:#1f5ea8;border-color:#1f5ea8}
.tag-solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag-solid::before{background:var(--paper)}
.tag-flat::before{display:none}
.on-ink .tag{border-color:var(--hair-lite);color:var(--on-ink)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--hair)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel);font-weight:400;text-align:left;padding:11px 16px;border-bottom:1px solid var(--hair);white-space:nowrap;background:var(--paper-soft)}
td{padding:12px 16px;border-bottom:1px solid var(--hair);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--paper-soft)}
tr.clickable{cursor:pointer}
.t-right{text-align:right}
.t-num{font-variant-numeric:tabular-nums;text-align:right}

/* bars & meters */
.meter{height:6px;background:var(--paper-deep);border:1px solid var(--hair);overflow:hidden;min-width:72px}
.meter>i{display:block;height:100%}
.dial{position:relative;flex:none}
.dial svg{transform:rotate(-90deg);display:block}
.dial .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.5px}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--hair)}
.tl-i{position:relative;padding-bottom:16px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:-23px;top:5px;width:9px;height:9px;background:var(--ink)}
.tl-i.neg::before{background:var(--bad)}
.tl-i.neu::before{background:var(--paper);border:1px solid var(--steel)}
.tl-d{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;color:var(--steel)}
.tl-t{font-size:13.5px;font-weight:500;margin-top:2px}
.tl-s{font-family:var(--mono);font-size:11px;color:var(--steel);margin-top:2px}

/* pipeline (used by end-to-end run, CRE, verify) */
.pipe{display:flex;flex-direction:column}
.pipe-step{display:flex;gap:14px;align-items:flex-start}
.pipe-rail{display:flex;flex-direction:column;align-items:center;flex:none}
.pipe-dot{width:26px;height:26px;border:1px solid var(--hair);display:grid;place-items:center;font-family:var(--mono);font-size:10px;background:var(--paper);color:var(--steel);transition:all .2s}
.pipe-line{width:1px;flex:1;min-height:20px;background:var(--hair)}
.pipe-step.done .pipe-dot{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pipe-step.run .pipe-dot{border-color:var(--ink);color:var(--ink);animation:blink 1s steps(2,end) infinite}
.pipe-step.fail .pipe-dot{background:var(--bad);border-color:var(--bad);color:var(--paper)}
@keyframes blink{50%{background:var(--ink);color:var(--paper)}}
.pipe-body{padding-bottom:20px;min-width:0;flex:1}
.pipe-t{font-size:14px;font-weight:500}
.pipe-d{font-size:12.5px;color:var(--steel);margin-top:2px}
.pipe-out{font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:7px;border-left:2px solid var(--ink);padding:5px 0 5px 10px;background:var(--paper-soft);white-space:pre-wrap;word-break:break-word;display:none}
.pipe-step.done .pipe-out,.pipe-step.fail .pipe-out{display:block}
.pipe-step.fail .pipe-out{border-left-color:var(--bad)}

/* code */
.code{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11.5px;line-height:1.75;padding:16px 18px;overflow-x:auto;position:relative;white-space:pre}
.code .c{color:var(--on-ink-dim)}
.code .k{color:#8FC7F5}
.code b{font-weight:700;color:#fff}
.copy{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;padding:3px 8px;border:1px solid var(--hair-lite);color:var(--on-ink)}
.copy:hover{background:var(--paper);color:var(--ink)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:90;display:grid;place-items:center;animation:fade .12s;padding:20px}
.modal{background:var(--paper);border:1px solid var(--ink);width:min(560px,96vw);max-height:88vh;overflow-y:auto;padding:28px;position:relative}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--paper);border-left:1px solid var(--ink);z-index:95;overflow-y:auto;padding:28px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.close-x{position:absolute;top:16px;right:16px;width:30px;height:30px;border:1px solid var(--hair);display:grid;place-items:center}
.close-x:hover{border-color:var(--ink)}

/* cmdk */
.cmdk{position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:100;display:flex;justify-content:center;padding:12vh 20px 20px}
.cmdk-panel{background:var(--paper);border:1px solid var(--ink);width:min(580px,100%);height:fit-content;max-height:62vh;overflow:hidden;display:flex;flex-direction:column}
.cmdk-in{background:transparent;border:0;border-bottom:1px solid var(--hair);padding:17px 20px;font-size:15px;outline:none;width:100%}
.cmdk-list{overflow-y:auto;padding:6px}
.cmdk-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;font-size:13.5px}
.cmdk-i:hover,.cmdk-i.sel{background:var(--ink);color:var(--paper)}
.cmdk-i .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--steel)}
.cmdk-i:hover .k,.cmdk-i.sel .k{color:var(--on-ink-dim)}

/* toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(380px,90vw)}
.toast{background:var(--ink);color:var(--paper);border-left:3px solid var(--paper);padding:12px 16px;font-size:12.5px;animation:slide .18s}
.toast.err{border-left-color:var(--bad)}
.toast .lbl{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--on-ink-dim);display:block;margin-bottom:3px}

/* chart tooltip */
.ctip{position:fixed;background:var(--ink);color:var(--paper);padding:7px 11px;font-family:var(--mono);font-size:11px;pointer-events:none;z-index:80;display:none;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--steel);font-family:var(--mono);letter-spacing:.8px;text-transform:uppercase}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:-1px}

/* misc */
.empty{padding:64px 20px;text-align:center;color:var(--steel);border:1px solid var(--hair)}
.empty h4{font-size:17px;font-weight:500;color:var(--ink);margin-bottom:6px;letter-spacing:-.3px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrap-f{flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:14px}
.hr{border:0;border-top:1px solid var(--hair);margin:18px 0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb16{margin-bottom:16px}
.muted{color:var(--steel)}.fs12{font-size:12px}.fs13{font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel)}
.input,.select{background:var(--paper);border:1px solid var(--hair);padding:10px 13px;font-size:14px;width:100%;outline:none}
.input:focus,.select:focus{border-color:var(--ink)}
.input::placeholder{color:var(--steel-2)}
.input.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.4px;text-transform:none}
.checkline{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:3px 0}

/* stat list rows (OS-layer style) */
.rows{display:flex;flex-direction:column}
.rows .r{display:grid;grid-template-columns:150px 1fr auto;gap:18px;padding:15px 0;border-top:1px solid var(--hair);align-items:center}
.rows .r:last-child{border-bottom:1px solid var(--hair)}
.rows .rn{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel)}
.rows .rd{font-size:15px;font-weight:500;letter-spacing:-.2px}
.rows .rd span{color:var(--steel);font-weight:400;font-size:13px}
@media (max-width:640px){.rows .r{grid-template-columns:1fr;gap:6px}}

/* integration cell */
.int{padding:22px;display:flex;flex-direction:column;gap:12px;min-height:214px}
.int-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.int-logo{width:34px;height:34px;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600}
.int h4{font-size:16px;font-weight:500;letter-spacing:-.2px}
.int p{font-size:12.5px;color:var(--steel);line-height:1.55}
.int .st{font-family:var(--mono);font-size:10px;letter-spacing:.8px;color:var(--ink);border-left:2px solid var(--ink);padding-left:9px}
.int-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px solid var(--hair)}
.tabs{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--hair);width:fit-content;max-width:100%}
.tab{padding:8px 15px;font-family:var(--mono);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--steel);border-right:1px solid var(--hair)}
.tab:last-child{border-right:0}
.tab.on{background:var(--ink);color:var(--paper)}
.tab .n{opacity:.55;margin-left:5px}

/* endpoint accordion */
.ep{border:1px solid var(--hair)}
.ep + .ep{border-top:0}
.ep-h{display:flex;align-items:center;gap:14px;padding:13px 18px;width:100%;text-align:left}
.ep-h:hover{background:var(--paper-soft)}
.meth{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;padding:2px 7px;border:1px solid currentColor;flex:none}
.m-get{color:#1f5ea8}.m-post{color:#137a55}.m-del{color:var(--bad)}
.ep-p{font-family:var(--mono);font-size:12.5px;letter-spacing:.3px}
.ep-d{margin-left:auto;font-size:12.5px;color:var(--steel);text-align:right}

/* checkout simulator */
.checkout{border:1px solid var(--ink);max-width:400px}
.checkout-h{background:var(--ink);color:var(--paper);padding:13px 18px;display:flex;align-items:center;justify-content:space-between}
.checkout-b{padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.pay-opt{border:1px solid var(--hair);padding:12px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:border-color .12s}
.pay-opt:hover{border-color:var(--steel)}
.pay-opt.on{border-color:var(--ink);background:var(--paper-soft)}
.pay-opt .rd{width:13px;height:13px;border:1px solid var(--ink);flex:none;position:relative}
.pay-opt.on .rd::after{content:'';position:absolute;inset:2px;background:var(--ink)}
.pay-opt .nm{font-size:13.5px;font-weight:500}
.pay-opt .fee{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--steel)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:246px;z-index:70;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(10,10,10,.2)}
  .sidebar.open{transform:none}
  .burger{display:flex}
  .scrim{position:fixed;inset:0;background:rgba(10,10,10,.4);z-index:65}
  /* topbar sheds the optional controls before it can push the page sideways */
  .searchbox,.envsel{display:none}
  .page-head h1{font-size:30px}
}
@media (max-width:560px){
  .topbar .btn-ink{padding:9px 12px;font-size:9.5px}
  .crumb b{display:block}
}

 const m=document.querySelector('.pay-opt.on .nm').textContent;
 btn.disabled=true;out.innerHTML='';
 const seq=m==='Card'?[['Routing → Peach Payments…',600],['Peach timeout 4.1s — advancing chain',900],['Stripe approved · auth A7Q41B',700],['✓ Settled · evt_01HQZ9F2K',400]]
  :m.indexOf('Bank')>-1?[['Opening Stitch bank consent…',700],['Consent granted · debit queued',800],['✓ Pending EFT clearing (T+1)',400]]
  :[['Quoting USDC on Base…',600],['Rate locked · 18.2140 ZAR/USD',700],['✓ Settled on Base · 0x9c41ab…',500]];
 let i=0;
 const step=()=>{if(i>=seq.length){btn.disabled=false;
   toast(m==='Card'?'Card captured after one fallback hop.':m.indexOf('Bank')>-1?'EFT queued — clears T+1.':'USDC settled on Base.','Checkout');return}

  out.appendChild(d);setTimeout(step,seq[i][1]);i++};
 step()}

P.webhooks=()=>{
 const h=store.hooks;
 return head('XVIII','Developers · delivery','One delivery. <em>Not</em> a dozen.',
  'Replace every vendor webhook with a single deduplicated, replayable, HMAC-signed delivery from the canonical log.',
  `<button class="btn btn-ink" onclick="openHook()">＋ Add endpoint</button>`)+
 `<div class="card mb16"><h3>Endpoints</h3>
  <div class="stack mt16">${h.map((x,i)=>`<div class="row spread wrap-f" style="border:1px solid var(--hair);padding:14px 16px;gap:12px">
   <div style="min-width:0;flex:1"><div class="mono" style="text-transform:none;letter-spacing:.3px;font-size:12px;overflow:hidden;text-overflow:ellipsis">${esc(x.url)}</div>
    <div class="row wrap-f mt8" style="gap:6px">${x.ev.map(e=>`<span class="tag tag-flat">${e}</span>`).join('')}</div></div>
   <div class="row" style="flex:none">${x.on?st('Active'):st('Pending')}
    <button class="btn btn-ghost btn-sm" onclick="tglHook(${i})">${x.on?'Disable':'Enable'}</button></div></div>`).join('')}</div></div>
 <div class="card mb16" style="border:0;padding:0"><h3 style="margin-bottom:4px">Recent deliveries</h3>
  <div class="sub" style="margin-bottom:14px">Failures retry with exponential backoff, up to six attempts over 72 hours</div>
  <div class="tbl-wrap"><table><thead><tr><th>Event</th><th>Endpoint</th><th class="t-right">Attempt</th><th>Response</th><th>Latency</th><th>When</th></tr></thead>
  <tbody>${[['payment.succeeded','…/webhooks/forge',1,'200 OK','118ms','12:41:08'],
    ['score.updated','…/hooks/bureau',1,'200 OK','94ms','12:40:02'],
    ['payment.failed','…/webhooks/forge',1,'200 OK','131ms','12:28:18'],
    ['dispute.filed','…/hooks/bureau',2,'200 OK','2.1s','10:14:55'],
    ['treasury.netted','…/hooks/bureau',1,'200 OK','88ms','09:58:41']]
   .map(r=>`<tr><td class="mono" style="text-transform:none;font-size:11.5px">${r[0]}</td>
    <td class="mono muted" style="text-transform:none;font-size:11px">${r[1]}</td><td class="t-num">${r[2]}</td>

 <div class="card"><h3>Verify the signature</h3><div class="sub">Never process an unverified payload</div>
  <div class="code mt16"><span class="c">// Node — constant-time comparison</span>
<span class="k">const</span> sig = crypto.createHmac(<b>'sha256'</b>, process.env.FORGE_WEBHOOK_SECRET)
  .update(rawBody).digest(<b>'hex'</b>);

<span class="k">if</span> (!crypto.timingSafeEqual(
      Buffer.from(sig),
      Buffer.from(req.headers[<b>'x-forge-signature'</b>]))) {
  <span class="k">return</span> res.status(<b>401</b>).end();
}<button class="copy" onclick="copyText('crypto.createHmac(\\'sha256\\', process.env.FORGE_WEBHOOK_SECRET).update(rawBody).digest(\\'hex\\')',this)">Copy</button></div></div>`};
function tglHook(i){const h=store.hooks;h[i].on=!h[i].on;store.hooks=h;render();
 toast(h[i].on?'Endpoint enabled.':'Endpoint disabled — events queue for 72 hours.','Webhooks')}

function openCmdk(){
 const items=Object.keys(META).map(r=>({t:META[r][1],k:META[r][0],go:()=>go(r)}))
  .concat(AGENTS.map(a=>({t:a.id,k:'Agent',go:()=>{go('agents');setTimeout(()=>openAgent(a.id),90)}})))
  .concat(EVENTS.slice(0,6).map(e=>({t:e.id+' · '+e.type,k:'Event',go:()=>{go('events');setTimeout(()=>openEvent(e.id),90)}})));
 $('#portal').innerHTML=`<div class="cmdk" onclick="if(event.target===this)closePortal()"><div class="cmdk-panel">
  <input class="cmdk-in" id="ck" placeholder="Search pages, agents, events…" autocomplete="off"/>
  <div class="cmdk-list" id="ckl"></div></div></div>`;
 const inp=$('#ck'),list=$('#ckl');let sel=0,cur=items;
 const draw=()=>{list.innerHTML=cur.length?cur.map((x,i)=>`<button class="cmdk-i ${i===sel?'sel':''}" data-i="${i}">${esc(x.t)}<span class="k">${x.k}</span></button>`).join('')
   :'<div class="empty" style="border:0;padding:30px">No matches</div>';
  [].slice.call(list.querySelectorAll('.cmdk-i')).forEach(b=>b.onclick=()=>{const f=cur[+b.dataset.i].go;closePortal();f()})};
 inp.oninput=()=>{cur=items.filter(x=>x.t.toLowerCase().indexOf(inp.value.toLowerCase())>-1);sel=0;draw()};
 inp.onkeydown=e=>{
  if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,cur.length-1);draw()}
  else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);draw()}
  else if(e.key==='Enter'&&cur[sel]){const f=cur[sel].go;closePortal();f()}
  else if(e.key==='Escape')closePortal()};
 draw();inp.focus()}
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openCmdk()}
 else if(e.key==='Escape'&&$('#portal').innerHTML)closePortal()});
