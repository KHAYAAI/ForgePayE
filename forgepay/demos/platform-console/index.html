<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgePay Console — Payment &amp; Credit Infrastructure</title>
<style>
/* ── ForgePay console: committed dark world (ops console, navy ground) ───── */
:root{
  --bg:#071B2E; --bg-deep:#051523; --surface:#0C2740; --surface-2:#102F4D;
  --border:rgba(148,197,255,.10); --border-strong:rgba(148,197,255,.22);
  --ink:#EAF3FB; --ink-2:#9DB4C8; --ink-3:#5F7A91;
  --accent:#00F0FF; --accent-dim:rgba(0,240,255,.12); --accent-ink:#062B33;
  --good:#2FBF71; --warn:#E5A50A; --bad:#E5484D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
::selection{background:rgba(0,240,255,.25)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── Shell ── */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--bg-deep);border-right:1px solid var(--border);padding:20px 12px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0A2540,#0F3D5C);border:1px solid var(--border-strong);display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:15px}
.brand-name{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand-name span{color:var(--accent)}
.brand-sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:13.5px;width:100%;text-align:left;position:relative}
.nav-item svg{width:16px;height:16px;flex:none;opacity:.85}
.nav-item:hover{background:var(--surface);color:var(--ink)}
.nav-item.active{background:var(--surface);color:var(--ink)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:10px}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px}
.user-chip:hover{background:var(--surface)}
.avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#7c3f18,#b0651f);display:grid;place-items:center;font-size:15px}
.user-meta{min-width:0}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-mail{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Topbar ── */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(7,27,46,.92);backdrop-filter:blur(10px);z-index:40}
.topbar-title{font-weight:600;font-size:15px;padding-left:12px;border-left:1px solid var(--border-strong)}
.top-spacer{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;min-width:220px;color:var(--ink-3);font-size:13px;cursor:pointer}
.searchbox kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:4px;padding:1px 5px;margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn:hover{color:var(--ink);border-color:var(--border-strong)}
.icon-btn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.chain-sel{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid transparent;transition:all .15s}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:#66F6FF}
.btn-ghost{background:var(--surface);border-color:var(--border-strong);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-danger{background:rgba(229,72,77,.14);color:#ff8a8e;border-color:rgba(229,72,77,.35)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}

/* ── Page ── */
.page{padding:26px 28px 60px;max-width:1240px;width:100%;margin:0 auto;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:4px 0 24px}
.page-head h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.page-sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.sidebar{display:none}}

/* KPI tiles */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.kpi-label{font-size:11.5px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.kpi-val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:6px}
.kpi-delta{font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--ink-3)}

/* Pills & badges */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.7}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-good{background:rgba(47,191,113,.12);color:#5fd99a}
.pill-warn{background:rgba(229,165,10,.12);color:#f0c04a}
.pill-bad{background:rgba(229,72,77,.13);color:#ff8a8e}
.pill-info{background:rgba(57,135,229,.14);color:#7db4f5}
.pill-idle{background:rgba(148,197,255,.08);color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.badge-core{background:rgba(57,135,229,.16);color:#7db4f5}
.badge-avail{background:rgba(148,197,255,.08);color:var(--ink-2)}
.badge-conn{background:rgba(47,191,113,.13);color:#5fd99a}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;text-align:left;padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(148,197,255,.04)}
tr.clickable{cursor:pointer}
.t-right{text-align:right}

/* Score visuals */
.score-ring{position:relative;width:64px;height:64px;flex:none}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.tier{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:5px}

/* Integration cards */
.int-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.int-card:hover{border-color:var(--border-strong)}
.int-logo{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff}
.int-stat{background:rgba(57,135,229,.09);border:1px solid rgba(57,135,229,.2);border-radius:7px;padding:7px 11px;font-size:12px;color:#7db4f5;display:flex;align-items:center;gap:7px}
.int-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--border)}
.tab .n{color:var(--ink-3);font-weight:500;margin-left:5px}
.tab.on{background:var(--ink);color:var(--bg-deep);border-color:var(--ink)}
.tab.on .n{color:rgba(7,27,46,.6)}

/* Inputs */
.input,.select{background:var(--bg-deep);border:1px solid var(--border-strong);border-radius:8px;padding:9px 13px;font-size:13.5px;width:100%;outline:none;transition:border-color .15s}
.input:focus,.select:focus{border-color:var(--accent)}
.input::placeholder{color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.mono-input{font-family:var(--mono);font-size:13px}

/* Timeline */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--border-strong)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--s3);border:2px solid var(--bg-deep)}
.tl-item.neg::before{background:var(--bad)}
.tl-item.neu::before{background:var(--ink-3)}
.tl-date{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.tl-desc{font-size:13px;font-weight:550}
.tl-amt{font-size:12px;color:var(--ink-2);font-family:var(--mono)}

/* Factors */
.factor{background:var(--bg-deep);border:1px solid var(--border);border-left:3px solid var(--s3);border-radius:8px;padding:13px 15px}
.factor.neg{border-left-color:var(--bad)}
.factor.neu{border-left-color:var(--ink-3)}
.factor .code{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.03em}
.factor .desc{font-size:13px;margin-top:3px}
.factor .w{font-size:11px;color:var(--ink-3);margin-top:4px}

/* Modal & drawer */
.overlay{position:fixed;inset:0;background:rgba(3,12,20,.7);backdrop-filter:blur(3px);z-index:90;display:grid;place-items:center;animation:fadein .12s}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;width:min(520px,92vw);max-height:86vh;overflow-y:auto;padding:24px}
.modal h3{font-size:17px;margin-bottom:4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--bg-deep);border-left:1px solid var(--border-strong);z-index:95;overflow-y:auto;padding:26px;animation:slidein .2s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.close-x{position:absolute;top:16px;right:16px}

/* Search overlay */
.cmdk{position:fixed;inset:0;background:rgba(3,12,20,.7);backdrop-filter:blur(3px);z-index:100;display:flex;justify-content:center;padding-top:12vh}
.cmdk-panel{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;width:min(560px,92vw);height:fit-content;max-height:60vh;overflow:hidden;display:flex;flex-direction:column}
.cmdk-input{background:transparent;border:none;border-bottom:1px solid var(--border);padding:16px 18px;font-size:15px;outline:none;width:100%}
.cmdk-list{overflow-y:auto;padding:8px}
.cmdk-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-size:13.5px}
.cmdk-item:hover,.cmdk-item.sel{background:var(--surface-2)}
.cmdk-item .k{margin-left:auto;font-size:11px;color:var(--ink-3)}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-2);border:1px solid var(--border-strong);border-left:3px solid var(--good);border-radius:9px;padding:11px 16px;font-size:13px;min-width:240px;animation:slidein .18s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--bad)}

/* Charts */
.chart-tip{position:fixed;background:var(--bg-deep);border:1px solid var(--border-strong);border-radius:7px;padding:7px 11px;font-size:12px;pointer-events:none;z-index:80;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.chart-tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Workflow / scoring */
.wf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.wf-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.wf-stat .l{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.wf-stat .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.pipe{display:flex;flex-direction:column;gap:0;margin-top:14px}
.pipe-step{display:flex;gap:12px;align-items:flex-start}
.pipe-rail{display:flex;flex-direction:column;align-items:center;flex:none}
.pipe-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;font-size:11px;background:var(--bg-deep);transition:all .2s}
.pipe-line{width:2px;flex:1;min-height:22px;background:var(--border-strong)}
.pipe-step.done .pipe-dot{border-color:var(--good);color:var(--good)}
.pipe-step.run .pipe-dot{border-color:var(--accent);color:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(0,240,255,.12)}}
.pipe-body{padding-bottom:18px;min-width:0}
.pipe-t{font-size:13px;font-weight:600}
.pipe-d{font-size:12px;color:var(--ink-2)}
.pipe-r{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* Docs */
.endpoint{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.ep-head{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer}
.method{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.m-get{background:rgba(57,135,229,.16);color:#7db4f5}
.m-post{background:rgba(47,191,113,.13);color:#5fd99a}
.m-del{background:rgba(229,72,77,.13);color:#ff8a8e}
.codeblock{background:var(--bg-deep);border-top:1px solid var(--border);padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto;position:relative;color:#b8d4ea;white-space:pre}
.copy-btn{position:absolute;top:10px;right:10px;font-size:11px;padding:3px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--border-strong);color:var(--ink-2)}
.copy-btn:hover{color:var(--ink)}

/* Verify gauge */
.gauge-wrap{display:flex;align-items:center;gap:24px}
.check-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.check-row:last-child{border-bottom:none}
.check-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px}
.ci-ok{background:rgba(47,191,113,.14);color:#5fd99a}
.ci-run{background:var(--accent-dim);color:var(--accent);animation:pulse 1s infinite}
.ci-wait{background:var(--surface-2);color:var(--ink-3)}
.ci-bad{background:rgba(229,72,77,.14);color:#ff8a8e}

.empty{padding:70px 20px;text-align:center;color:var(--ink-2)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.6}
.empty h4{font-size:16px;color:var(--ink);margin-bottom:5px}
.hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb16{margin-bottom:16px}
.muted{color:var(--ink-2)}.dim{color:var(--ink-3)}
.fs12{font-size:12px}.fs13{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="icon-btn" title="Toggle sidebar" onclick="toast('Sidebar pinned in demo')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></button>
      <div class="topbar-title" id="topTitle">Overview</div>
      <div class="top-spacer"></div>
      <button class="searchbox" onclick="openCmdk()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>Search…<kbd>⌘K</kbd></button>
      <button class="chain-sel" id="chainBtn" onclick="cycleChain()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg><span id="chainName">All Chains</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
      <button class="icon-btn" onclick="toggleNotif(event)" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot"></span></button>
      <button class="btn btn-primary" onclick="connectWallet()" id="walletBtn">Connect Wallet</button>
    </div>
    <main id="page"></main>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>
<div class="chart-tip" id="chartTip"></div>
<div id="portal"></div>

<script>
/* ═══════════════ DATA — mirrors the live agent-credit-bureau seed ═══════════════ */
const GRADES=[
 {min:950,g:'AAA',risk:'Minimal',mean:'Exceptional track record, highest trust',c:'#15803D',ig:true},
 {min:900,g:'AA',risk:'Very Low',mean:'Excellent history, very reliable',c:'#16A34A',ig:true},
 {min:850,g:'A',risk:'Low',mean:'Strong performance, trustworthy',c:'#22C55E',ig:true},
 {min:750,g:'BBB',risk:'Moderate',mean:'Good standing, investment grade',c:'#84CC16',ig:true},

/* Charts: area + bars with hover tooltips */
function areaChart(data,{w=560,h=170,color='var(--s1)',label='payments',prefix='R ',suffix='K'}={}){
 const max=Math.max(...data)*1.15,step=w/(data.length-1);
 const pts=data.map((v,i)=>[i*step,h-(v/max)*h]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const area=line+` L ${w} ${h} L 0 ${h} Z`;
 const gid='g'+Math.random().toString(36).slice(2,7);
 const hits=pts.map((p,i)=>`<rect x="${(p[0]-step/2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${h}" fill="transparent" data-i="${i}" class="ah"/>`).join('');
 return `<div class="area-chart" data-vals="${data.join(',')}" data-prefix="${prefix}" data-suffix="${suffix}" data-label="${label}" style="position:relative">
  <svg viewBox="0 0 ${w} ${h+22}" style="width:100%;display:block;overflow:visible">
   <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
   ${[0.25,0.5,0.75].map(f=>`<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`).join('')}
   <path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
   <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="var(--border-strong)" stroke-width="1"/>
   <text x="0" y="${h+16}" fill="var(--ink-3)" font-size="10" font-family="var(--mono)">−30d</text>
   <text x="${w}" y="${h+16}" fill="var(--ink-3)" font-size="10" text-anchor="end" font-family="var(--mono)">today</text>
   <g class="hitzone" cursor="crosshair">${hits}</g>
  </svg></div>`}
function barChart(rows,{h=150,colorFn}={}){
 const max=Math.max(...rows.map(r=>r.n),1);
 return `<div style="display:grid;grid-template-columns:repeat(${rows.length},1fr);gap:8px;align-items:end;height:${h}px">
  ${rows.map((r,i)=>{const bh=Math.max((r.n/max)*(h-38),r.n?8:2);const c=colorFn?colorFn(r,i):'var(--s1)';
   return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%" title="${r.b}: ${r.n}">
    <span class="fs12 num" style="color:var(--ink-2)">${r.n}</span>
    <div style="width:100%;max-width:44px;height:${bh}px;background:${c};border-radius:4px 4px 0 0;opacity:${r.n?1:.25}"></div>
    <span style="font-size:10px;color:var(--ink-3);font-family:var(--mono)">${r.b}</span></div>`}).join('')}</div>`}
document.addEventListener('mousemove',e=>{
 const tip=$('#chartTip');const hit=e.target.closest?.('.ah');
 if(hit){const wrap=hit.closest('.area-chart');const vals=wrap.dataset.vals.split(',').map(Number);const i=+hit.dataset.i;
  tip.style.display='block';tip.innerHTML=`Day ${i-29<0?i-29:'0'} · <b>${wrap.dataset.prefix}${vals[i]}${wrap.dataset.suffix}</b> ${wrap.dataset.label}`;
  tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';}
 else tip.style.display='none';});

  <div class="grid g4 mt16">${WORKFLOWS.map(w=>`<div style="border:1px solid var(--border);border-radius:8px;padding:13px 15px"><div class="fs13" style="font-weight:650">${w.n}</div><div class="mono fs12 dim mt8">${w.w}% weight</div></div>`).join('')}</div>

 </div>`;
function runScoring(){
 const id=$('#creAgent').value,a=AGENTS.find(x=>x.id===id),btn=$('#creRun');
 btn.disabled=true;btn.textContent='Running…';
 const steps=[['Fetch on-chain data','Reading ReputationRegistry, TransactionValidator, BudgetEnforcer on Base'],['Reputation Oracle','AI-enhanced composite over payment + reputation events'],['Transaction Monitor','Anomaly scan across recorded transaction stream'],['Budget Alert','Utilization vs declared budget caps'],['Agent Verification','DID ownership, operator entity, sanctions screen'],['Publish score','Write score on-chain + emit score.updated webhook']];
 const el=$('#crePipe');
 el.innerHTML=`<div class="pipe mt24">${steps.map((s,i)=>`<div class="pipe-step" id="ps${i}"><div class="pipe-rail"><div class="pipe-dot">${i+1}</div>${i<steps.length-1?'<div class="pipe-line"></div>':''}</div><div class="pipe-body"><div class="pipe-t">${s[0]}</div><div class="pipe-d">${s[1]}</div><div class="pipe-r" id="pr${i}"></div></div></div>`).join('')}</div><div id="creResult"></div>`;
 let i=0;
 const tick=()=>{if(i>0){const prev=document.getElementById('ps'+(i-1));if(prev){prev.className='pipe-step done';prev.querySelector('.pipe-dot').textContent='✓';document.getElementById('pr'+(i-1)).textContent='done in '+(Math.random()*2+.4).toFixed(1)+'s'}}
  if(i>=steps.length){const drift=Math.floor(Math.random()*7)-3;const ns=Math.max(0,Math.min(1000,a.score+drift));const g=gradeOf(ns);
   document.getElementById('creResult').innerHTML=`<div class="row mt16" style="gap:18px;border:1px solid var(--border-strong);border-radius:10px;padding:16px 20px;background:var(--bg-deep)">${ring(ns,72)}<div><div style="font-weight:700;font-size:16px">${a.id} → ${ns} <span style="color:${g.c}">(${g.g})</span></div><div class="muted fs13">${drift===0?'No change':(drift>0?'+':'')+drift+' pts'} vs previous run · ${g.risk} risk · tx <span class="mono">0x${Math.random().toString(16).slice(2,10)}…</span> anchored on Base</div></div></div>`;
   btn.disabled=false;btn.textContent='⚡ Run Now';toast(`Score published for ${a.id}: ${ns} (${g.g})`);return}
  const cur=document.getElementById('ps'+i);cur.className='pipe-step run';i++;setTimeout(tick,650+Math.random()*550)};
 tick()}

 btn.disabled=true;btn.textContent='Verifying…';

 const secret='fp_live_'+Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b%62]).join('');
 const rec={name,scopes,created:'Just now',masked:secret.slice(0,11)+'…'+secret.slice(-4)};
 store.keys=[...store.keys,rec];
 $('#portal').innerHTML=`<div class="overlay"><div class="modal">

/* ═══════════════ CMD-K / NOTIFICATIONS ═══════════════ */
function openCmdk(){
 const items=[...Object.entries(TITLES).map(([r,t])=>({t,go:()=>go(r),k:'Page'})),
  ...AGENTS.map(a=>({t:a.id,go:()=>{go('agents');setTimeout(()=>openAgent(a.id),80)},k:'Agent'}))];
 $('#portal').innerHTML=`<div class="cmdk" onclick="if(event.target===this)closePortal()"><div class="cmdk-panel">
  <input class="cmdk-input" id="ckIn" placeholder="Search pages, agents…" autocomplete="off">
  <div class="cmdk-list" id="ckList"></div></div></div>`;
 const inp=$('#ckIn'),list=$('#ckList');let sel=0,cur=items;
 const draw=()=>{list.innerHTML=cur.map((x,i)=>`<button class="cmdk-item ${i===sel?'sel':''}" data-i="${i}">${esc(x.t)}<span class="k">${x.k}</span></button>`).join('')||'<div class="empty" style="padding:24px">No matches</div>';
  list.querySelectorAll('.cmdk-item').forEach(b=>b.onclick=()=>{closePortal();cur[+b.dataset.i].go()})};
 inp.oninput=()=>{cur=items.filter(x=>x.t.toLowerCase().includes(inp.value.toLowerCase()));sel=0;draw()};
 inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,cur.length-1);draw()}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw()}else if(e.key==='Enter'&&cur[sel]){closePortal();cur[sel].go()}else if(e.key==='Escape')closePortal()};
 draw();inp.focus()}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openCmdk()}});
function toggleNotif(e){e.stopPropagation();
 if($('#notifPop')){$('#notifPop').remove();return}
 const pop=document.createElement('div');pop.id='notifPop';
 pop.style.cssText='position:fixed;top:62px;right:90px;width:340px;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;z-index:110;padding:8px;box-shadow:0 14px 44px rgba(0,0,0,.5)';
 pop.innerHTML=`<div style="padding:8px 12px;font-weight:650;font-size:13px">Notifications</div>`+NOTIFS.map(n=>`
  <div style="padding:10px 12px;border-top:1px solid var(--border)"><div class="fs13" style="font-weight:600">${esc(n.t)}</div><div class="fs12 muted">${esc(n.d)}</div><div class="fs12 dim mt8">${n.time}</div></div>`).join('');
 document.body.appendChild(pop);
 setTimeout(()=>document.addEventListener('click',function h(ev){if(!pop.contains(ev.target)){pop.remove();document.removeEventListener('click',h)}}),0)}
