<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FORGE Console — The Revenue Ontology</title>
<meta name="description" content="End-to-end demo console for the FORGE platform: payments, treasury, custody, wallet, stablecoin rails and the AI agent credit bureau — all resolving to one canonical event."/>
<style>
/* ══ FORGE console — editorial cream/ink system, matched to forgepay.io ══
   Paper #F4F2EE · Ink #0A0A0A · hairline grids · no radii · mono micro-labels
   Fonts: Inter Tight / JetBrains Mono are CDN-blocked in hosted artifacts,
   so the closest system stacks stand in. Swap the two @font-face rules in
   when self-hosting the real faces. */
:root{
  --ink:#0A0A0A; --ink-2:#1A1A1A; --ink-3:#242424;
  --paper:#F4F2EE; --paper-deep:#ECE8E0; --paper-soft:#EFEBE3;
  --steel:#6F6A62; --steel-2:#8B8579;
  --hair:#C9C3B7; --hair-lite:rgba(244,242,238,0.18);
  --on-ink:rgba(244,242,238,0.78); --on-ink-dim:rgba(244,242,238,0.5);
  /* validated categorical series — light mode, surface #F4F2EE */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#1baf7a; --warn:#eda100; --bad:#C4322F;
  --sans:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  --pad:clamp(18px,3vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.mono{font-family:var(--mono);letter-spacing:1.4px;text-transform:uppercase;font-size:11px;color:var(--steel)}
.num{font-variant-numeric:tabular-nums}

/* ── Shell ─────────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.sidebar{background:var(--paper);border-right:1px solid var(--hair);padding:20px 0 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 20px 20px;border-bottom:1px solid var(--hair);margin-bottom:6px}
.brand svg{display:block;flex:none}
.brand .sub{font-family:var(--mono);font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--steel);margin-top:3px}
.nav-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--steel-2);padding:16px 20px 7px}
.nav-sec{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:14px 20px 6px}
.nav-sec:hover{color:var(--ink)}
.nav-sec .chev{font-family:var(--mono);font-size:11px;opacity:.7}
.nav-sec.open{color:var(--steel)}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 20px;font-size:13.5px;width:100%;text-align:left;color:var(--ink-2);position:relative;transition:background .12s}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.65}
.nav-item:hover{background:var(--paper-deep)}
.nav-item.active{background:var(--ink);color:var(--paper)}
.nav-item.active svg{opacity:1}
.nav-item .flag{margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:1px;background:var(--ink);color:var(--paper);padding:1px 5px}
.nav-item.active .flag{background:var(--paper);color:var(--ink)}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--hair);padding-top:8px}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px 20px;width:100%;text-align:left}
.user-chip:hover{background:var(--paper-deep)}
.avatar{width:30px;height:30px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:11px;flex:none}
.user-meta{min-width:0;display:block;flex:1}
.user-name,.user-mail{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-name{font-size:13px;font-weight:500}
.user-mail{font-family:var(--mono);font-size:9.5px;letter-spacing:.6px;color:var(--steel);text-transform:none}

/* ── Topbar ────────────────────────────────────────────────────────── */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:0 var(--pad);height:60px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:rgba(244,242,238,0.9);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);z-index:40}
.burger{display:none;border:1px solid var(--hair);width:36px;height:36px;align-items:center;justify-content:center}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel)}
.crumb b{color:var(--ink);font-weight:500}
.top-spacer{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);padding:7px 12px;min-width:200px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--steel)}
.searchbox:hover{border-color:var(--ink)}
.searchbox kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--hair);padding:1px 5px;margin-left:auto}
.icon-btn{width:36px;height:36px;border:1px solid var(--hair);display:grid;place-items:center;color:var(--ink);position:relative}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;background:var(--bad)}
.envsel{display:flex;align-items:center;gap:7px;border:1px solid var(--hair);padding:7px 11px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase}
.envsel:hover{border-color:var(--ink)}
.envsel .lamp{width:6px;height:6px;background:var(--good)}
.envsel.live .lamp{background:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;padding:11px 18px;border:1px solid var(--ink);transition:opacity .15s}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--paper)}
.btn-ink:hover{opacity:.82}
.btn-sm{padding:6px 11px;font-size:9.5px;letter-spacing:1.3px}
.btn-danger{border-color:var(--bad);color:var(--bad)}
.btn-danger:hover{background:var(--bad);color:var(--paper)}
.btn[disabled]{opacity:.42;cursor:default}
.on-ink .btn-ghost{border-color:var(--paper);color:var(--paper)}
.on-ink .btn-ghost:hover{background:var(--paper);color:var(--ink)}
.on-ink .btn-ink{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* ── Page frame ────────────────────────────────────────────────────── */
.page{padding:26px var(--pad) 72px;max-width:1300px;width:100%;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.eye{display:flex;align-items:center;gap:11px}
.eye .tick{width:22px;height:1px;background:var(--steel)}
.eye-light .tick{background:var(--on-ink-dim)}
.eye-light .mono{color:var(--on-ink-dim)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:10px 0 26px;flex-wrap:wrap}
.page-head h1{font-size:clamp(28px,3.4vw,42px);font-weight:500;letter-spacing:-1.4px;line-height:1}
.page-head h1 em{font-style:italic;font-weight:300}
.page-sub{color:var(--steel);font-size:14px;margin-top:9px;max-width:62ch}

/* hairline grids — the core structural device */
.grid{display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair)}
/* min-width:0 is load-bearing — grid children default to min-content, which
   lets a wide table inside a cell push the whole page sideways. */
.grid > *{background:var(--paper);min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.gap{display:grid;gap:16px;background:none;border:0}
.gap > *{background:none;min-width:0}
/* two-column page splits — declared here, never inline, so the collapse
   breakpoints actually win the cascade */
.split,.split-r{display:grid;gap:16px}
.split{grid-template-columns:1.35fr 1fr}
.split-r{grid-template-columns:1fr 380px}
.split > *,.split-r > *{min-width:0}
@media (max-width:1080px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1000px){.split,.split-r{grid-template-columns:1fr}}
@media (max-width:640px){.g5,.g4,.g3,.g2{grid-template-columns:1fr}}

.card{border:1px solid var(--hair);background:var(--paper);padding:20px}
.card.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:4px}
.card h3{font-size:17px;font-weight:500;letter-spacing:-.3px}
.card .sub{color:var(--steel);font-size:12.5px;margin-top:3px}
.card.ink .sub{color:var(--on-ink-dim)}

/* KPI cell */
.kpi{padding:20px}
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--steel)}
.kpi .v{font-size:clamp(26px,2.8vw,34px);font-weight:500;letter-spacing:-1.2px;margin-top:8px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--steel)}
.kpi .d.up{color:var(--good)}.kpi .d.down{color:var(--bad)}

/* status marks — sharp rectangles, never rounded */
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;padding:2px 7px;border:1px solid var(--hair);color:var(--steel);white-space:nowrap}
.tag::before{content:'';width:5px;height:5px;background:currentColor;flex:none}
.tag-good{color:#137a55;border-color:#137a55}
.tag-warn{color:#8a5f00;border-color:#8a5f00}
.tag-bad{color:var(--bad);border-color:var(--bad)}
.tag-info{color:#1f5ea8;border-color:#1f5ea8}
.tag-solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag-solid::before{background:var(--paper)}
.tag-flat::before{display:none}
.on-ink .tag{border-color:var(--hair-lite);color:var(--on-ink)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--hair)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel);font-weight:400;text-align:left;padding:11px 16px;border-bottom:1px solid var(--hair);white-space:nowrap;background:var(--paper-soft)}
td{padding:12px 16px;border-bottom:1px solid var(--hair);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--paper-soft)}
tr.clickable{cursor:pointer}
.t-right{text-align:right}
.t-num{font-variant-numeric:tabular-nums;text-align:right}

/* bars & meters */
.meter{height:6px;background:var(--paper-deep);border:1px solid var(--hair);overflow:hidden;min-width:72px}
.meter>i{display:block;height:100%}
.dial{position:relative;flex:none}
.dial svg{transform:rotate(-90deg);display:block}
.dial .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.5px}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--hair)}
.tl-i{position:relative;padding-bottom:16px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:-23px;top:5px;width:9px;height:9px;background:var(--ink)}
.tl-i.neg::before{background:var(--bad)}
.tl-i.neu::before{background:var(--paper);border:1px solid var(--steel)}
.tl-d{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;color:var(--steel)}
.tl-t{font-size:13.5px;font-weight:500;margin-top:2px}
.tl-s{font-family:var(--mono);font-size:11px;color:var(--steel);margin-top:2px}

/* pipeline (used by end-to-end run, CRE, verify) */
.pipe{display:flex;flex-direction:column}
.pipe-step{display:flex;gap:14px;align-items:flex-start}
.pipe-rail{display:flex;flex-direction:column;align-items:center;flex:none}
.pipe-dot{width:26px;height:26px;border:1px solid var(--hair);display:grid;place-items:center;font-family:var(--mono);font-size:10px;background:var(--paper);color:var(--steel);transition:all .2s}
.pipe-line{width:1px;flex:1;min-height:20px;background:var(--hair)}
.pipe-step.done .pipe-dot{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pipe-step.run .pipe-dot{border-color:var(--ink);color:var(--ink);animation:blink 1s steps(2,end) infinite}
.pipe-step.fail .pipe-dot{background:var(--bad);border-color:var(--bad);color:var(--paper)}
@keyframes blink{50%{background:var(--ink);color:var(--paper)}}
.pipe-body{padding-bottom:20px;min-width:0;flex:1}
.pipe-t{font-size:14px;font-weight:500}
.pipe-d{font-size:12.5px;color:var(--steel);margin-top:2px}
.pipe-out{font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:7px;border-left:2px solid var(--ink);padding:5px 0 5px 10px;background:var(--paper-soft);white-space:pre-wrap;word-break:break-word;display:none}
.pipe-step.done .pipe-out,.pipe-step.fail .pipe-out{display:block}
.pipe-step.fail .pipe-out{border-left-color:var(--bad)}

/* code */
.code{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11.5px;line-height:1.75;padding:16px 18px;overflow-x:auto;position:relative;white-space:pre}
.code .c{color:var(--on-ink-dim)}
.code .k{color:#8FC7F5}
.code b{font-weight:700;color:#fff}
.copy{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;padding:3px 8px;border:1px solid var(--hair-lite);color:var(--on-ink)}
.copy:hover{background:var(--paper);color:var(--ink)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:90;display:grid;place-items:center;animation:fade .12s;padding:20px}
.modal{background:var(--paper);border:1px solid var(--ink);width:min(560px,96vw);max-height:88vh;overflow-y:auto;padding:28px;position:relative}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--paper);border-left:1px solid var(--ink);z-index:95;overflow-y:auto;padding:28px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.close-x{position:absolute;top:16px;right:16px;width:30px;height:30px;border:1px solid var(--hair);display:grid;place-items:center}
.close-x:hover{border-color:var(--ink)}

/* cmdk */
.cmdk{position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:100;display:flex;justify-content:center;padding:12vh 20px 20px}
.cmdk-panel{background:var(--paper);border:1px solid var(--ink);width:min(580px,100%);height:fit-content;max-height:62vh;overflow:hidden;display:flex;flex-direction:column}
.cmdk-in{background:transparent;border:0;border-bottom:1px solid var(--hair);padding:17px 20px;font-size:15px;outline:none;width:100%}
.cmdk-list{overflow-y:auto;padding:6px}
.cmdk-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;font-size:13.5px}
.cmdk-i:hover,.cmdk-i.sel{background:var(--ink);color:var(--paper)}
.cmdk-i .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--steel)}
.cmdk-i:hover .k,.cmdk-i.sel .k{color:var(--on-ink-dim)}

/* toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(380px,90vw)}
.toast{background:var(--ink);color:var(--paper);border-left:3px solid var(--paper);padding:12px 16px;font-size:12.5px;animation:slide .18s}
.toast.err{border-left-color:var(--bad)}
.toast .lbl{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--on-ink-dim);display:block;margin-bottom:3px}

/* chart tooltip */
.ctip{position:fixed;background:var(--ink);color:var(--paper);padding:7px 11px;font-family:var(--mono);font-size:11px;pointer-events:none;z-index:80;display:none;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--steel);font-family:var(--mono);letter-spacing:.8px;text-transform:uppercase}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:-1px}

/* misc */
.empty{padding:64px 20px;text-align:center;color:var(--steel);border:1px solid var(--hair)}
.empty h4{font-size:17px;font-weight:500;color:var(--ink);margin-bottom:6px;letter-spacing:-.3px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrap-f{flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:14px}
.hr{border:0;border-top:1px solid var(--hair);margin:18px 0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb16{margin-bottom:16px}
.muted{color:var(--steel)}.fs12{font-size:12px}.fs13{font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel)}
.input,.select{background:var(--paper);border:1px solid var(--hair);padding:10px 13px;font-size:14px;width:100%;outline:none}
.input:focus,.select:focus{border-color:var(--ink)}
.input::placeholder{color:var(--steel-2)}
.input.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.4px;text-transform:none}
.checkline{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:3px 0}

/* stat list rows (OS-layer style) */
.rows{display:flex;flex-direction:column}
.rows .r{display:grid;grid-template-columns:150px 1fr auto;gap:18px;padding:15px 0;border-top:1px solid var(--hair);align-items:center}
.rows .r:last-child{border-bottom:1px solid var(--hair)}
.rows .r.tight{grid-template-columns:80px 1fr auto}
@media (max-width:640px){.rows .r.tight{grid-template-columns:1fr}}
.rows .rn{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel)}
.rows .rd{font-size:15px;font-weight:500;letter-spacing:-.2px}
.rows .rd span{color:var(--steel);font-weight:400;font-size:13px}
@media (max-width:640px){.rows .r{grid-template-columns:1fr;gap:6px}}

/* integration cell */
.int{padding:22px;display:flex;flex-direction:column;gap:12px;min-height:214px}
.int-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.int-logo{width:34px;height:34px;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600}
.int h4{font-size:16px;font-weight:500;letter-spacing:-.2px}
.int p{font-size:12.5px;color:var(--steel);line-height:1.55}
.int .st{font-family:var(--mono);font-size:10px;letter-spacing:.8px;color:var(--ink);border-left:2px solid var(--ink);padding-left:9px}
.int-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px solid var(--hair)}
.tabs{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--hair);width:fit-content;max-width:100%}
.tab{padding:8px 15px;font-family:var(--mono);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--steel);border-right:1px solid var(--hair)}
.tab:last-child{border-right:0}
.tab.on{background:var(--ink);color:var(--paper)}
.tab .n{opacity:.55;margin-left:5px}

/* endpoint accordion */
.ep{border:1px solid var(--hair)}
.ep + .ep{border-top:0}
.ep-h{display:flex;align-items:center;gap:14px;padding:13px 18px;width:100%;text-align:left}
.ep-h:hover{background:var(--paper-soft)}
.meth{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;padding:2px 7px;border:1px solid currentColor;flex:none}

.checkout{border:1px solid var(--ink);max-width:400px}
.checkout-h{background:var(--ink);color:var(--paper);padding:13px 18px;display:flex;align-items:center;justify-content:space-between}
.checkout-b{padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.pay-opt{border:1px solid var(--hair);padding:12px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:border-color .12s}
.pay-opt:hover{border-color:var(--steel)}
.pay-opt.on{border-color:var(--ink);background:var(--paper-soft)}
.pay-opt .rd{width:13px;height:13px;border:1px solid var(--ink);flex:none;position:relative}
.pay-opt.on .rd::after{content:'';position:absolute;inset:2px;background:var(--ink)}
.pay-opt .nm{font-size:13.5px;font-weight:500}
.pay-opt .fee{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--steel)}

  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:246px;z-index:70;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(10,10,10,.2)}

  .searchbox,.envsel{display:none}

}

 const pts=data.map((v,i)=>[i*step,h-(v/max)*h]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const last=pts[pts.length-1];
 return `<div class="achart" data-v="${data.join(',')}" data-pre="${pre}" data-suf="${suf}" data-lb="${esc(o.label||'volume')}">
 <svg viewBox="0 0 ${w} ${h+24}" style="width:100%;display:block;overflow:visible" role="img" aria-label="${esc(o.label||'volume')} over 30 days">
  ${[.25,.5,.75].map(f=>`<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}" stroke="#C9C3B7" stroke-width="1" stroke-dasharray="2 4"/>`).join('')}
  <path d="${line} L ${w} ${h} L 0 ${h} Z" fill="${col}" fill-opacity=".07"/>
  <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${col}"/>
  <text x="${w}" y="${(last[1]-12).toFixed(1)}" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="${col}">${pre}${data[data.length-1]}${suf}</text>
  <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="#0A0A0A" stroke-width="1"/>
  <text x="0" y="${h+17}" font-family="ui-monospace,monospace" font-size="10" fill="#6F6A62">−30D</text>
  <text x="${w}" y="${h+17}" text-anchor="end" font-family="ui-monospace,monospace" font-size="10" fill="#6F6A62">TODAY</text>
  <g>${pts.map((p,i)=>`<rect x="${(p[0]-step/2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${h}" fill="transparent" data-i="${i}" class="ah"/>`).join('')}</g>
 </svg></div>`}
function bars(rows,o){o=o||{};const h=o.h||140,max=Math.max.apply(null,rows.map(r=>r.n).concat([1]));
 return `<div style="display:grid;grid-template-columns:repeat(${rows.length},1fr);gap:6px;align-items:end;height:${h}px">
 ${rows.map(r=>{const bh=Math.max((r.n/max)*(h-42),r.n?10:2);
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:7px;justify-content:flex-end;height:100%">
   <span class="mono num" style="font-size:11px;letter-spacing:0;color:#0A0A0A">${r.n}</span>
   <div style="width:100%;background:${r.n?'#0A0A0A':'#C9C3B7'};height:${bh}px"></div>
   <span class="mono" style="font-size:9px">${r.b}</span></div>`}).join('')}</div>`}

function runScore(){
 const id=$('#eAgent').value,a=AGENTS.find(x=>x.id===id),btn=$('#eBtn');
 btn.disabled=true;btn.textContent='Running…';
 const steps=[['Fetch on-chain state','ReputationRegistry · TransactionValidator · BudgetEnforcer on Base','3 contracts read · 41 events'],
  ['Reputation Oracle · 35%','Composite over settled payment and repayment history','sub-score 892'],
  ['Transaction Monitor · 25%','Anomaly scan across the recorded transaction stream','sub-score 814 · no anomalies'],
  ['Budget Alert · 20%','Utilization against declared caps','sub-score 760'],
  ['Agent Verification · 20%','DID ownership, operator entity, sanctions screen','verified · clear'],
  ['Publish','Write score on-chain and emit score.updated','']];
 $('#ePipe').innerHTML=`<div class="pipe mt24">${steps.map((s,i)=>`
  <div class="pipe-step" id="es${i}"><div class="pipe-rail"><div class="pipe-dot">${String(i+1).padStart(2,'0')}</div>${i<steps.length-1?'<div class="pipe-line"></div>':''}</div>
  <div class="pipe-body"><div class="pipe-t">${s[0]}</div><div class="pipe-d">${s[1]}</div><div class="pipe-out" id="eo${i}"></div></div></div>`).join('')}</div><div id="eRes"></div>`;
 let i=0;
 const tick=()=>{
  if(i>0){const k=i-1,el=document.getElementById('es'+k);el.className='pipe-step done';
   document.getElementById('eo'+k).textContent=steps[k][2]||('completed in '+(Math.random()*2+.4).toFixed(1)+'s')}
  if(i>=steps.length){
   const drift=Math.floor(Math.random()*7)-3,ns=Math.max(0,Math.min(1000,a.score+drift)),g=gradeOf(ns);
   document.getElementById('eRes').innerHTML=`<div class="card ink mt16"><div class="row wrap-f" style="gap:20px">
    <div class="dial" style="width:70px;height:70px;flex:none"><svg width="70" height="70" style="transform:rotate(-90deg)">

     <div class="v" style="font-size:17px;color:var(--paper)">${ns}</div></div>
    <div><div style="font-weight:500;font-size:16px">${a.id} → ${ns} · grade ${g.g}</div>
     <div class="mono mt8" style="font-size:10.5px;text-transform:none;letter-spacing:.4px;color:var(--on-ink-dim)">${drift===0?'no change':(drift>0?'+':'')+drift+' pts'} from previous run · ${g.risk} risk · tx 0x${Math.random().toString(16).slice(2,10)}… on Base</div></div>
   </div></div>`;
   btn.disabled=false;btn.textContent='▶ Run now';
   toast(`Score published for ${a.id}: ${ns} (${g.g}).`,'Scoring engine');return}
  document.getElementById('es'+i).className='pipe-step run';i++;setTimeout(tick,680+Math.random()*450)};
 tick()}

function mkKey(){
 const name=$('#kN').value.trim()||'unnamed';
 const sc=[].slice.call(document.querySelectorAll('.kS:checked')).map(x=>x.value);
 if(!sc.length){toast('Select at least one scope.','Developers',1);return}
 const A='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
 const sec=(ENV==='Live'?'fg_live_':'fg_test_')+[].slice.call(crypto.getRandomValues(new Uint8Array(24))).map(b=>A[b%62]).join('');
 store.keys=store.keys.concat([{name:name,scopes:sc,created:'Just now',masked:sec.slice(0,12)+'…'+sec.slice(-4)}]);

 <div class="card"><h3>Verify the signature</h3><div class="sub">Never process an unverified payload</div>
  <div class="code mt16"><span class="c">// Node — constant-time comparison</span>
<span class="k">const</span> sig = crypto.createHmac(<b>'sha256'</b>, process.env.FORGE_WEBHOOK_SECRET)

<span class="k">if</span> (!crypto.timingSafeEqual(

/* ---- shared formatting ---- */
function pyNum(n,d){if(d===undefined)d=2;
 const p=Math.abs(Number(n)).toFixed(d).split('.');
 const i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');
 return (Number(n)<0?'−':'')+i+(p.length>1?'.'+p[1]:'')}
function pyCur(c,n,d){const s=pyNum(n,d);
 return c==='ZAR'?'R '+s:c==='EUR'?'€'+s:c==='GBP'?'£'+s:'$'+s}
function pyTag(cls,label){return '<span class="tag'+(cls?' tag-'+cls:'')+'">'+esc(label)+'</span>'}
function pyStage(s){const m={'Won':'good','Lost':'bad','Evidence due':'warn','Pre-arbitration':'warn','Under review':'info','Evidence submitted':'info'};
 return pyTag(m[s]||'',s)}
function pyFileTag(s){const m={'Filed':'good','Due':'warn','Scheduled':'info'};return pyTag(m[s]||'',s)}
function pyAvail(v){return v==='live'?'<span class="mono" style="font-size:10px;letter-spacing:1px;color:#137a55">LIVE</span>'
 :v==='beta'?'<span class="mono" style="font-size:10px;letter-spacing:1px;color:#8a5f00">BETA</span>'
 :'<span class="mono" style="font-size:10px;color:var(--steel-2)">—</span>'}

function pyRuleIds(cur,mth){

function pyPreset(a,c,m){

function pyRouteSim(){
 const ael=$('#pySimAmt');if(!ael)return;
 const amt=parseFloat(String(ael.value).replace(/[^0-9.]/g,''));
 const cur=$('#pySimCur').value,mth=$('#pySimMth').value,btn=$('#pySimBtn');
 if(!(amt>0)){toast('Enter an amount greater than zero.','Routing',1);return}
 const cand=pyCandidates(cur,mth),isU=mth==='usdc',fc=isU?'USD':cur;
 const ev=isU?pyToUsd(amt,cur):amt;
 let won=-1,tried=0;
 const res=cand.map(c=>{
  if(!c.ok)return{v:'skip',t:'skipped · '+c.why};
  if(won>-1)return{v:'skip',t:'not attempted · the order already settled'};
  if(c.min&&ev<c.min){tried++;return{v:'fail',t:'declined · below the '+pyCur(fc,c.min)+' floor for this rail'}}
  if(ev>c.max){tried++;return{v:'fail',t:'declined · '+pyCur(fc,ev)+' is above the '+pyCur(fc,c.max)+' '+c.cap}}
  tried++;won=cand.indexOf(c);
  return{v:'win',t:'APPROVED in '+(c.ms/1000).toFixed(1)+'s · fee '+pyCur(fc,ev*c.bps/10000+c.fix)+' ('+(c.bps/100).toFixed(2)+'% + '+pyCur(fc,c.fix)+')'}});
 const rows=[['Rule evaluation','Corridor rules matched against the request, in priority order']]
  .concat(cand.map(c=>[c.n,c.why]));
 btn.disabled=true;btn.textContent='Routing…';
 $('#pySimRes').innerHTML='';
 $('#pySimPipe').innerHTML=`<div class="pipe">${rows.map((r,i)=>`
  <div class="pipe-step" id="pyh${i}"><div class="pipe-rail"><div class="pipe-dot">${String(i+1).padStart(2,'0')}</div>${i<rows.length-1?'<div class="pipe-line"></div>':''}</div>
  <div class="pipe-body"><div class="pipe-t">${esc(r[0])}</div><div class="pipe-d">${esc(r[1])}</div><div class="pipe-out" id="pyo${i}"></div></div></div>`).join('')}</div>`;
 const ruleLine='corridor='+(mth==='usdc'?'agent/usdc':(cur.toLowerCase()+'/'+mth))+' · presented '+pyCur(cur,amt)
  +(isU&&cur!=='USD'?' ('+pyCur('USD',ev)+' equivalent)':'')+'\nrules in scope: '+pyRuleIds(cur,mth)+' · '+cand.length+' candidate hops';
 let i=0;
 const tick=()=>{
  if(i>0){const k=i-1,el=document.getElementById('pyh'+k),o=document.getElementById('pyo'+k);
   if(el&&o){if(k===0){el.className='pipe-step done';o.textContent=ruleLine}
    else{const r=res[k-1];el.className='pipe-step '+(r.v==='fail'?'fail':'done');o.textContent=r.t}}}
  if(i>=rows.length){
   btn.disabled=false;btn.textContent='▶ Simulate route';
   const box=$('#pySimRes');if(!box)return;
   if(won>-1){const w=cand[won],fee=ev*w.bps/10000+w.fix;
    box.innerHTML=`<div class="card ink mt16"><div class="mono" style="color:var(--on-ink-dim)">Route resolved</div>
     <div style="font-size:24px;font-weight:500;letter-spacing:-.9px;margin-top:8px">${esc(w.n)} · ${pyCur(fc,fee)} fee</div>
     <div class="rows mt16" style="--hair:rgba(244,242,238,.18)">
      <div class="r" style="border-color:rgba(244,242,238,.18)"><span class="rn" style="color:rgba(244,242,238,.5)">Presented</span><span class="rd num">${pyCur(cur,amt)}</span><span class="mono" style="font-size:10px;color:rgba(244,242,238,.5)">${esc(cur)}</span></div>
      <div class="r" style="border-color:rgba(244,242,238,.18)"><span class="rn" style="color:rgba(244,242,238,.5)">Settled through</span><span class="rd">${esc(w.n)}</span><span class="mono" style="font-size:10px;color:rgba(244,242,238,.5)">HOP ${won+1} OF ${cand.length}</span></div>
      <div class="r" style="border-color:rgba(244,242,238,.18)"><span class="rn" style="color:rgba(244,242,238,.5)">Effective rate</span><span class="rd num">${(fee/ev*10000).toFixed(0)} bps</span><span class="mono" style="font-size:10px;color:rgba(244,242,238,.5)">${(w.bps/100).toFixed(2)}% + ${pyCur(fc,w.fix)}</span></div>
      <div class="r" style="border-color:rgba(244,242,238,.18)"><span class="rn" style="color:rgba(244,242,238,.5)">Merchant nets</span><span class="rd num">${pyCur(fc,ev-fee)}</span><span></span></div>
      <div class="r" style="border-color:rgba(244,242,238,.18)"><span class="rn" style="color:rgba(244,242,238,.5)">Hops attempted</span><span class="rd num">${tried}</span><span class="mono" style="font-size:10px;color:rgba(244,242,238,.5)">${cand.length-tried} SKIPPED</span></div>
      <div class="r" style="border-color:rgba(244,242,238,.18)"><span class="rn" style="color:rgba(244,242,238,.5)">Reason</span><span class="rd" style="font-size:14px">${tried>1?'Earlier hops declined or were ineligible':'First eligible hop approved'}</span><span></span></div>
     </div></div>`;
    toast('Routed to '+w.n+' — fee '+pyCur(fc,fee)+'.','Routing')}
   else{box.innerHTML=`<div class="card mt16" style="border-color:var(--bad)">
     <div class="card-h"><div><h3>All hops exhausted</h3>
      <div class="sub">${esc(pyCur(cur,amt))} could not be routed — every eligible hop declined and no rail remains in this corridor.</div></div>
      <span class="tag tag-bad">Failed</span></div>
     <div class="rows mt16">
      <div class="r"><span class="rn">Attempted</span><span class="rd num">${tried} hops</span><span class="mono" style="font-size:10px">${cand.length-tried} SKIPPED</span></div>
      <div class="r"><span class="rn">Next step</span><span class="rd" style="font-size:14px">Split the order or raise the connector ceiling</span><span></span></div>
      <div class="r"><span class="rn">Event</span><span class="rd mono" style="font-size:13px;text-transform:none">payment.failed · route recorded in full</span><span></span></div>
     </div></div>`;
    toast('No hop could take '+pyCur(cur,amt)+' in this corridor.','Routing',1)}
   return}
  const cu=document.getElementById('pyh'+i);if(cu)cu.className='pipe-step run';
  i++;setTimeout(tick,520+Math.random()*380)};
 tick()}

function trRunCalc(r){
 const cents={},order=[];
 r.legs.forEach(l=>{const a=Math.round(l.a*100);
  if(!(l.f in cents)){cents[l.f]=0;order.push(l.f)}
  if(!(l.t in cents)){cents[l.t]=0;order.push(l.t)}
  cents[l.f]-=a;cents[l.t]+=a});
 const gross=r.legs.reduce((s,l)=>s+Math.round(l.a*100),0);
 const pay=[],rec=[];
 order.forEach(k=>{if(cents[k]<0)pay.push({p:k,a:-cents[k]});else if(cents[k]>0)rec.push({p:k,a:cents[k]})});
 pay.sort((x,y)=>y.a-x.a);rec.sort((x,y)=>y.a-x.a);
 const instr=[];let i=0,j=0;
 while(i<pay.length&&j<rec.length){
  const m=Math.min(pay[i].a,rec[j].a);
  instr.push({f:pay[i].p,t:rec[j].p,a:m/100});
  pay[i].a-=m;rec[j].a-=m;
  if(pay[i].a===0)i++;
  if(rec[j].a===0)j++}
 const net=instr.reduce((s,x)=>s+Math.round(x.a*100),0);
 const elim=gross-net;
 const fx=Math.round(elim*0.003),wire=(r.legs.length-instr.length)*2800;
 const ex=(r.excl||[]).reduce((s,x)=>s+Math.round(x.a*100),0);
 return {gross:gross/100,net:net/100,elim:elim/100,pos:cents,order:order,instr:instr,
  fx:fx/100,wire:wire/100,saved:(fx+wire)/100,comp:gross?elim/gross*100:0,
  legs:r.legs.length,parties:order.length,excl:ex/100};
}

function trPayTl(p){
 const out=[{d:p.ts[0],t:'Payout instructed',s:p.ent+' · '+p.nat},
  {d:p.ts[1],t:'Rail selected — '+p.rail,s:'Least cost subject to SLA · '+trUsd(p.cost)+' ('+trBps(p).toFixed(1)+' bps)'},
  {d:p.ts[2],t:'Sanctions screening',s:p.st==='Held'?'Name match on the OFAC SDN list — escalated to compliance':'OFAC SDN, EU CFSP, UN consolidated — clear',neg:p.st==='Held'}];
 if(p.st==='Settled')out.push({d:p.ts[3],t:'Settled',s:'Confirmation '+p.conf});
 else if(p.st==='Settling')out.push({d:p.ts[3],t:'In flight',s:'Submitted to '+p.rail+' — awaiting confirmation',neu:true});
 else if(p.st==='Queued')out.push({d:p.ts[3],t:'Queued for cut-off',s:'Releases at '+p.cut,neu:true});

 return out;
}

function cuEvaluate(){
 const amt=parseFloat(($('#cuAmt').value||'0').replace(/[^0-9.]/g,''))||0;
 const vid=$('#cuVault').value,dest=$('#cuDest').value,v=CU_VAULTS.find(x=>x.id===vid);
 const btn=$('#cuEvalBtn');btn.disabled=true;btn.textContent='Evaluating…';
 // resolve the winning rule the same way the chain would
 let win;
 if(dest==='ofac')win={id:'CP-08',q:'blocked',tl:'—',why:'Counterparty failed OFAC screening.'};
 else if(dest==='new')win={id:'CP-07',q:'blocked',tl:'—',why:'Destination is not on the vault address book.'};
 else if(vid==='vlt_cold')win={id:'CP-05',q:'4-of-7',tl:'24 hours',why:'All cold-storage movement requires the full cold quorum.'};
 else if(vid==='vlt_esc')win=(amt<=500&&dest==='agent')?{id:'CP-01',q:'auto',tl:'—',why:'Inside the escrow auto-approve ceiling, destination is a registered agent.'}
   :{id:'CP-02',q:'2-of-3',tl:'—',why:'Above the $500 auto-approve ceiling.'};
 else if(vid==='vlt_zar')win={id:'CP-06',q:'2-of-4',tl:'—',why:'ZAR float movements run under dual control.'};
 else win=amt>50000?{id:'CP-04',q:'3-of-3',tl:'6 hours',why:'Above the $50 000 standing threshold for the operating vault.'}
   :{id:'CP-03',q:'2-of-3',tl:'—',why:'Within the standing threshold and the destination is allowlisted.'};
 const chain=CU_POLICY.filter(p=>p.scope===v.n||p.scope==='All vaults');
 const idx=chain.findIndex(p=>p.id===win.id);
 $('#cuEvalOut').innerHTML=`<div class="pipe mt24">${chain.map((p,i)=>`
  <div class="pipe-step" id="cs${i}"><div class="pipe-rail"><div class="pipe-dot">${p.id.split('-')[1]}</div>${i<chain.length-1?'<div class="pipe-line"></div>':''}</div>
  <div class="pipe-body"><div class="pipe-t">${p.id} · ${esc(p.scope)}</div><div class="pipe-d">${esc(p.cond)}</div>
  <div class="pipe-out" id="co${i}"></div></div></div>`).join('')}</div><div id="cuVerdict"></div>`;
 let i=0;
 const step=()=>{
  if(i>0){const k=i-1,el=document.getElementById('cs'+k),o=document.getElementById('co'+k);
   const hit=chain[k].id===win.id;
   el.className='pipe-step '+(hit?(win.q==='blocked'?'fail':'done'):'done');
   o.textContent=hit?('matched → '+win.q+(win.tl!=='—'?' + '+win.tl+' timelock':'')):'no match — continue';}
  if(i>idx+1||i>=chain.length){
   btn.disabled=false;btn.textContent='Evaluate';
   const blocked=win.q==='blocked';
   const verdict=blocked?'Blocked':win.q==='auto'?'Auto-approved':'Requires '+win.q+(win.tl!=='—'?' plus a '+win.tl+' timelock':'');
   document.getElementById('cuVerdict').innerHTML=`<div class="card ${blocked?'':'ink'} mt16" ${blocked?'style="border-color:var(--bad)"':''}>
    <div class="mono" style="font-size:9.5px;${blocked?'color:var(--bad)':'color:var(--on-ink-dim)'}">Verdict · rule ${win.id}</div>
    <div style="font-weight:500;font-size:20px;letter-spacing:-.5px;margin-top:6px;${blocked?'color:var(--bad)':''}">${verdict}</div>
    <div class="mt8" style="font-size:13px;${blocked?'color:var(--steel)':'color:var(--on-ink)'}">${esc(win.why)}</div>
    <div class="mono mt16" style="font-size:10.5px;text-transform:none;letter-spacing:.4px;${blocked?'color:var(--steel)':'color:var(--on-ink-dim)'}">${cuFmt(amt)} from ${esc(v.n)} · ${chain.length} rules evaluated · decided at rule ${idx+1}</div></div>`;
   toast(blocked?'Movement blocked by '+win.id+'.':'Rule '+win.id+' → '+verdict+'.','Policy engine',blocked);
   return}
  document.getElementById('cs'+i).className='pipe-step run';i++;setTimeout(step,420)};
 step()}

 <div class="card"><h3>How the chain is built</h3>

entry[n].hash = sha256(

  entry[n].quorum    +

)

<span class="c">// verifying the whole log is a single fold</span>
<span class="k">const</span> head = log.reduce((prev, e) =&gt; sha256(serialise(e) + prev), GENESIS);
assert(head === <b>'8f21c4d90a'</b>);  <span class="c">// chain head, published daily</span><button class="copy" onclick="copyText('8f21c4d90a',this)">Copy head</button></div>

function waRunRecovery(){
 const w=WA_WALLETS.find(x=>x.id===$('#waRecW').value);
 const btn=$('#waRecBtn');btn.disabled=true;btn.textContent='Running…';
 const steps=[
  ['Initiate','Claimant proves control of the recovery email or entity credential','claim opened · rec_015'],
  ['Notify guardians','All guardians on the wallet are alerted out of band','3 guardians notified'],
  ['Collect approvals','Threshold of guardians must sign the rotation','2 of 3 approved · threshold met'],
  ['Cooldown','24-hour window in which the original key can veto','no veto received · window closed'],
  ['Rotate signing key','New key bound to the same account; DID unchanged','#owner rotated → 0x6c19…6633'],
  ['Confirm','Balance, DID, credit history and session scopes preserved','']];
 $('#waRecOut').innerHTML=`<div class="pipe mt24">${steps.map((s,i)=>`
  <div class="pipe-step" id="ws${i}"><div class="pipe-rail"><div class="pipe-dot">${String(i+1).padStart(2,'0')}</div>${i<steps.length-1?'<div class="pipe-line"></div>':''}</div>
  <div class="pipe-body"><div class="pipe-t">${s[0]}</div><div class="pipe-d">${esc(s[1])}</div><div class="pipe-out" id="wo${i}"></div></div></div>`).join('')}</div><div id="waRecRes"></div>`;
 let i=0;
 const tick=()=>{
  if(i>0){const k=i-1;document.getElementById('ws'+k).className='pipe-step done';
   document.getElementById('wo'+k).textContent=steps[k][2]||('completed in '+(Math.random()*1.5+.3).toFixed(1)+'s')}
  if(i>=steps.length){
   btn.disabled=false;btn.textContent='▶ Simulate recovery';
   document.getElementById('waRecRes').innerHTML=`<div class="card ink mt16">
    <div class="mono" style="font-size:9.5px;color:var(--on-ink-dim)">Recovered</div>
    <div style="font-weight:500;font-size:20px;letter-spacing:-.5px;margin-top:6px">${esc(w.n)} — signing key rotated</div>
    <div class="grid g4 mt16" style="background:rgba(244,242,238,.18);border-color:rgba(244,242,238,.18)">
     ${[['DID','unchanged'],['Balance',w.bal],['Credit history','preserved'],['Elapsed','24h 04m']].map(x=>
      `<div style="background:var(--ink);padding:12px"><div class="mono" style="font-size:9px;color:var(--on-ink-dim)">${x[0]}</div>
       <div class="num" style="font-weight:500;margin-top:4px">${esc(x[1])}</div></div>`).join('')}</div>
    <div class="mono mt16" style="font-size:10.5px;text-transform:none;letter-spacing:.4px;color:var(--on-ink-dim)">${w.did}</div></div>`;
   toast(esc(w.n)+' recovered — key rotated, DID and balance intact.','Recovery');return}
  document.getElementById('ws'+i).className='pipe-step run';i++;setTimeout(tick,620+Math.random()*380)};
 tick()}

function openCmdk(){
 const items=Object.keys(META).map(r=>({t:META[r][1],k:META[r][0],go:()=>go(r)}))
  .concat(AGENTS.map(a=>({t:a.id,k:'Agent',go:()=>{go('agents');setTimeout(()=>openAgent(a.id),90)}})))
  .concat(EVENTS.slice(0,6).map(e=>({t:e.id+' · '+e.type,k:'Event',go:()=>{go('events');setTimeout(()=>openEvent(e.id),90)}})));
 $('#portal').innerHTML=`<div class="cmdk" onclick="if(event.target===this)closePortal()"><div class="cmdk-panel">
  <input class="cmdk-in" id="ck" placeholder="Search pages, agents, events…" autocomplete="off"/>
  <div class="cmdk-list" id="ckl"></div></div></div>`;
 const inp=$('#ck'),list=$('#ckl');let sel=0,cur=items;
 const draw=()=>{list.innerHTML=cur.length?cur.map((x,i)=>`<button class="cmdk-i ${i===sel?'sel':''}" data-i="${i}">${esc(x.t)}<span class="k">${x.k}</span></button>`).join('')
   :'<div class="empty" style="border:0;padding:30px">No matches</div>';
  [].slice.call(list.querySelectorAll('.cmdk-i')).forEach(b=>b.onclick=()=>{const f=cur[+b.dataset.i].go;closePortal();f()})};
 inp.oninput=()=>{cur=items.filter(x=>x.t.toLowerCase().indexOf(inp.value.toLowerCase())>-1);sel=0;draw()};
 inp.onkeydown=e=>{
  if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,cur.length-1);draw()}
  else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);draw()}
  else if(e.key==='Enter'&&cur[sel]){const f=cur[sel].go;closePortal();f()}
  else if(e.key==='Escape')closePortal()};
 draw();inp.focus()}
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openCmdk()}
 else if(e.key==='Escape'&&$('#portal').innerHTML)closePortal()});
function showNotifs(e){
 e.stopPropagation();
 const ex=document.getElementById('npop');if(ex){ex.remove();return}
 const p=document.createElement('div');p.id='npop';
 p.style.cssText='position:fixed;top:58px;right:calc(var(--pad, 28px));width:min(340px,90vw);background:var(--paper);border:1px solid var(--ink);z-index:110';
 p.innerHTML=`<div class="mono" style="padding:12px 16px;border-bottom:1px solid var(--hair)">Notifications</div>`+
  NOTIFS.map(n=>`<div style="padding:12px 16px;border-bottom:1px solid var(--hair)">
   <div class="fs13" style="font-weight:500">${esc(n.t)}</div><div class="muted fs12">${esc(n.d)}</div>
   <div class="mono mt4" style="font-size:9.5px">${n.w}</div></div>`).join('');
 document.body.appendChild(p);
 setTimeout(()=>document.addEventListener('click',function h(ev){if(!p.contains(ev.target)){p.remove();document.removeEventListener('click',h)}}),0)}
$('#burger').onclick=()=>{
 const sb=$('#sidebar');sb.classList.add('open');
 const sc=document.createElement('div');sc.className='scrim';
 sc.onclick=()=>{sb.classList.remove('open');sc.remove()};
 document.body.appendChild(sc)};

function render(){
 stopX402();
 const r=route(),fn=P[r]||P.overview,m=META[r]||META.overview;
 $('#crumb').innerHTML=`${esc(m[0])} <span style="color:var(--hair)">/</span> <b>${esc(m[1])}</b>`;
 $('#page').innerHTML=`<div class="page">${fn()}</div>`;
 sidebar();closePortal();
 if(r==='stablecoin')startX402();
 document.title='FORGE Console — '+m[1];
 window.scrollTo(0,0)}
render();
</script>
