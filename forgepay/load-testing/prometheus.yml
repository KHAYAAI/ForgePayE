# Prometheus configuration for ForgePay load testing
#
# Scrapes metrics from all ForgePay services and k6

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: load-testing
    region: local

scrape_configs:
  # ForgePay unified-router
  - job_name: "unified-router"
    static_configs:
      - targets: ["unified-router:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # ForgePay mor-layer
  - job_name: "mor-layer"
    static_configs:
      - targets: ["mor-layer:8010"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # ForgePay stablecoin-gateway
  - job_name: "stablecoin-gateway"
    static_configs:
      - targets: ["stablecoin-gateway:8020"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # ForgePay crypto-gateway
  - job_name: "crypto-gateway"
    static_configs:
      - targets: ["crypto-gateway:8030"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # ForgePay yield-engine
  - job_name: "yield-engine"
    static_configs:
      - targets: ["yield-engine:8050"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # ForgePay agent-identity
  - job_name: "agent-identity"
    static_configs:
      - targets: ["agent-identity:3010"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # PostgreSQL (if exporter is available)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis (if exporter is available)
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s
