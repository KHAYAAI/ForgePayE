version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: forgepay
      POSTGRES_USER: forgepay
      POSTGRES_PASSWORD: localdev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgepay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching & async queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kill Bill (optional for local dev)
  # killbill:
  #   image: killbill/killbill:latest
  #   environment:
  #     DB_ENGINE: mysql
  #     KILLBILL_SECURE_COOKIES: "false"
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - mysql

  # Mail server (for testing)
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Next.js app
  app:
    build: .
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://forgepay:localdev123@postgres:5432/forgepay
      JWT_SECRET: dev-secret-key-change-in-production
      API_BASE_URL: http://localhost:3000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: noreply
      SMTP_PASS: noreply
      KILLBILL_API_KEY: admin
      KILLBILL_API_SECRET: password
      KILLBILL_BASE_URL: http://killbill:8080
      KILLBILL_TENANT_ID: default-tenant
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: forgepay-network
