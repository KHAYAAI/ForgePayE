[profile.default]
src      = "src"
out      = "out"
libs     = ["lib", "node_modules"]
solc     = "0.8.28"
optimizer        = true
optimizer_runs   = 200
via_ir           = false
remappings       = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts@5.3.0/=node_modules/@openzeppelin/contracts-5.3.0/",
  "@chainlink/contracts-ccip/=node_modules/@chainlink/contracts-ccip/",
  "@chainlink/contracts/=node_modules/@chainlink/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
base_sepolia   = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet   = "${BASE_MAINNET_RPC_URL}"
arbitrum_one   = "${ARBITRUM_RPC_URL}"

[etherscan]
base_sepolia  = { key = "${BASESCAN_API_KEY}", chain = 84532,   url = "https://api-sepolia.basescan.org/api" }
base_mainnet  = { key = "${BASESCAN_API_KEY}", chain = 8453,    url = "https://api.basescan.org/api" }
arbitrum_one  = { key = "${ARBISCAN_API_KEY}", chain = 42161,   url = "https://api.arbiscan.io/api" }
