# STAGING on Fly.io: the credit bureau. Production-shaped (NODE_ENV=production), private for now (no public address yet: lenders cannot
# reach it until one is added for the sandbox pilot). Deployed only by .github/workflows/deploy-fly.yml, by digest, signed. Secrets (never here):
#   DATABASE_URL (…?sslmode=no-verify), REDIS_URL, BUREAU_ADMIN_API_KEY, CONSENT_SIGNING_SECRET, WEBHOOK_SIGNING_MASTER,
#   COMPLIANCE_MONITOR_API_KEY                                    -> `fly secrets set` (docs/launch/17-fly-staging.md)
app = "forgepay-stg-bureau"
primary_region = "arn"

[deploy]
  strategy = "rolling"                 # the bureau migrates its own tables at start-up

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  PORT = "3018"
  LISTEN_HOST = "::"
  TRUST_PROXY_HOPS = "0"
  RATE_LIMIT_PER_MIN = "200"
  CORS_ORIGIN = "https://console.staging.myforgepay.com"
  # Other apps in the same Fly organization, over the private network (<app>.internal).
  COMPLIANCE_MONITOR_URL = "http://forgepay-stg-compliance.internal:8003"
  STABLECOIN_GATEWAY_URL = "http://forgepay-stg-gateway.internal:8020"
  BUREAU_ENABLED_ASSETS = "USDC"
  ZA_TFS_URL = "file:///app/src/data/za_tfs_snapshot.xml"   # read by the launch preflight; screening itself happens in the monitor
  ZA_TFS_SNAPSHOT_AT = "2026-10-06T07:23:00Z"
  ZA_TFS_MAX_AGE_HOURS = "720"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    type = "http"
    port = 3018
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
