# STAGING on Fly.io: the console, the only wave-1 app with a public address (https://forgepay-stg-console.fly.dev, then
# console.staging.myforgepay.com once its certificate is added). Deployed only by .github/workflows/deploy-fly.yml, by digest, signed.
# Secrets (never here): JWT_SECRET, DATABASE_URL, BUREAU_ADMIN_API_KEY, INTERNAL_WEBHOOK_SECRET, FORGE_OPERATOR_TENANT_ID, REDIS_URL,
#   TOTP_ENCRYPTION_KEY                                          -> `fly secrets set` (docs/launch/17-fly-staging.md)
app = "forgepay-stg-console"
primary_region = "arn"

[deploy]
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXT_PUBLIC_APP_URL = "https://console.staging.myforgepay.com"
  AGENT_CREDIT_BUREAU_URL = "http://forgepay-stg-bureau.internal:3018"
  FORGE_LAUNCHED_PRODUCTS = "credit-bureau"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"          # staging: stop when idle to save money
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
