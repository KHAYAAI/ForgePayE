version: "3.9"

# ARCH: ForgePay local development stack
# Usage: docker compose -f forgepay/infra/k8s/docker-compose.dev.yml up
#
# Port map (host → container):
#   5432  → postgres            PostgreSQL (shared by all services)
#   6379  → redis               Redis (dedup, cache, idempotency keys)
#   8000  → unified-router      Internal event bus  (POST /webhooks/*, GET /events)
#   8010  → mor-layer           MoR + tax + checkout (POST /v1/checkout/sessions)
#   8020  → stablecoin-gateway  USDC/USDT deposits + x402 (POST /deposits, /x402/pay)
#   8030  → crypto-gateway      BTC/ETH/LTC/XMR invoices  (POST /invoices)
#   8080  → payment-engine      Hyperswitch REST API (POST /payments, GET /payments/:id)
#   3000  → web                 Marketing site
#   3001  → grafana             Grafana dashboards    (admin / devpassword)
#   3008  → rwa-registry        RWA asset registry    [profile: agentic]
#   3010  → agent-identity      Agent identity service [profile: agentic]
#   3011  → agent-negotiation   Agent negotiation svc  [profile: agentic]
#   4317  → otel-collector      OTLP gRPC receiver    (from all services)
#   4318  → otel-collector      OTLP HTTP receiver
#   8889  → otel-collector      Prometheus metrics scrape endpoint
#   9090  → prometheus          Prometheus UI + query API
#   16686 → jaeger              Jaeger trace UI
#
# NOTE: billing-engine (Kill Bill, port 8021) is NOT in this compose file.
# Run it separately: cd forgepay/services/billing-engine && docker compose up
#
# All passwords here are dev-only. Production secrets come from Kubernetes Secrets
# (managed by Vault / AWS Secrets Manager, never committed to the repo).

networks:
  forgepay:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

services:
  # ── Shared infrastructure ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     forgepay
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB:       forgepay_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [forgepay]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgepay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [forgepay]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # ── Unified Router ─────────────────────────────────────────────────────
  unified-router:
    build:
      context: ../../services/unified-router
      dockerfile: Dockerfile
    environment:
      NODE_ENV:                    development
      PORT:                        "8000"
      POSTGRES_HOST:               postgres
      POSTGRES_PORT:               "5432"
      POSTGRES_DB:                 forgepay_dev
      POSTGRES_USER:               forgepay
      POSTGRES_PASSWORD:           devpassword
      REDIS_URL:                   redis://redis:6379
      INTERNAL_WEBHOOK_SECRET:     dev-internal-secret-change-me
      HYPERSWITCH_WEBHOOK_SECRET:  dev-hs-secret
      KILLBILL_WEBHOOK_SECRET:     dev-kb-secret-12345
      STABLECOIN_GW_WEBHOOK_SECRET: dev-sc-secret
      CRYPTO_GW_WEBHOOK_SECRET:    dev-crypto-secret
      LOG_LEVEL:                   debug
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [forgepay]

  # ── Payment Engine (Hyperswitch) ───────────────────────────────────────
  payment-engine:
    image: juspaydotin/hyperswitch-router:latest
    environment:
      ROUTER__SERVER__HOST: "0.0.0.0"
      ROUTER__SERVER__PORT: "8080"
      ROUTER__MASTER_DATABASE__HOST: postgres
      ROUTER__MASTER_DATABASE__DBNAME: forgepay_dev
      ROUTER__MASTER_DATABASE__USERNAME: forgepay
      ROUTER__MASTER_DATABASE__PASSWORD: devpassword
      ROUTER__REDIS__HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [forgepay]

  # ── Stablecoin Gateway ────────────────────────────────────────────────
  stablecoin-gateway:
    build:
      context: ../../services/stablecoin-gateway
      dockerfile: Dockerfile
    environment:
      NODE_ENV:                        development
      PORT:                            "8020"
      POSTGRES_HOST:                   postgres
      POSTGRES_PORT:                   "5432"
      POSTGRES_DB:                     forgepay_dev
      POSTGRES_USER:                   forgepay
      POSTGRES_PASSWORD:               devpassword
      REDIS_URL:                       redis://redis:6379
      UNIFIED_ROUTER_URL:              http://unified-router:8000
      INTERNAL_WEBHOOK_SECRET:         dev-internal-secret-change-me
      # Dev-only 32-byte key — override with real value in production
      PRIVATE_KEY_ENCRYPTION_KEY:      "dededededededededededededededededededededededededededededededede"
    ports:
      - "8020:8020"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [forgepay]

  # ── Crypto Gateway ─────────────────────────────────────────────────────
  crypto-gateway:
    build:
      context: ../../services/crypto-gateway
      dockerfile: Dockerfile
    environment:
      NODE_ENV:                    development
      PORT:                        "8030"
      POSTGRES_HOST:               postgres
      POSTGRES_PORT:               "5432"
      POSTGRES_DB:                 forgepay_dev
      POSTGRES_USER:               forgepay
      POSTGRES_PASSWORD:           devpassword
      REDIS_URL:                   redis://redis:6379
      UNIFIED_ROUTER_URL:          http://unified-router:8000
      INTERNAL_WEBHOOK_SECRET:     dev-internal-secret-change-me
      # Dev-only seed — generate a real 64-byte hex seed for production
      HD_WALLET_SEED:              "dfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdf"
      # XMR_RPC_URL: http://monero-daemon:18082  # uncomment when running a Monero daemon
    ports:
      - "8030:8030"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [forgepay]

  # ── Marketing site ─────────────────────────────────────────────────────
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks: [forgepay]

  # ── Observability ──────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics
    networks: [forgepay]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [forgepay]
    depends_on: [otel-collector]

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD:  devpassword
      GF_USERS_ALLOW_SIGN_UP:      "false"
      GF_SERVER_ROOT_URL:          "http://localhost:3001"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks: [forgepay]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "14317:4317"   # OTLP gRPC (host port offset to avoid clash)
    networks: [forgepay]

  # ── Agentic services (opt-in: docker compose --profile agentic up) ─────
  rwa-registry:
    build:
      context: ../../services/rwa-registry
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT:     "3008"
      LOG_LEVEL: debug
    ports:
      - "3008:3008"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [forgepay]
    profiles: [agentic]

  agent-identity:
    build:
      context: ../../services/agent-identity
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT:     "3010"
      LOG_LEVEL: debug
    ports:
      - "3010:3010"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [forgepay]
    profiles: [agentic]

  agent-negotiation:
    build:
      context: ../../services/agent-negotiation
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT:     "3011"
      LOG_LEVEL: debug
    ports:
      - "3011:3011"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [forgepay]
    profiles: [agentic]

  # ── FORGE Custody (OpenFireblocks → FORGE) — institutional threshold signing ──
  forge-custody:
    build:
      context: ../../services/forge-custody
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT:     "3019"
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://forgepay:devpassword@postgres:5432/forgepay_dev
      UNIFIED_ROUTER_URL: http://unified-router:8000
      WEBHOOK_SECRET: dev-forge-custody-webhook-secret
      COMPLIANCE_MONITOR_URL: http://compliance-monitor:8004
      MPC_COORDINATOR_URL: http://openfireblocks-mpc-signer:8080
    ports:
      - "3019:3019"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [forgepay]
    profiles: [forge]

  # ── FORGE Wallet (OpenPrivy → FORGE) — consumer/agent wallets & did:forge ────
  forge-wallet:
    build:
      context: ../../services/forge-wallet
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT:     "3020"
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://forgepay:devpassword@postgres:5432/forgepay_dev
      UNIFIED_ROUTER_URL: http://unified-router:8000
      WEBHOOK_SECRET: dev-forge-wallet-webhook-secret
      AGENT_API_KEY: dev-agent-platform-key
      LARGE_PAYMENT_THRESHOLD: "100000"
    ports:
      - "3020:3020"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [forgepay]
    profiles: [forge]

  # ── OpenFireblocks MPC signer (vendored) — real signing behind FORGE Custody ─
  immudb:
    image: codenotary/immudb:1.9.5
    environment:
      IMMUDB_ADMIN_PASSWORD: immudb
    networks: [forgepay]
    profiles: [forge]

  openfireblocks-mpc-signer:
    build:
      context: ../../services/openfireblocks/services/mpc-signer
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      IMMUDB_URL: immudb:3322
      IMMUDB_USER: immudb
      IMMUDB_PASSWORD: immudb
      MPC_SIGNER_PRIVATE_KEY: ${MPC_SIGNER_PRIVATE_KEY:-}
      # Vault-sourced key (production path):
      #   VAULT_ADDR: http://vault:8200
      #   VAULT_TOKEN: <token>
    ports:
      - "8080:8080"
    depends_on:
      - immudb
    networks: [forgepay]
    profiles: [forge]
