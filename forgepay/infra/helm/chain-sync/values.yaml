replicaCount: 1
image:
  repository: forgepay/chain-sync
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8050
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '8050'
  POLL_INTERVAL_MS: '12000'
secretRef: forgepay-chain-sync-secrets
contracts:
  ethereum:
    groth16Verifier: '0x0000000000000000000000000000000000000000'
    nullifierRegistry: '0x0000000000000000000000000000000000000000'
    commitmentTree: '0x0000000000000000000000000000000000000000'
  polygon:
    groth16Verifier: '0x0000000000000000000000000000000000000000'
    nullifierRegistry: '0x0000000000000000000000000000000000000000'
    commitmentTree: '0x0000000000000000000000000000000000000000'
  base:
    groth16Verifier: '0x0000000000000000000000000000000000000000'
    nullifierRegistry: '0x0000000000000000000000000000000000000000'
    commitmentTree: '0x0000000000000000000000000000000000000000'
  arbitrum:
    groth16Verifier: '0x0000000000000000000000000000000000000000'
    nullifierRegistry: '0x0000000000000000000000000000000000000000'
    commitmentTree: '0x0000000000000000000000000000000000000000'
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi
autoscaling:
  enabled: false
livenessProbe:
  httpGet:
    path: /healthz
    port: 8050
  initialDelaySeconds: 15
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /readyz
    port: 8050
  initialDelaySeconds: 10
  periodSeconds: 15
