replicaCount: 1
image:
  repository: forgepay/chain-sync
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8050
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '8050'
  POLL_INTERVAL_MS: '12000'
secretRef: forgepay-chain-sync-secrets
contracts:
  ethereum:
    groth16Verifier: '0x0000000000000000000000000000000000000000'
    nullifierRegistry: '0x0000000000000000000000000000000000000000'
    commitmentTree: '0x0000000000000000000000000000000000000000'
  polygon:
    groth16Verifier: '0x0000000000000000000000000000000000000000'
    nullifierRegistry: '0x0000000000000000000000000000000000000000'
    commitmentTree: '0x0000000000000000000000000000000000000000'
  base:
    groth16Verifier: '0x0000000000000000000000000000000000000000'
    nullifierRegistry: '0x0000000000000000000000000000000000000000'
    commitmentTree: '0x0000000000000000000000000000000000000000'
  arbitrum:
    groth16Verifier: '0x0000000000000000000000000000000000000000'
    nullifierRegistry: '0x0000000000000000000000000000000000000000'
    commitmentTree: '0x0000000000000000000000000000000000000000'
resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 450m
    memory: 768Mi
autoscaling:
  enabled: false
livenessProbe:
  httpGet:
    path: /healthz
    port: 8050
  initialDelaySeconds: 15
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /readyz
    port: 8050
  initialDelaySeconds: 10
  periodSeconds: 15

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring

# Standalone-install fallback for the global.* values the umbrella chart
# (forgepay-stack) normally injects. `helm lint`/`helm template` on this
# chart alone would otherwise panic on a nil-map dereference — these are
# empty defaults the in-template `| default "..."` filters fall back
# past, not real connection info. When installed via the umbrella, these
# are entirely overridden by the umbrella's own global values.
global:
  postgresql: {}
  redis: {}
  unifiedRouterUrl: ""
