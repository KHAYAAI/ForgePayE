replicaCount: 3
image:
  repository: forgepay/crypto-gateway
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8030
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '8030'
secretRef: forgepay-crypto-gateway-secrets
resources:
  requests:
    cpu: 600m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
livenessProbe:
  httpGet:
    path: /healthz
    port: 8030
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readyz
    port: 8030
  initialDelaySeconds: 5
  periodSeconds: 10
metrics:
  enabled: true
  port: 9094
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
