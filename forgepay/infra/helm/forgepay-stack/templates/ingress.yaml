{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{/*
                Subchart Services are named via each chart's own
                "<chart>.fullname" helper (release-name-prefixed), not the
                bare chart name — resolve it here rather than hardcoding a
                name in values.yaml that would only be right for a release
                literally named after the chart.
                */}}
                name: {{ include (printf "%s.fullname" .service) $ }}
                port:
                  number: {{ .port }}
          {{- end }}
    {{- end }}
{{- end }}
