# ForgePay Umbrella Chart — Default Values
# Override per-environment with: helm install -f values.prod.yaml

global:
  # Image registry prefix (set to your private registry in prod)
  imageRegistry: ""
  imagePullSecrets: []
  # Shared Postgres connection (used by all services unless overridden)
  postgresql:
    host: "forgepay-postgresql"
    port: 5432
    database: "forgepay"
    existingSecret: "forgepay-db-credentials"
    secretKeys:
      password: "postgres-password"
  redis:
    url: "redis://forgepay-redis-master:6379"
  # All services emit OTEL traces/metrics here
  otel:
    endpoint: "http://otel-collector:4317"
    enabled: true

  # ── Zero-Knowledge Proof Configuration ──────────────────────────────────────
  # ARCH: Privacy-Preserving MoR integration (Phase 1)
  # NOTE: Currently STUBBED for testing. Set enabled: true to verify proofs in production.
  zk:
    # Enable ZK proof verification (false = skip verification, true = verify all proofs)
    enabled: false

    # TODO: Update to true when auditable-privacy-payment is integrated
    # When false, all proof verifications succeed unconditionally (testing mode)

    # Maximum time (ms) to wait for a single proof verification
    verificationTimeoutMs: 5000

    # Maximum number of proofs to verify in a single batch
    batchSize: 10

    # Smart contract addresses for on-chain verification (requires deployment)
    contracts:
      # Groth16 proof verifier contract (deployed on each chain)
      groth16Verifier:
        ethereum: "0x0000000000000000000000000000000000000000"  # TODO: Deploy and set
        polygon: "0x0000000000000000000000000000000000000000"
        base: "0x0000000000000000000000000000000000000000"
        arbitrum: "0x0000000000000000000000000000000000000000"

      # Nullifier registry contract (prevents double-spending)
      nullifierRegistry:
        ethereum: "0x0000000000000000000000000000000000000000"  # TODO: Deploy and set
        polygon: "0x0000000000000000000000000000000000000000"
        base: "0x0000000000000000000000000000000000000000"
        arbitrum: "0x0000000000000000000000000000000000000000"

      # Merkle tree root tracker contract
      commitmentTree:
        ethereum: "0x0000000000000000000000000000000000000000"  # TODO: Deploy and set
        polygon: "0x0000000000000000000000000000000000000000"
        base: "0x0000000000000000000000000000000000000000"
        arbitrum: "0x0000000000000000000000000000000000000000"

    # RPC endpoints for on-chain proof submission (via Chain Sync service)
    rpc:
      ethereum: "https://eth-mainnet.g.alchemy.com/v2/ALCHEMY_KEY"  # TODO: Set from secret
      polygon: "https://polygon-mainnet.g.alchemy.com/v2/ALCHEMY_KEY"
      base: "https://base-mainnet.g.alchemy.com/v2/ALCHEMY_KEY"
      arbitrum: "https://arb-mainnet.g.alchemy.com/v2/ALCHEMY_KEY"

# ── Payment Engine (Hyperswitch) ─────────────────────────────────────────────
paymentEngine:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/payment-engine
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests: { cpu: "500m",  memory: "512Mi" }
    limits:   { cpu: "2000m", memory: "2Gi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

# ── Unified Router ─────────────────────────────────────────────────────────
unifiedRouter:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/unified-router
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests: { cpu: "100m",  memory: "128Mi" }
    limits:   { cpu: "500m",  memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ── MoR Layer (Polar fork) ────────────────────────────────────────────────
morLayer:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/mor-layer
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8010
  resources:
    requests: { cpu: "200m",  memory: "256Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }

# ── Billing Engine (Kill Bill) ───────────────────────────────────────────
billingEngine:
  enabled: true
  replicaCount: 1   # Kill Bill is stateful — scale carefully
  image:
    repository: forgepay/billing-engine
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8020
  resources:
    requests: { cpu: "500m",  memory: "1Gi" }
    limits:   { cpu: "2000m", memory: "4Gi" }
  # Kill Bill uses its own DB schema
  database:
    name: "killbill"

# ── Stablecoin Gateway (ZeroPay fork) ────────────────────────────────────
stablecoinGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/stablecoin-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8030
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Crypto Gateway (Keagate fork) ────────────────────────────────────────
cryptoGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/crypto-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8040
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Shared infrastructure (disable if BYO) ───────────────────────────────
postgresql:
  enabled: true
  auth:
    database: forgepay
    existingSecret: "forgepay-db-credentials"
  primary:
    persistence:
      size: 50Gi
    resources:
      requests: { cpu: "500m", memory: "512Mi" }

redis:
  enabled: true
  auth:
    enabled: false   # Enable + set password in prod
  master:
    persistence:
      size: 8Gi

# ── Ingress ──────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
  hosts:
    - host: api.forgepay.io
      paths:
        - path: /
          pathType: Prefix
          service: payment-engine
          port: 8080
    - host: hooks.forgepay.io
      paths:
        - path: /
          pathType: Prefix
          service: unified-router
          port: 8000
  tls:
    - secretName: forgepay-tls
      hosts: [api.forgepay.io, hooks.forgepay.io]
