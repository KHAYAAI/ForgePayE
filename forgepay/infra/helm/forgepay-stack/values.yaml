# ForgePay Umbrella Chart — Default Values
# Override per-environment with: helm install -f values.prod.yaml

global:
  # Image registry prefix (set to your private registry in prod)
  imageRegistry: ""
  imagePullSecrets: []
  # Shared Postgres connection (used by all services unless overridden)
  postgresql:
    host: "forgepay-postgresql"
    port: 5432
    database: "forgepay"
    existingSecret: "forgepay-db-credentials"
    secretKeys:
      password: "postgres-password"
  redis:
    url: "redis://forgepay-redis-master:6379"
  # Internal URL other services use to reach unified-router (webhook
  # forwarding, event-bus reads). Subchart Service names are release-name-
  # prefixed via each chart's own "<chart>.fullname" helper — this MUST
  # match the release name this umbrella chart is actually installed
  # under.
  #
  # This repo's own docs/scripts disagree on that release name — some
  # (values-mainnet.yaml's usage comment, forgepay/infra/staging/*, the
  # contracts deploy script) say "forgepay-stack"; the actual CI/CD
  # pipeline (.github/workflows/forgepay-deploy.yml) uses "forgepay" for
  # production and "forgepay-staging" for staging, neither of which is
  # "forgepay-stack". That workflow now passes
  # --set global.unifiedRouterUrl=... explicitly per environment, which
  # always wins over this default — this value only matters for a
  # standalone/manual `helm install` under some other release name, so
  # it's set to match the *production* CI job's actual release name
  # ("forgepay") rather than the aspirational "forgepay-stack" convention
  # some docs describe but the real pipeline doesn't follow. Always pass
  # --set global.unifiedRouterUrl=http://<release-name>-unified-router:8000
  # explicitly for any install under a different release name.
  unifiedRouterUrl: "http://forgepay-unified-router:8000"
  # All services emit OTEL traces/metrics here
  otel:
    endpoint: "http://otel-collector:4317"
    enabled: true

  # ── Zero-Knowledge Proof Configuration ──────────────────────────────────────
  # ARCH: Privacy-Preserving MoR integration (Phase 1)
  # NOTE: Currently STUBBED for testing. Set enabled: true to verify proofs in production.
  zk:
    # Enable ZK proof verification (false = skip verification, true = verify all proofs)
    enabled: false

    # TODO: Update to true when auditable-privacy-payment is integrated
    # When false, all proof verifications succeed unconditionally (testing mode)

    # Maximum time (ms) to wait for a single proof verification
    verificationTimeoutMs: 5000

    # Maximum number of proofs to verify in a single batch
    batchSize: 10

    # Smart contract addresses for on-chain verification (requires deployment)
    contracts:
      # Groth16 proof verifier contract (deployed on each chain)
      groth16Verifier:
        ethereum: "0x0000000000000000000000000000000000000000"  # TODO: Deploy and set
        polygon: "0x0000000000000000000000000000000000000000"
        base: "0x0000000000000000000000000000000000000000"
        arbitrum: "0x0000000000000000000000000000000000000000"

      # Nullifier registry contract (prevents double-spending)
      nullifierRegistry:
        ethereum: "0x0000000000000000000000000000000000000000"  # TODO: Deploy and set
        polygon: "0x0000000000000000000000000000000000000000"
        base: "0x0000000000000000000000000000000000000000"
        arbitrum: "0x0000000000000000000000000000000000000000"

      # Merkle tree root tracker contract
      commitmentTree:
        ethereum: "0x0000000000000000000000000000000000000000"  # TODO: Deploy and set
        polygon: "0x0000000000000000000000000000000000000000"
        base: "0x0000000000000000000000000000000000000000"
        arbitrum: "0x0000000000000000000000000000000000000000"

    # RPC endpoints for on-chain proof submission (via Chain Sync service)
    rpc:
      ethereum: "https://eth-mainnet.g.alchemy.com/v2/ALCHEMY_KEY"  # TODO: Set from secret
      polygon: "https://polygon-mainnet.g.alchemy.com/v2/ALCHEMY_KEY"
      base: "https://base-mainnet.g.alchemy.com/v2/ALCHEMY_KEY"
      arbitrum: "https://arb-mainnet.g.alchemy.com/v2/ALCHEMY_KEY"

# ── Payment Engine (Hyperswitch) ─────────────────────────────────────────────
paymentEngine:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/payment-engine
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests: { cpu: "500m",  memory: "512Mi" }
    limits:   { cpu: "2000m", memory: "2Gi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

# ── Unified Router ─────────────────────────────────────────────────────────
unifiedRouter:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/unified-router
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests: { cpu: "100m",  memory: "128Mi" }
    limits:   { cpu: "500m",  memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ── MoR Layer (Polar fork) ────────────────────────────────────────────────
morLayer:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/mor-layer
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8010
  resources:
    requests: { cpu: "200m",  memory: "256Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }

# ── Billing Engine (Kill Bill) ───────────────────────────────────────────
billingEngine:
  enabled: true
  replicaCount: 1   # Kill Bill is stateful — scale carefully
  image:
    repository: forgepay/billing-engine
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8020
  resources:
    requests: { cpu: "500m",  memory: "1Gi" }
    limits:   { cpu: "2000m", memory: "4Gi" }
  # Kill Bill uses its own DB schema
  database:
    name: "killbill"

# ── Stablecoin Gateway (ZeroPay fork) ────────────────────────────────────
stablecoinGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/stablecoin-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8030
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Crypto Gateway (Keagate fork) ────────────────────────────────────────
cryptoGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/crypto-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8040
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Chain Sync (Phase 3: ZK proof contract monitoring) ───────────────────
# Monitors CommitmentTree + NullifierRegistry contracts on all EVM chains.
# Disabled until contracts are deployed (Phase 3 go-live).
chainSync:
  enabled: false  # Enable after deploying contracts to testnet
  replicaCount: 1   # Single replica — stateful event listener
  image:
    repository: forgepay/chain-sync
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8050
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }
  # Contract addresses — set after deploying infra/contracts/
  # TODO: Populate after `npm run deploy:testnet` from infra/contracts/
  contracts:
    ethereum:
      groth16Verifier:   "0x0000000000000000000000000000000000000000"
      nullifierRegistry: "0x0000000000000000000000000000000000000000"
      commitmentTree:    "0x0000000000000000000000000000000000000000"
    polygon:
      groth16Verifier:   "0x0000000000000000000000000000000000000000"
      nullifierRegistry: "0x0000000000000000000000000000000000000000"
      commitmentTree:    "0x0000000000000000000000000000000000000000"
    base:
      groth16Verifier:   "0x0000000000000000000000000000000000000000"
      nullifierRegistry: "0x0000000000000000000000000000000000000000"
      commitmentTree:    "0x0000000000000000000000000000000000000000"
    arbitrum:
      groth16Verifier:   "0x0000000000000000000000000000000000000000"
      nullifierRegistry: "0x0000000000000000000000000000000000000000"
      commitmentTree:    "0x0000000000000000000000000000000000000000"

# ── Accounts Service (Phase 2: stablecoin-backed accounts) ───────────────
# Manages USD/USDC wallets, KYC/AML (Onfido), Circle deposits/withdrawals.
# ZK proofs gated behind zkProofs.enabled (Phase 2).
accountsService:
  enabled: true
  replicaCount: 2
  image:
    repository: forgepay/accounts-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8040
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  kyc:
    ofacScreeningEnabled: false
  accounts:
    defaultChain:         "polygon"
    minDepositUsd:        "10"
    maxDepositUsd:        "50000"
    withdrawalFeePercent: "0.5"
  zkProofs:
    enabled: false  # Phase 2: set true after ZK sidecar deployment + circuit finalization

# ── Enterprise Treasury ─────────────────────────────────────────────────
enterpriseTreasury:
  enabled: false   # flip true to expose treasury tools
  replicaCount: 1
  image:
    repository: forgepay/enterprise-treasury
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3012
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Agent Identity ───────────────────────────────────────────────────────
# AI agent registry for agentic commerce (discovery, reputation).
agentIdentity:
  enabled: false   # flip true to enable agentic commerce
  replicaCount: 1
  image:
    repository: forgepay/agent-identity
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3010
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }

# ── Agent Negotiation ────────────────────────────────────────────────────
# Structured negotiation + USDC escrow between AI agents.
agentNegotiation:
  enabled: false   # flip true alongside agentIdentity
  replicaCount: 1
  image:
    repository: forgepay/agent-negotiation
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3011
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }

# ── Agent Decision Framework ─────────────────────────────────────────────
# Risk scoring / policy engine — evaluates agent transactions against
# reputation, velocity, and policy gates. Called by other services, not
# end users directly, so no ingress path is defined for it.
agentDecisionFramework:
  enabled: false   # flip true alongside agentIdentity / agentNegotiation
  replicaCount: 1
  image:
    repository: forgepay/agent-decision-framework
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3013
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }

# ── Agent Liquidity Manager ───────────────────────────────────────────────
# Multi-asset agent portfolio tracking, target-driven rebalancing, and
# idle-balance auto-sweep to yield. Money-movement path — requires
# ALM_ADMIN_API_KEY (see the service's standalone chart values for the
# secret-backed env wiring); flip on alongside agentIdentity.
agentLiquidityManager:
  enabled: false   # flip true alongside agentIdentity
  replicaCount: 1
  image:
    repository: forgepay/agent-liquidity-manager
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3014
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }

# ── RWA Registry ─────────────────────────────────────────────────────────
# Tokenized Real-World Asset positions (Ondo USDY, TBILL, BUIDL, FOBXX).
rwaRegistry:
  enabled: false   # flip true to expose RWA investments
  replicaCount: 1
  image:
    repository: forgepay/rwa-registry
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3008
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }

# ── Agent Credit Bureau ───────────────────────────────────────────────────
# FICO-style scoring for autonomous agents, billing (prepaid USDC ledger),
# furnisher ingest, disputes and lender reports. Requires BUREAU_ADMIN_API_KEY
# and CONSENT_SIGNING_SECRET (see the service's standalone chart values for
# the secret-backed env wiring) — refuses to boot in production without them,
# without a database, or with CORS_ORIGIN unset/"*".
agentCreditBureau:
  enabled: false   # flip true alongside agentIdentity / complianceMonitor
  replicaCount: 1
  image:
    repository: forgepay/agent-credit-bureau
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3018
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }

# ── Compliance Monitor ────────────────────────────────────────────────────
# OFAC/EU sanctions screening (free government lists, polled + cached),
# transaction monitoring, KYC. forge-custody and agent-credit-bureau both
# call this — both fail closed in production when it's unreachable, so this
# needs to be enabled before either of them in any real deployment.
complianceMonitor:
  enabled: false   # flip true alongside forgeCustody / agentCreditBureau
  replicaCount: 1
  image:
    repository: forgepay/compliance-monitor
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8003
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "300m", memory: "512Mi" }

# ── Forge Agent ──────────────────────────────────────────────────────────
# AI billing assistant powered by Claude.
# Two-flag launch sequence:
#   1. Set forgeAgent.enabled: true  → activates Forge Agent (15 core tools)
#   2. Set forgeAgent.billingEnabled: true → adds F.Billing tools (Kill Bill, 5 tools)
forgeAgent:
  enabled:        false   # flip true to launch Forge Agent
  billingEnabled: false   # flip true to launch F.Billing Kill Bill tools
  model:          "claude-opus-4-7"
  maxTokens:      4096
  approvalRequired: true  # gate destructive actions behind merchant confirmation
  # Service URLs used by Forge Agent tools — set automatically from sub-chart ports
  serviceUrls:
    enterpriseTreasury: "http://enterprise-treasury:3012"
    agentIdentity:      "http://agent-identity:3010"
    agentNegotiation:   "http://agent-negotiation:3011"
    rwaRegistry:        "http://rwa-registry:3008"
    complianceMonitor:  "http://compliance-monitor:8003"
    forecaster:         "http://liquidity-forecaster:8002"

# ── Shared infrastructure (disable if BYO) ───────────────────────────────
postgresql:
  enabled: true
  auth:
    database: forgepay
    existingSecret: "forgepay-db-credentials"
  primary:
    persistence:
      size: 50Gi
    resources:
      requests: { cpu: "500m", memory: "512Mi" }

redis:
  enabled: true
  auth:
    enabled: false   # Enable + set password in prod
  master:
    persistence:
      size: 8Gi

# ── Ingress ──────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
  hosts:
    - host: api.forgepay.io
      paths:
        - path: /
          pathType: Prefix
          service: payment-engine
          port: 8080
    - host: hooks.forgepay.io
      paths:
        - path: /
          pathType: Prefix
          service: unified-router
          port: 8000
  tls:
    - secretName: forgepay-tls
      hosts: [api.forgepay.io, hooks.forgepay.io]
