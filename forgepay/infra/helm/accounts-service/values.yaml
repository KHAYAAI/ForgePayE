replicaCount: 3
image:
  repository: forgepay/accounts-service
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8040
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '8040'
secretRef: forgepay-accounts-service-secrets
kyc:
  ofacScreeningEnabled: false
accounts:
  defaultChain: polygon
  minDepositUsd: '10'
  maxDepositUsd: '50000'
  withdrawalFeePercent: '0.5'
zkProofs:
  enabled: false
resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 600m
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
livenessProbe:
  httpGet:
    path: /healthz
    port: 8040
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readyz
    port: 8040
  initialDelaySeconds: 5
  periodSeconds: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring

# Standalone-install fallback for the global.* values the umbrella chart
# (forgepay-stack) normally injects. `helm lint`/`helm template` on this
# chart alone would otherwise panic on a nil-map dereference — these are
# empty defaults the in-template `| default "..."` filters fall back
# past, not real connection info. When installed via the umbrella, these
# are entirely overridden by the umbrella's own global values.
global:
  postgresql: {}
  redis: {}
  unifiedRouterUrl: ""
