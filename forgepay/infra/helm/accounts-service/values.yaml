replicaCount: 2
image:
  repository: forgepay/accounts-service
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8040
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '8040'
secretRef: forgepay-accounts-service-secrets
kyc:
  ofacScreeningEnabled: false
accounts:
  defaultChain: polygon
  minDepositUsd: '10'
  maxDepositUsd: '50000'
  withdrawalFeePercent: '0.5'
zkProofs:
  enabled: false
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 400m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
livenessProbe:
  httpGet:
    path: /healthz
    port: 8040
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readyz
    port: 8040
  initialDelaySeconds: 5
  periodSeconds: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
