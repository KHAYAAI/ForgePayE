apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unified-router.fullname" . }}
  labels:
    {{- include "unified-router.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "unified-router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "unified-router.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: unified-router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.global.postgresql.host | default "forgepay-postgresql" | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.global.postgresql.port | default 5432 | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.global.postgresql.database | default "forgepay" | quote }}
            - name: POSTGRES_USER
              value: "forgepay"
            - name: REDIS_URL
              value: {{ .Values.global.redis.url | default "redis://forgepay-redis-master:6379" | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretRef }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
