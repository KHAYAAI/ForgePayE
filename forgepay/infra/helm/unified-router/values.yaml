replicaCount: 3
image:
  repository: forgepay/unified-router
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '8000'
secretRef: forgepay-unified-router-secrets
kyapay:
  trustedIssuers: https://skyfire.xyz,https://api.forgepay.com
  issuerUrl: https://api.forgepay.com
resources:
  requests:
    cpu: 600m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readyz
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
metrics:
  enabled: true
  port: 9090
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring

# Standalone-install fallback for the global.* values the umbrella chart
# (forgepay-stack) normally injects. `helm lint`/`helm template` on this
# chart alone would otherwise panic on a nil-map dereference — these are
# empty defaults the in-template `| default "..."` filters fall back
# past, not real connection info. When installed via the umbrella, these
# are entirely overridden by the umbrella's own global values.
global:
  postgresql: {}
  redis: {}
  unifiedRouterUrl: ""
