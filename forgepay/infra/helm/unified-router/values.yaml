replicaCount: 2
image:
  repository: forgepay/unified-router
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '8000'
secretRef: forgepay-unified-router-secrets
kyapay:
  trustedIssuers: https://skyfire.xyz,https://api.forgepay.com
  issuerUrl: https://api.forgepay.com
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readyz
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
metrics:
  enabled: true
  port: 9090
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

podDisruptionBudget:
  enabled: true
  minAvailable: 1
