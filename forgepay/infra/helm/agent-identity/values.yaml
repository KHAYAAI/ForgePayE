replicaCount: 3
minReadySeconds: 30
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
image:
  repository: forgepay/agent-identity
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3010
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '3010'
  DATABASE_URL: ''
agentNegotiationUrl: http://agent-negotiation:3011
rateLimitPerMinute: 200
secretRef: forgepay-agent-identity-secrets
kyapay:
  keyId: forgepay-agent-identity-1
  issuerUrl: https://api.forgepay.com
  trustedIssuers: https://skyfire.xyz,https://api.forgepay.com
resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 600m
    memory: 768Mi
livenessProbe:
  httpGet:
    path: /health
    port: 3010
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /health
    port: 3010
  initialDelaySeconds: 5
  periodSeconds: 10
metrics:
  enabled: true
  port: 9098
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
