replicaCount: 3
image:
  repository: forgepay/agent-liquidity-manager
  pullPolicy: IfNotPresent
  tag: 0.1.0
service:
  type: ClusterIP
  port: 3014
  targetPort: 3014
resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 600m
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
env:
  PORT: '3014'
  LOG_LEVEL: info
  NODE_ENV: production
  RATE_LIMIT_PER_MIN: '100'
  CORS_ORIGIN: '*'
# ALM_ADMIN_API_KEY is NOT set here — this service refuses to boot in
# production without it (see src/auth.ts getAdminKeyHash). Populate a
# Secret named "<release-name>-agent-liquidity-manager-secrets" with an
# ALM_ADMIN_API_KEY key (sourced from Vault / AWS Secrets Manager, never
# committed) — templates/deployment.yaml already loads it via envFrom.
livenessProbe:
  httpGet:
    path: /health
    port: 3014
  initialDelaySeconds: 15
  periodSeconds: 30
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: 3014
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '3014'
  prometheus.io/path: /health

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
