replicaCount: 3
image:
  repository: forgepay/institutional-reporting
  pullPolicy: IfNotPresent
  tag: 0.1.0
service:
  type: ClusterIP
  port: 3017
  targetPort: 3017
resources:
  requests:
    cpu: 300m
    memory: 576Mi
  limits:
    cpu: 600m
    memory: 1152Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
env:
  PORT: '3017'
  LOG_LEVEL: info
  NODE_ENV: production
  RATE_LIMIT_PER_MIN: '60'
  CORS_ORIGIN: '*'
livenessProbe:
  httpGet:
    path: /health
    port: 3017
  initialDelaySeconds: 15
  periodSeconds: 30
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: 3017
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '3017'
  prometheus.io/path: /health

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
