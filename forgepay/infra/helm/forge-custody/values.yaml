replicaCount: 2
image:
  repository: forgepay/forge-custody
  pullPolicy: IfNotPresent
  tag: 0.1.0
service:
  type: ClusterIP
  port: 3019
  targetPort: 3019
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
env:
  PORT: '3019'
  LOG_LEVEL: info
  NODE_ENV: production
  RATE_LIMIT_PER_MIN: '300'
  UNIFIED_ROUTER_URL: http://unified-router:8000
  COMPLIANCE_MONITOR_URL: http://compliance-monitor:8004
  MPC_COORDINATOR_URL: http://openfireblocks-mpc:3002
# DATABASE_URL, WEBHOOK_SECRET, BLOCKCHAIN_RPC_URL come from the
# forge-custody-secrets Secret (Vault / AWS Secrets Manager — never inline).
secretRefs:
  - DATABASE_URL
  - WEBHOOK_SECRET
  - BLOCKCHAIN_RPC_URL
livenessProbe:
  httpGet:
    path: /api/health
    port: 3019
  initialDelaySeconds: 20
  periodSeconds: 30
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /api/health
    port: 3019
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '3019'
  prometheus.io/path: /metrics
metrics:
  enabled: true
