replicaCount: 3
image:
  repository: forgepay/mor-layer
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8010
env:
  ENVIRONMENT: production
  LOG_LEVEL: info
  PORT: '8010'
secretRef: forgepay-mor-layer-secrets
resources:
  requests:
    cpu: 600m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
livenessProbe:
  httpGet:
    path: /health
    port: 8010
  initialDelaySeconds: 15
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /ready
    port: 8010
  initialDelaySeconds: 10
  periodSeconds: 10
metrics:
  enabled: true
  port: 9091
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
