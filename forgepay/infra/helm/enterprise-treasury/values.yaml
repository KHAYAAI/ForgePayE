replicaCount: 1

image:
  repository: forgepay/enterprise-treasury
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3012

env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: "3012"

bankConnectivityUrl: "http://bank-connectivity:3006"
yieldEngineUrl: "http://yield-engine:3007"
rateLimitPerMinute: 100

# Kubernetes secret with sensitive values — never hardcode here.
# Expected keys (if needed in future):
#   INTERNAL_WEBHOOK_SECRET
secretRef: "forgepay-enterprise-treasury-secrets"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 3012
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 3012
  initialDelaySeconds: 5
  periodSeconds: 10
