replicaCount: 1
image:
  repository: forgepay/agent-credit-bureau
  pullPolicy: IfNotPresent
  tag: 0.1.0
service:
  type: ClusterIP
  port: 3018
  targetPort: 3018
resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 600m
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
env:
  PORT: '3018'
  LOG_LEVEL: info
  NODE_ENV: production
  RATE_LIMIT_PER_MIN: '200'
  # The bureau refuses to start in production with CORS_ORIGIN unset or '*'. Set the console's real origin(s), comma-separated.
  CORS_ORIGIN: 'https://console.myforgepay.com'
  AGENT_IDENTITY_URL: http://agent-identity:3010
  AGENT_DECISION_URL: http://agent-decision-framework:3013
  # Sanctions screening fails closed without this. The monitor itself must have loaded its lists.
  COMPLIANCE_MONITOR_URL: http://compliance-monitor:8003
  # Proxies in front of the bureau (ingress = 1; CloudFront plus a load balancer in front of ingress = 2 or 3).
  TRUST_PROXY_HOPS: '1'
# Secrets are NOT set here. Create a Kubernetes Secret named <release>-agent-credit-bureau-secrets (from AWS Secrets Manager
# or Vault) holding at least: DATABASE_URL, BUREAU_ADMIN_API_KEY, CONSENT_SIGNING_SECRET, WEBHOOK_SIGNING_MASTER (each 32+ random characters),
# REDIS_URL, and COMPLIANCE_MONITOR_API_KEY. The bureau stops at startup in production if any required one is missing.
# Check the full set with forgepay/infra/launch/bureau/preflight.mjs before installing.
livenessProbe:
  httpGet:
    path: /health
    port: 3018
  initialDelaySeconds: 15
  periodSeconds: 30
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: 3018
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '3018'
  prometheus.io/path: /metrics
metrics:
  enabled: true
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
