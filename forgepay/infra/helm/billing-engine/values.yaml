replicaCount: 1
image:
  repository: forgepay/billing-engine-killbill
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
env:
  CATALINA_OPTS: -Dorg.killbill.server.properties=/etc/killbill/killbill.properties
  KILLBILL_MODES: STANDALONE
postgres:
  host: postgres
  port: 5432
  database: killbill
  user: killbill
secretRef: forgepay-billing-engine-secrets
plugins:
- name: Kill Bill ForgePay Plugin
  version: 0.1.0
  config: 'forgepay.webhook_secret=***

    forgepay.hyperswitch_url=http://forgepay-payment-engine:8080

    '
resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: 800m
    memory: 1536Mi
livenessProbe:
  httpGet:
    path: /1.0/kb/health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /1.0/kb/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15
metrics:
  enabled: true
  port: 9092
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
