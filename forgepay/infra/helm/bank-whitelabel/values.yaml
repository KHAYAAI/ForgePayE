replicaCount: 2

image:
  repository: forgepay/bank-whitelabel
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3015

env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: "3015"

# JWT secret — override via K8s secret in production
jwtSecret: "changeme-in-production"

# Internal webhook HMAC secret — shared with unified-router
internalWebhookSecret: "changeme-in-production"

rateLimitPerMinute: 200

# Secrets injected via K8s secret refs — not hardcoded here
secretRef: "forgepay-bank-whitelabel-secrets"
# Expected keys in that secret:
#   JWT_SECRET                  (min 32 chars — used to sign/verify admin JWTs)
#   INTERNAL_WEBHOOK_SECRET     (HMAC-SHA256 key shared with unified-router)
#   CORS_ORIGINS                (comma-separated list of allowed origins)

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /health
    port: 3015
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 3015
  initialDelaySeconds: 5
  periodSeconds: 10
