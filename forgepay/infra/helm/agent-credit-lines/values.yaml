replicaCount: 2

image:
  repository: forgepay/agent-credit-lines
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 3016
  targetPort: 3016

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  PORT: "3016"
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  RATE_LIMIT_PER_MIN: "100"
  CORS_ORIGIN: "*"
  AGENT_IDENTITY_URL: "http://agent-identity:3010"
  ENTERPRISE_TREASURY_URL: "http://enterprise-treasury:3012"
  # DATABASE_URL: set via Vault/Secrets Manager
  # ENTERPRISE_TREASURY_API_KEY: set via Vault/Secrets Manager

livenessProbe:
  httpGet:
    path: /health
    port: 3016
  initialDelaySeconds: 15
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 3016
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3016"
  prometheus.io/path: "/health"

# Prometheus metrics configuration
metrics:
  enabled: true
  port: 9097
  path: /metrics

# Service Monitor for Prometheus scraping
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus
