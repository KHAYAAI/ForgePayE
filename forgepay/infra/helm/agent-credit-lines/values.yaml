replicaCount: 3
image:
  repository: forgepay/agent-credit-lines
  pullPolicy: IfNotPresent
  tag: 0.1.0
service:
  type: ClusterIP
  port: 3016
  targetPort: 3016
resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 600m
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
env:
  PORT: '3016'
  LOG_LEVEL: info
  NODE_ENV: production
  RATE_LIMIT_PER_MIN: '100'
  CORS_ORIGIN: '*'
  AGENT_IDENTITY_URL: http://agent-identity:3010
  ENTERPRISE_TREASURY_URL: http://enterprise-treasury:3012
livenessProbe:
  httpGet:
    path: /health
    port: 3016
  initialDelaySeconds: 15
  periodSeconds: 30
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: 3016
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '3016'
  prometheus.io/path: /health
metrics:
  enabled: true
  port: 9097
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
