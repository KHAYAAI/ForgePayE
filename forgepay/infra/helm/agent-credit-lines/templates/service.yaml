apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agent-credit-lines
  labels:
    app: agent-credit-lines
spec:
  type: {{ .Values.service.type }}
  selector:
    app: agent-credit-lines
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
