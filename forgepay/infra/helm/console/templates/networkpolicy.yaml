{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Other pods in this namespace.
    - from:
        - podSelector: {}
    {{- if .Values.networkPolicy.allowIngressFromCidrs }}
    # The load balancer, which in IP-target mode reaches the pod from inside the VPC.
    - from:
        {{- range .Values.networkPolicy.allowIngressFromCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- end }}
  egress:
    # Other pods in this namespace (the bureau, Redis).
    - to:
        - podSelector: {}
    # DNS.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Databases, mail and sign-in providers outside the cluster, over their usual ports.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 587
{{- end }}
