replicaCount: 3
image:
  repository: forgepay/yield-engine
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8100
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '8100'
secretRef: forgepay-yield-engine-secrets
resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 600m
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
livenessProbe:
  httpGet:
    path: /healthz
    port: 8100
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readyz
    port: 8100
  initialDelaySeconds: 5
  periodSeconds: 10
metrics:
  enabled: true
  port: 9099
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
