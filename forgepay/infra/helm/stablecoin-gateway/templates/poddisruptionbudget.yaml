{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "stablecoin-gateway.fullname" . }}
  labels:
    {{- include "stablecoin-gateway.labels" . | nindent 4 }}
spec:
  {{- if eq (include "stablecoin-gateway.multiReplica" .) "true" }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  # A single replica with minAvailable: 1 would make every node drain hang.
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "stablecoin-gateway.selectorLabels" . | nindent 6 }}
{{- end }}
