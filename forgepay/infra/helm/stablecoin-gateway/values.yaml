replicaCount: 2

image:
  repository: forgepay/stablecoin-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8020

env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: "8020"

# Secrets injected via K8s secret refs — not hardcoded here
secretRef: "forgepay-stablecoin-gateway-secrets"
# Expected keys in that secret:
#   POSTGRES_PASSWORD
#   INTERNAL_WEBHOOK_SECRET
#   PRIVATE_KEY_ENCRYPTION_KEY  (64-char hex / 32 bytes — AES-256-GCM key for deposit private keys)
#   ETH_RPC_URL      (Alchemy/Infura/QuickNode Ethereum mainnet)
#   POLYGON_RPC_URL
#   BASE_RPC_URL
#   ARBITRUM_RPC_URL
#   AUDITOR_SERVICE_URL          (internal URL of mor-layer for shielded memo decryption)
#   NULLIFIER_REGISTRY_ETHEREUM  (contract address — set after deployment)
#   NULLIFIER_REGISTRY_POLYGON
#   NULLIFIER_REGISTRY_BASE
#   NULLIFIER_REGISTRY_ARBITRUM

# Shielded payment configuration (ZK privacy layer)
# Set SHIELDED_ENABLED=true once NullifierRegistry contracts are deployed
shielded:
  enabled: false   # TODO: set true after Phase 3 contract deployment
  monitorIntervalMs: "30000"
  # NullifierRegistry contract addresses (all-zero until deployed to mainnet)
  # TODO: Update after deploying contracts/NullifierRegistry.sol
  nullifierRegistry:
    ethereum: "0x0000000000000000000000000000000000000000"
    polygon:  "0x0000000000000000000000000000000000000000"
    base:     "0x0000000000000000000000000000000000000000"
    arbitrum: "0x0000000000000000000000000000000000000000"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /healthz
    port: 8020
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /readyz
    port: 8020
  initialDelaySeconds: 5
  periodSeconds: 10
