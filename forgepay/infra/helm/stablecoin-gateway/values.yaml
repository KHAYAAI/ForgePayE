replicaCount: 2
image:
  repository: forgepay/stablecoin-gateway
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8020
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '8020'
secretRef: forgepay-stablecoin-gateway-secrets
shielded:
  enabled: false
  monitorIntervalMs: '30000'
  nullifierRegistry:
    ethereum: '0x0000000000000000000000000000000000000000'
    polygon: '0x0000000000000000000000000000000000000000'
    base: '0x0000000000000000000000000000000000000000'
    arbitrum: '0x0000000000000000000000000000000000000000'
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
livenessProbe:
  httpGet:
    path: /healthz
    port: 8020
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readyz
    port: 8020
  initialDelaySeconds: 5
  periodSeconds: 10
metrics:
  enabled: true
  port: 9093
  path: /metrics
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus
