apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rwa-registry
  labels:
    app: rwa-registry
    app.kubernetes.io/name: rwa-registry
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: rwa-registry
    app.kubernetes.io/instance: {{ .Release.Name }}
