replicaCount: 1
image:
  repository: forgepay/agent-negotiation
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3011
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: '3011'
agentIdentityUrl: http://agent-identity:3010
stablecoinGatewayUrl: http://stablecoin-gateway:3002
rateLimitPerMinute: 200
secretRef: forgepay-agent-negotiation-secrets
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 400m
    memory: 512Mi
livenessProbe:
  httpGet:
    path: /health
    port: 3011
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /health
    port: 3011
  initialDelaySeconds: 5
  periodSeconds: 10

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: false
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
