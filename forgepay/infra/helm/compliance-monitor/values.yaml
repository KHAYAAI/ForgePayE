# One replica unless a values file says otherwise. Each replica loads the sanctions lists itself.
replicaCount: 1
image:
  repository: forgepay/compliance-monitor
  tag: 0.1.0
  pullPolicy: IfNotPresent
  # Production deploys by DIGEST (sha256:<64 hex>), supplied by the deploy workflow. requireDigest makes the chart refuse to render
  # without one; it is off here so the umbrella chart keeps working, and the deploy workflow turns it on.
  digest: ""
  requireDigest: false
# Secrets are NOT set here. The pod reads them from this Kubernetes Secret (made from AWS Secrets Manager or Vault), which must exist
# before install: DATABASE_URL (postgresql+asyncpg://...; use a password without '%'), REDIS_URL (rediss://... for a managed Redis),
# JWT_SECRET (>= 32 characters), INTERNAL_SERVICE_SECRET, and SERVICE_API_KEY_HASHES ("<sha256 of the bureau's key>:bureau",
# comma-separated, one per calling service). The service refuses to start in production without them.
existingSecret: compliance-monitor-secrets
# Database migrations (`alembic upgrade head`) run as a Job before every install and upgrade, with the same image and Secret.
migrations:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 300
service:
  type: ClusterIP
  port: 8003
  targetPort: 8003
  name: compliance-monitor
env:
  ENVIRONMENT: production
  PORT: '8003'
  LOG_LEVEL: INFO
  PAYMENT_ENGINE_URL: http://payment-engine:8080
  AUDIT_SERVICE_URL: http://bank-whitelabel:8005
  OFAC_FEED_URL: https://www.treasury.gov/ofac/downloads/ssi/
  OFAC_CACHE_TTL: '86400'
  OFAC_SDN_URL: https://www.treasury.gov/ofac/downloads/sdn.xml
  EU_SANCTIONS_URL: https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content
  OFAC_REFRESH_CRON: 0 2 * * *
  EU_SANCTIONS_REFRESH_CRON: 0 3 * * *
  HIGH_RISK_COUNTRIES: IR,KP,SY,CU,RU,BY,MM,SD,YE
  STRUCTURING_THRESHOLD_USD: '10000.0'
  LARGE_TRANSACTION_THRESHOLD_USD: '50000.0'
  SAR_AUTO_THRESHOLD_SCORE: '50'
  FUZZY_MATCH_THRESHOLD: '0.85'
  CORS_ORIGINS: https://dashboard.myforgepay.com,https://console.myforgepay.com
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '8003'
  prometheus.io/path: /metrics
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001      # the image's own non-root user
  runAsGroup: 1001
  fsGroup: 1001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: 800m
    memory: 1536Mi
persistence:
  enabled: false
livenessProbe:
  httpGet:
    path: /health
    port: 8003
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: 8003
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
# The chart has no HorizontalPodAutoscaler: replicas are set by replicaCount. (This used to say enabled: true, which only left the
# Deployment without a replica count.)
autoscaling:
  enabled: false
# Internal only: the bureau and the gateway call it inside the cluster. Nothing outside should reach a sanctions screen directly.
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: '100'
  hosts:
  - host: compliance.api.myforgepay.com
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: compliance-monitor-tls
    hosts:
    - compliance.api.myforgepay.com
serviceAccount:
  create: true
  annotations: {}
  name: compliance-monitor
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# Turn on together with replicaCount >= 2: with one replica a minAvailable of 1 blocks every node drain.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
  # Extra egress rules (raw NetworkPolicy egress entries), e.g. the VPC range on 5432/6379 for a managed Postgres and Redis,
  # which sit outside the cluster and are not reached by the same-namespace rule above.
  extraEgress: []
