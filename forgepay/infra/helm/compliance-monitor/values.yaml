replicaCount: 2
image:
  repository: forgepay/compliance-monitor
  tag: 0.1.0
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8003
  targetPort: 8003
  name: compliance-monitor
env:
  ENVIRONMENT: production
  PORT: '8003'
  LOG_LEVEL: INFO
  PAYMENT_ENGINE_URL: http://payment-engine:8080
  AUDIT_SERVICE_URL: http://bank-whitelabel:8005
  REDIS_URL: redis://compliance-monitor-redis:6379/2
  OFAC_FEED_URL: https://www.treasury.gov/ofac/downloads/ssi/
  OFAC_CACHE_TTL: '86400'
  OFAC_SDN_URL: https://www.treasury.gov/ofac/downloads/sdn.xml
  EU_SANCTIONS_URL: https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content
  OFAC_REFRESH_CRON: 0 2 * * *
  EU_SANCTIONS_REFRESH_CRON: 0 3 * * *
  HIGH_RISK_COUNTRIES: IR,KP,SY,CU,RU,BY,MM,SD,YE
  STRUCTURING_THRESHOLD_USD: '10000.0'
  LARGE_TRANSACTION_THRESHOLD_USD: '50000.0'
  SAR_AUTO_THRESHOLD_SCORE: '50'
  FUZZY_MATCH_THRESHOLD: '0.85'
  CORS_ORIGINS: https://dashboard.forgepay.io,https://console.forgepay.io
secrets:
  JWT_SECRET: ''
  INTERNAL_SERVICE_SECRET: ''
  CHAINALYSIS_API_KEY: ''
  ELLIPTIC_API_KEY: ''
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '8003'
  prometheus.io/path: /metrics
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 400m
    memory: 768Mi
persistence:
  enabled: false
livenessProbe:
  httpGet:
    path: /health
    port: 8003
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: 8003
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: ''
  persistence:
    enabled: true
    size: 2Gi
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: '100'
  hosts:
  - host: compliance.api.forgepay.io
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: compliance-monitor-tls
    hosts:
    - compliance.api.forgepay.io
serviceAccount:
  create: true
  annotations: {}
  name: compliance-monitor
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

podDisruptionBudget:
  enabled: true
  minAvailable: 1
