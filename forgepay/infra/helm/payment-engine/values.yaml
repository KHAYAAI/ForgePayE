replicaCount: 3
image:
  repository: forgepay/payment-engine
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
env:
  PORT: '8080'
  ENVIRONMENT: production
  LOG_LEVEL: debug
hyperswitch:
  secretsFile: /etc/forgepay/secrets.toml
  vaultUrl: http://vault:8200
secretRef: forgepay-payment-engine-secrets
resources:
  requests:
    cpu: 1200m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /health/ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngressFromIngressController: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
