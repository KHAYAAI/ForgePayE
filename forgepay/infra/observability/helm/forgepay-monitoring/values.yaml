# ── ForgePay Monitoring Stack ──────────────────────────────────────────────────
# Override per environment:
#   helm upgrade --install forgepay-monitoring . -f values-production.yaml

global:
  storageClass: ""

# ── kube-prometheus-stack ──────────────────────────────────────────────────────
kube-prometheus-stack:
  enabled: true

  prometheus:
    prometheusSpec:
      retention:           "30d"
      retentionSize:       "40GB"
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      additionalScrapeConfigs:
        # Mounted from the prometheus.yml configmap
        - job_name:    otel-collector
          static_configs:
            - targets: ["otel-collector:8889"]
      ruleFiles:
        - /etc/prometheus/rules/forgepay-alerts.yml

    # Load the ForgePay alert rules
    additionalPrometheusRulesMap:
      forgepay-alerts:
        groups: []   # Populated via configmap below

  grafana:
    enabled:         true
    adminPassword:   "changeme"   # Override with Vault secret in production

    grafana.ini:
      server:
        root_url:       "%(protocol)s://%(domain)s/grafana"
        serve_from_sub_path: true
      analytics:
        reporting_enabled: false

    persistence:
      enabled:      true
      size:         5Gi

    sidecar:
      dashboards:
        enabled:     true
        searchNamespace: forgepay
        label:       grafana_dashboard
      datasources:
        enabled:     true
        searchNamespace: forgepay
        label:       grafana_datasource

    # Pre-provision ForgePay dashboards as a ConfigMap
    dashboardsConfigMaps:
      forgepay: "grafana-forgepay-dashboards"

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name:      Prometheus
            type:      prometheus
            url:       http://forgepay-monitoring-kube-prometheus-prometheus:9090
            access:    proxy
            isDefault: true
          - name:      Jaeger
            type:      jaeger
            url:       http://jaeger-query:16686
            uid:       jaeger

  alertmanager:
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by:        ["alertname", "team"]
        group_wait:      30s
        group_interval:  5m
        repeat_interval: 4h
        receiver:        "default"
        routes:
          - match:
              severity: critical
            receiver: pagerduty
      receivers:
        - name: default
        - name: pagerduty
          pagerduty_configs:
            - routing_key: "{{ .ExternalURL }}"   # Set via secret

# ── OpenTelemetry Collector ────────────────────────────────────────────────────
opentelemetry-collector:
  enabled: true

  mode: deployment

  image:
    repository: otel/opentelemetry-collector-contrib
    tag:        "0.100.0"

  replicaCount: 2

  resources:
    requests:
      cpu:    "100m"
      memory: "256Mi"
    limits:
      cpu:    "500m"
      memory: "512Mi"

  config:
    # Mounted from configmap (config.yaml above)
    existingConfigMap: "otel-collector-config"

  ports:
    otlp:
      enabled:       true
      containerPort: 4317
      servicePort:   4317
      protocol:      TCP
    otlp-http:
      enabled:       true
      containerPort: 4318
      servicePort:   4318
      protocol:      TCP
    metrics:
      enabled:       true
      containerPort: 8889
      servicePort:   8889
      protocol:      TCP

  service:
    type: ClusterIP

# ── Jaeger (all-in-one for staging; production uses distributed) ───────────────
jaeger:
  enabled: true

  allInOne:
    enabled: true
    image:
      tag: "1.57"
    resources:
      requests:
        cpu:    "100m"
        memory: "256Mi"
      limits:
        cpu:    "500m"
        memory: "512Mi"

  storage:
    type: memory   # Switch to elasticsearch for production

  query:
    basePath: /jaeger
