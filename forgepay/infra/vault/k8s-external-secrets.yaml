# ForgePay — ExternalSecrets Operator manifests
#
# Requires:
#   - external-secrets.io/v1beta1 CRDs installed
#     (helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace)
#   - A ClusterSecretStore or SecretStore named "forgepay-vault" pointing at Vault
#
# Apply:
#   kubectl apply -f k8s-external-secrets.yaml -n forgepay

---
# ── SecretStore: Vault KV v2 backend ─────────────────────────────────────────
# A namespaced SecretStore; promote to ClusterSecretStore if secrets are
# shared across namespaces.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: forgepay-vault
  namespace: forgepay
  labels:
    app.kubernetes.io/part-of: forgepay
spec:
  provider:
    vault:
      server: "http://vault:8200"       # Replace with your Vault address
      path: "forgepay"                  # KV v2 mount path
      version: "v2"
      auth:
        # Use a Kubernetes service account for auth.
        # Each ExternalSecret below uses its own SA via the referent field.
        kubernetes:
          mountPath: "kubernetes"
          role: "forgepay-services"
          serviceAccountRef:
            name: forgepay-services    # Generic SA; override per-service if needed

---
# ── ExternalSecret: enterprise-treasury ──────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enterprise-treasury-secrets
  namespace: forgepay
  labels:
    app.kubernetes.io/component: enterprise-treasury
    app.kubernetes.io/part-of: forgepay
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: forgepay-vault
    kind: SecretStore
  target:
    name: enterprise-treasury-secrets   # Kubernetes Secret name created/updated
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: enterprise-treasury
        property: DATABASE_URL
    - secretKey: VALID_API_KEYS
      remoteRef:
        key: enterprise-treasury
        property: VALID_API_KEYS
    - secretKey: ALERT_WEBHOOK_URL
      remoteRef:
        key: enterprise-treasury
        property: ALERT_WEBHOOK_URL
    - secretKey: YIELD_ENGINE_URL
      remoteRef:
        key: enterprise-treasury
        property: YIELD_ENGINE_URL

---
# ── ExternalSecret: billing-engine ───────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: billing-engine-secrets
  namespace: forgepay
  labels:
    app.kubernetes.io/component: billing-engine
    app.kubernetes.io/part-of: forgepay
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: forgepay-vault
    kind: SecretStore
  target:
    name: billing-engine-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: billing-engine
        property: DATABASE_URL
    - secretKey: KILLBILL_ADMIN_PASSWORD
      remoteRef:
        key: billing-engine
        property: KILLBILL_ADMIN_PASSWORD
    - secretKey: KILLBILL_WEBHOOK_SECRET
      remoteRef:
        key: billing-engine
        property: KILLBILL_WEBHOOK_SECRET

---
# ── ExternalSecret: dashboard ─────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dashboard-secrets
  namespace: forgepay
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: forgepay
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: forgepay-vault
    kind: SecretStore
  target:
    name: dashboard-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: dashboard
        property: NEXTAUTH_SECRET
    - secretKey: HYPERSWITCH_MERCHANT_API_KEY
      remoteRef:
        key: dashboard
        property: HYPERSWITCH_MERCHANT_API_KEY
    - secretKey: KILLBILL_API_SECRET
      remoteRef:
        key: dashboard
        property: KILLBILL_API_SECRET
