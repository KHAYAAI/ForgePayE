# ForgePay Pricing Configuration
# This file defines the pricing tiers, limits, and upgrade rules

tiers:
  free:
    id: free
    name: Free
    monthly_fee: 0  # USD

    # Transaction fees (percentage + fixed per transaction)
    fees:
      card:
        percentage: 2.8      # 2.8%
        fixed: 0.24          # $0.24 per transaction
      stablecoin:
        percentage: 1.8      # 1.8%
        fixed: 0             # No fixed fee for stablecoin
      crypto:
        percentage: 1.8      # 1.8%
        fixed: 0             # No fixed fee for crypto

    # Operational limits
    limits:
      monthly_volume: 25000  # USD
      max_team_members: 1
      max_chargebacks_per_month: 4  # 5+ triggers upgrade
      api_rate_limit_rpm: 10  # requests per minute

    # Feature flags
    features:
      merchant_of_record: false
      tax_automation: false
      subscriptions_allowed: true
      webhooks: true
      team_members: false
      advanced_analytics: false
      priority_support: false
      api_access: true
      custom_routing: false

    # Upgrade triggers
    upgrade_triggers:
      - type: volume_exceeded
        threshold: 25000  # monthly USD
        message: "You've exceeded the Free tier limit of $25,000/month. Upgrade to Standard for unlimited volume."
      - type: chargeback_threshold
        threshold: 5
        period_days: 30
        message: "Chargeback count exceeded Free tier limit. Upgrade to Standard for dunning management."
      - type: team_exceeded
        threshold: 2  # attempting to add 2nd team member
        message: "Free tier limited to 1 team member. Upgrade to Standard for up to 10 members."
      - type: feature_not_available
        features:
          - merchant_of_record
          - advanced_analytics
        message: "This feature requires Standard tier. Upgrade now to get started."

  standard:
    id: standard
    name: Standard
    monthly_fee: 28  # USD
    billed_annually: 336  # $28/month = $336/year

    # Transaction fees
    fees:
      card:
        percentage: 2.4      # 2.4%
        fixed: 0.24          # $0.24 per transaction
      stablecoin:
        percentage: 1.4      # 1.4%
        fixed: 0
      crypto:
        percentage: 1.4      # 1.4%
        fixed: 0

    # Operational limits
    limits:
      monthly_volume: null  # Unlimited
      max_team_members: 10
      max_chargebacks_per_month: null  # Handled by dunning
      api_rate_limit_rpm: 100  # requests per minute

    # Feature flags
    features:
      merchant_of_record: true
      tax_automation: true
      subscriptions_allowed: true
      webhooks: true
      team_members: true
      advanced_analytics: true
      priority_support: true
      api_access: true
      custom_routing: false  # Enterprise only

    # Upgrade triggers
    upgrade_triggers:
      - type: feature_request
        features:
          - custom_routing
          - white_label_checkout
        message: "This feature requires Enterprise tier. Contact sales@forgepay.io"

# Upgrade pricing
upgrade:
  # Auto-upgrade from Free to Standard when limits exceeded
  auto_upgrade_enabled: true
  proration_enabled: true  # Prorate remaining days of Free month

  # Grace period before enforcement (if merchant over-limit)
  grace_period_days: 7

  # Notification schedule for upgrade reminders
  notifications:
    - days_to_limit: 30
      message_type: email
      subject: "You're approaching Free tier limits"
    - days_to_limit: 7
      message_type: dashboard_banner
      subject: "You're close to exceeding Free tier limits"
    - days_to_limit: 1
      message_type: email_urgent
      subject: "Upgrade to Standard today to continue uninterrupted"

# Tax settings
tax:
  # Standard tier includes tax calculation in these jurisdictions
  supported_jurisdictions: 200+  # See tax-config.yaml for full list
  automatic_filing: true
  filing_frequencies:
    - monthly
    - quarterly
    - annual

# Support tiers
support:
  free:
    channels:
      - community_forums
      - documentation
      - email (best effort)
    response_time_sla: null
    business_hours: false
    priority_level: 3

  standard:
    channels:
      - email
      - in-app_chat
      - phone
      - slack
    response_time_sla: 2_hours  # Critical issues
    business_hours: true
    priority_level: 1

# Billing options
billing:
  free:
    payment_methods:
      - credit_card
    billing_frequency: monthly
    auto_upgrade: true

  standard:
    payment_methods:
      - credit_card
      - bank_transfer
      - ach
    billing_frequency:
      - monthly
      - annual (recommended)
    annual_discount: 0  # No discount, but shows annual cost upfront
    auto_renew: true

# Compliance and regulatory
compliance:
  free:
    pci_scope: out_of_scope  # Hyperswitch handles PCI
    audit_logs: 30_days
    data_retention: 1_year

  standard:
    pci_scope: out_of_scope
    audit_logs: 7_years
    data_retention: 7_years
    regulatory_reporting: true

# Feature rollout schedule
feature_releases:
  - feature: privacy_payments_beta
    tier: free
    release_date: 2026-05-15
    flag: privacy_beta_enabled

  - feature: forge_agent_beta
    tier: standard
    release_date: 2026-06-01
    flag: forge_agent_enabled

  - feature: x402_agent_payments
    tier: standard
    release_date: 2026-06-15
    flag: x402_enabled

# Analytics and metrics
analytics:
  free:
    dashboard_metrics:
      - total_revenue
      - transaction_count
      - payment_methods

  standard:
    dashboard_metrics:
      - total_revenue
      - transaction_count
      - payment_methods
      - customer_lifetime_value
      - churn_rate
      - mrr_trend
      - cohort_analysis
      - payment_method_breakdown
      - geographic_breakdown
      - refund_rate

# Email notification templates
notifications:
  upgrade_threshold_warning:
    subject: "You're getting close to Free tier limits"
    tier: free

  upgrade_hard_limit_exceeded:
    subject: "Upgrade to Standard to continue"
    tier: free

  standard_welcome:
    subject: "Welcome to ForgePay Standard"
    tier: standard

  chargeback_alert:
    subject: "Chargeback received - Upgrade to Standard for protection"
    tier: free

  tax_season_reminder:
    subject: "Tax season is here - Standard tier handles it all"
    tier: free
    seasonal: true
    months: [1, 4, 7, 10]

# API rate limiting by tier
rate_limiting:
  free:
    payments_per_minute: 10
    queries_per_minute: 10
    webhook_retries_max: 3  # 3 retry attempts

  standard:
    payments_per_minute: 100
    queries_per_minute: 100
    webhook_retries_max: 10  # 10 retry attempts

# Webhook configuration
webhooks:
  free:
    max_retries: 3
    retry_delay_seconds: 60
    timeout_seconds: 10
    signature_algorithm: hmac_sha256

  standard:
    max_retries: 10
    retry_delay_seconds: [30, 60, 120, 300, 600, 1800, 3600, 7200, 14400, 28800]
    timeout_seconds: 30
    signature_algorithm: hmac_sha256

# Chargeback handling
chargebacks:
  free:
    automatic_protection: false
    max_before_upgrade: 5
    dunning_enabled: false

  standard:
    automatic_protection: true
    max_before_suspension: 50  # 50 chargebacks in 90 days
    dunning_enabled: true
    dunning_retry_schedule: [1, 3, 5, 7, 14]  # days

# Integration limits
integrations:
  free:
    max_custom_webhooks: 3
    max_api_keys: 2

  standard:
    max_custom_webhooks: 10
    max_api_keys: 10
