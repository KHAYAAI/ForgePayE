[tool.poetry]
name = "forgepay-mor-layer"
version = "0.1.0"
description = "ForgePay MoR Layer — Merchant of Record service forked from Polar, wired to Hyperswitch"
authors = ["ForgePay Engineering <eng@forgepay.io>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python       = "^3.12"
fastapi      = "^0.111.0"
uvicorn      = { version = "^0.30.1", extras = ["standard"] }
httpx        = "^0.27.0"         # Async HTTP client — replaces Stripe SDK calls
pydantic     = "^2.7.4"
pydantic-settings = "^2.3.3"
sqlalchemy   = "^2.0.31"
alembic      = "^1.13.2"
asyncpg      = "^0.29.0"
redis        = "^5.0.7"
structlog    = "^24.2.0"
python-jose  = { version = "^3.3.0", extras = ["cryptography"] }
passlib      = { version = "^1.7.4", extras = ["bcrypt"] }
# passlib 1.7.4 (unmaintained since 2020) auto-detects the bcrypt backend by
# reading `_bcrypt.__about__.__version__`, an attribute bcrypt removed in 5.0
# (confirmed: 4.3.0 works, 5.0.0 doesn't). With no upper bound here, poetry
# resolves the newest bcrypt and every password hash/verify call in this
# service — registration, login — raises `ValueError: password cannot be
# longer than 72 bytes` at the version-sniff step, not at the 72-byte
# truncation it's actually meant to guard. Pin below 5.0. mor-layer is the
# only service in this repo using passlib.
bcrypt       = "^4.0.1"
cryptography = "^42.0"          # X25519 ECDH + AES-256-GCM for auditor decryption
python-multipart = "^0.0.9"
stripe       = "^10.5.0"         # Keep as type reference only; no live calls
python-dateutil = "^2.9.0"      # Relative date arithmetic for tax filing due dates
slowapi      = "^0.1.8"          # Rate limiting for DDoS and fair usage protection
prometheus-client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest       = "^8.2.2"
pytest-asyncio = "^0.23.7"
httpx        = "^0.27.0"
ruff         = "^0.5.0"
mypy         = "^1.10.1"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict         = true
