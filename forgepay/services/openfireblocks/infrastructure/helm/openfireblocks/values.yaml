# Default values for the OpenFireblocks chart.

imageRegistry: openfireblocks
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Pod security defaults applied to every workload.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Endpoints of stateful dependencies (provisioned outside this chart: RDS,
# managed Temporal, etc.). Override per environment.
external:
  databaseUrlSecret: openfireblocks-secrets # secret holding key "database-url"
  temporalHostPort: temporal-frontend:7233
  temporalNamespace: default
  ethereumRpcSepolia: "" # set to enable broadcasting
  requiredConfirmations: "6"
  redisUrl: "" # e.g. redis://redis-master:6379 — empty disables velocity limiting
  ethereumRpcUrl: "" # ETHEREUM_RPC_URL (takes precedence over ethereumRpcSepolia); empty and no Sepolia URL = sign only, no broadcast
  ethereumNetworkName: "" # ETHEREUM_NETWORK_NAME, display only

# Static admin token for customer provisioning (replace with Keycloak in prod).
adminApiKeySecret: openfireblocks-secrets # secret holding key "admin-api-key"

apiGateway:
  enabled: true
  image: api-gateway
  tag: latest
  replicas: 3
  port: 3000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  # Threshold signing (per-workspace keys held by the mpc-node cluster; see docs/threshold-signing.md).
  thresholdSigning: false # MPC_THRESHOLD_SIGNING: sign with a per-workspace key via the coordinator
  keyBackfillOnStart: true # KEY_BACKFILL_ON_START (false disables the start-up backfill of existing workspaces)
  keyBackfillMaxAttempts: "" # KEY_BACKFILL_MAX_ATTEMPTS
  keyBackfillFirstDelayMs: "" # KEY_BACKFILL_FIRST_DELAY_MS
  fleetRefreshSame: "" # FLEET_REFRESH_SAME: whether a fleet rotation also refreshes workspaces already on the target committee
  txConfirmations: "" # TX_CONFIRMATIONS
  txStuckAfterMs: "" # TX_STUCK_AFTER_MS
  riskFailClosed: "" # RISK_FAIL_CLOSED ("true" refuses when the velocity store is unavailable)
  pgPoolMax: "" # PG_POOL_MAX
  extraEnv: [] # additional Kubernetes EnvVar entries

# Secret holding the custody trust secrets (one Secret, three keys). Create it out of band; this chart never renders one.
#   signer-auth-token  bearer token the gateway and temporal-worker present to the signer (>= 32 chars)
#   actor-secret       HMAC secret the console shares with the gateway to sign custody actions (CUSTODY_ACTOR_SECRET)
#   proposal-secret    HMAC secret sealing proposal payloads (CUSTODY_PROPOSAL_SECRET)
# Required: the signer refuses to start in production without the token, and the gateway refuses custody
# actions in production without the other two.
custodySecretsRef: openfireblocks-custody-secrets

# Mutual TLS on the signer's API (gateway -> signer). ENFORCED: the signer refuses to start in production without it, and
# the gateway and temporal-worker refuse to talk to it without it. Two certificates from the SAME private CA, which must not
# be a CA that also issues the signing nodes' certificates to anyone else:
#   server  common name "signer"   -> the signer's listener            (secret keys tls.crt / tls.key / ca.crt)
#   client  common name "gateway"  -> api-gateway and temporal-worker  (secret keys tls.crt / tls.key / ca.crt)
# The signer accepts only a client certificate named "gateway"; a signing node's certificate is valid TLS but is refused.
signerApiTls:
  insecure: false # true only for local development; the chart then renders a plain-HTTP signer and the signer will not start with MPC_ENV=production
  serverSecret: "" # existing Secret for the signer's listener (ignored when certManager.enabled)
  clientSecret: "" # existing Secret for the gateway's client certificate (ignored when certManager.enabled)
  certManager:
    enabled: false
    issuerRef: { name: "", kind: ClusterIssuer, group: cert-manager.io }
    duration: 2160h
    renewBefore: 360h

mpcSigner:
  enabled: true
  image: mpc-signer
  tag: latest
  replicas: 3
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  pdb:
    enabled: true
    minAvailable: 1
  vault: # legacy single shared signing key (Phase 0), kept in Vault KV. Unused once MPC_REQUIRED is on.
    addr: "" # e.g. http://vault.vault:8200 — empty disables Vault sourcing
    tokenSecret: openfireblocks-secrets # secret holding key "vault-token"
  immudb:
    url: "" # IMMUDB_URL host:port of the immutable audit ledger; empty = the signer's default (localhost:3322), i.e. none
    credentialsSecret: "" # optional Secret with keys "user" and "password" (IMMUDB_USER / IMMUDB_PASSWORD)
  # The COORDINATOR of the threshold cluster. It talks mutual TLS to the mpc-node signing nodes (installed separately
  # with infra/helm/mpc-node, one release per node and trust domain). It holds only an ed25519 key that signs session
  # requests; it never holds a share.
  threshold:
    enabled: false # renders the cluster/coordinator wiring below and sets MPC_CLUSTER_FILE etc.
    env: production # MPC_ENV
    required: true # MPC_REQUIRED: refuse the legacy shared key; the signer will not start without a cluster
    cluster:
      json: "" # cluster.json content (public); or reference an existing ConfigMap
      existingConfigMap: ""
      key: cluster.json
    coordinatorKeySecret: # Secret holding the coordinator's private key file (mpc-node coordinator-key)
      name: ""
      key: coordinator.key
    tls: # coordinator client certificate: common name "coordinator", plus the cluster CA
      existingSecret: "" # keys tls.crt / tls.key / ca.crt
      keys: { cert: tls.crt, key: tls.key, ca: ca.crt }
      certManager:
        enabled: false
        issuerRef: { name: "", kind: ClusterIssuer, group: cert-manager.io }
        duration: 2160h
        renewBefore: 360h

policyService:
  enabled: true
  image: policy-service
  tag: latest
  replicas: 2
  port: 8081
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  pdb:
    enabled: true
    minAvailable: 1

temporalWorker:
  enabled: true
  image: temporal-worker
  tag: latest
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# NetworkPolicies for the custody path. Off by default because turning them on without telling the signer where the
# nodes are would cut it off. With it on: policy-service and mpc-signer accept only api-gateway/temporal-worker pods;
# mpc-signer may reach DNS, the nodes (networkPolicy.nodePeers), Vault and immudb only.
networkPolicy:
  enabled: false
  nodePeers: [] # NetworkPolicyPeer list for the mpc-node endpoints in cluster.json (ipBlock for other clusters)
  nodePort: 8101
  vaultPeers: [] # NetworkPolicyPeer list for Vault (legacy key)
  vaultPort: 8200
  immudbPeers: []
  immudbPort: 3322

ingress:
  enabled: false
  className: nginx
  host: api.openfireblocks.example
  tls: true

serviceMonitor:
  enabled: false # set true if the Prometheus Operator is installed
