{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofb.fullname" . }}-api-gateway
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  {{- if not .Values.apiGateway.autoscaling.enabled }}
  replicas: {{ .Values.apiGateway.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        {{- include "ofb.labels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
    spec:
      serviceAccountName: {{ include "ofb.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-gateway
          image: {{ include "ofb.image" (dict "root" . "image" .Values.apiGateway.image "tag" .Values.apiGateway.tag) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.apiGateway.port }}
          env:
            - name: PORT
              value: {{ .Values.apiGateway.port | quote }}
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.databaseUrlSecret }}
                  key: database-url
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminApiKeySecret }}
                  key: admin-api-key
            - name: MPC_SIGNER_URL
              value: http://{{ include "ofb.fullname" . }}-mpc-signer:{{ .Values.mpcSigner.port }}
            - name: POLICY_SERVICE_URL
              value: http://{{ include "ofb.fullname" . }}-policy-service:{{ .Values.policyService.port }}
            - name: ETHEREUM_RPC_SEPOLIA
              value: {{ .Values.external.ethereumRpcSepolia | quote }}
            - name: REDIS_URL
              value: {{ .Values.external.redisUrl | quote }}
            - name: TEMPORAL_HOSTPORT
              value: {{ .Values.external.temporalHostPort | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.external.temporalNamespace | quote }}
            {{- with .Values.external.ethereumRpcUrl }}
            - name: ETHEREUM_RPC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.external.ethereumNetworkName }}
            - name: ETHEREUM_NETWORK_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: MPC_THRESHOLD_SIGNING
              value: {{ .Values.apiGateway.thresholdSigning | quote }}
            - name: KEY_BACKFILL_ON_START
              value: {{ .Values.apiGateway.keyBackfillOnStart | quote }}
            {{- with .Values.apiGateway.keyBackfillMaxAttempts }}
            - name: KEY_BACKFILL_MAX_ATTEMPTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.apiGateway.keyBackfillFirstDelayMs }}
            - name: KEY_BACKFILL_FIRST_DELAY_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.apiGateway.fleetRefreshSame }}
            - name: FLEET_REFRESH_SAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.apiGateway.txConfirmations }}
            - name: TX_CONFIRMATIONS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.apiGateway.txStuckAfterMs }}
            - name: TX_STUCK_AFTER_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.apiGateway.riskFailClosed }}
            - name: RISK_FAIL_CLOSED
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.apiGateway.pgPoolMax }}
            - name: PG_POOL_MAX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.apiGateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: api-gateway
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofb.fullname" . }}-api-gateway
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  selector:
    app.kubernetes.io/component: api-gateway
  ports:
    - name: http
      port: {{ .Values.apiGateway.port }}
      targetPort: http
{{- if .Values.apiGateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ofb.fullname" . }}-api-gateway
  labels:
    {{- include "ofb.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ofb.fullname" . }}-api-gateway
  minReplicas: {{ .Values.apiGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.apiGateway.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
