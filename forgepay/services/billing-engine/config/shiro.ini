# Kill Bill Shiro security configuration
# Reference: https://docs.killbill.io/latest/userguide_security.html
#
# Production: replace these credentials with secrets from Vault/K8s secrets.
# NEVER commit real credentials here.

[users]
# Format: username = password, roles
# Passwords are SHA-256 hashed with a salt in production.
# Dev placeholder — override with KILLBILL_ADMIN_PASSWORD env var at runtime.
admin = ${KILLBILL_ADMIN_PASSWORD:admin}, admin

[roles]
admin = *

[main]
credentialsMatcher = org.killbill.billing.util.security.shiro.KillBillHashedCredentialsMatcher

[urls]
# Allow unauthenticated health checks
/1.0/healthcheck = anon
# Everything else requires authentication
/** = authcBasic
