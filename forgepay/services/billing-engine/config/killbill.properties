# FORGE billing engine (Kill Bill 0.24.10)
# ──────────────────────────────────────────────────────────────────────────────
# Subscriptions, invoicing, usage and dunning. Payments go through the
# forgepay-hyperswitch plugin (forgepay-plugin/) to Hyperswitch.
#
# This file holds static settings only. Kill Bill does not expand ${VAR}
# placeholders here; per-environment values are passed as environment
# variables named KB_<property with dots as underscores>, which the
# killbill/killbill image applies on top of this file:
#   KB_org_killbill_dao_url                 jdbc:postgresql://<host>:5432/killbill
#   KB_org_killbill_dao_user / _password
#   KB_org_killbill_billing_osgi_dao_url    (same database)
#   KB_org_killbill_billing_osgi_dao_user / _password
#   KB_ADMIN_PASSWORD                       Kill Bill admin password (shiro.ini)
# and, for the payment plugin:
#   HYPERSWITCH_BASE_URL, HYPERSWITCH_API_KEY
# Secrets come from Vault / AWS Secrets Manager, never from this file.
#
# Plans: config/catalog/forgepay-base-catalog.xml (validated against 0.24.10).

org.killbill.server.multitenant=true
org.killbill.server.baseUrl=http://billing-engine:8080

# ── Payment ───────────────────────────────────────────────────────────────────
# The OSGi bundle in forgepay-plugin/ registers under this name.
org.killbill.payment.plugin.name=forgepay-hyperswitch

# Dunning: retry a failed subscription payment after 1 day, another 1 day,
# then 3 more days.
org.killbill.payment.retry.days=1,1,3

# ── Invoicing ─────────────────────────────────────────────────────────────────
org.killbill.invoice.enabled=true
org.killbill.invoice.maxNumberOfMonthsInFuture=36
org.killbill.invoice.sanityEnabled=true

# ── Email ─────────────────────────────────────────────────────────────────────
org.killbill.billing.util.email.smtp.sendEmailNotifications=false

# ── Catalog ───────────────────────────────────────────────────────────────────
# Multi-tenant Kill Bill does not fall back to this for a tenant that has not
# uploaded a catalog; run scripts/upload-catalog.sh for each tenant.
org.killbill.catalog.uri=file:///var/lib/killbill/config/catalog/forgepay-base-catalog.xml

# Lifecycle notifications to unified-router are registered per tenant
# (POST /1.0/kb/tenants/registerNotificationCallback), not configured here.

org.killbill.metrics.influxdb=false
org.killbill.metrics.graphite=false
