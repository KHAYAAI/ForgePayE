# ── ForgePay Kill Bill Configuration ─────────────────────────────────────────
# Documentation: https://docs.killbill.io/latest/userguide_configuration.html

# ── Server ────────────────────────────────────────────────────────────────────
org.killbill.server.multitenant=true
org.killbill.server.baseUrl=http://billing-engine:8080

# ── Database ──────────────────────────────────────────────────────────────────
# Credentials injected at runtime via environment variables
org.killbill.billing.osgi.dao.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:killbill}
org.killbill.billing.osgi.dao.user=${POSTGRES_USER:killbill}
org.killbill.billing.osgi.dao.password=${POSTGRES_PASSWORD}
org.killbill.dao.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:killbill}
org.killbill.dao.user=${POSTGRES_USER:killbill}
org.killbill.dao.password=${POSTGRES_PASSWORD}

# Connection pool
org.killbill.dao.minIdle=5
org.killbill.dao.maxActive=30

# ── Payment ───────────────────────────────────────────────────────────────────
# Default payment plugin = Hyperswitch
org.killbill.payment.plugin.name=killbill-hyperswitch

# Retry logic: 3 retries at 1h, 24h, 72h (dunning schedule)
org.killbill.payment.retry.days=1,1,3

# ── Invoicing ─────────────────────────────────────────────────────────────────
org.killbill.invoice.enabled=true
org.killbill.invoice.maxNumberOfMonthsInFuture=36
org.killbill.invoice.sanityEnabled=true

# ── Email / Notifications ──────────────────────────────────────────────────────
# Disable built-in email (ForgePay unified-router handles notifications)
org.killbill.billing.util.email.smtp.sendEmailNotifications=false

# ── Webhooks ──────────────────────────────────────────────────────────────────
# Kill Bill pushes notification events here → unified-router normalizes them
org.killbill.notificationq.main.pushNotificationUrl=http://unified-router:8000/webhooks/killbill

# ── Catalog ───────────────────────────────────────────────────────────────────
# Default catalog loaded from /var/lib/killbill/catalog/
org.killbill.catalog.uri=file:///var/lib/killbill/catalog/forgepay-base-catalog.xml

# ── Redis (optional — for distributed cache) ──────────────────────────────────
# org.killbill.cache.config.redis.url=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}

# ── Observability ─────────────────────────────────────────────────────────────
org.killbill.metrics.influxdb=false
org.killbill.metrics.graphite=false
