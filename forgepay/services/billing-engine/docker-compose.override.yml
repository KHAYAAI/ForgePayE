version: "3.9"

# Local development overrides for billing-engine.
# Usage: docker compose -f forgepay/infra/k8s/docker-compose.dev.yml \
#               -f forgepay/services/billing-engine/docker-compose.override.yml up

services:
  billing-engine:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Kill Bill reads settings from KB_* variables (dots → underscores);
      # see config/killbill.properties. Local-only values; real ones come
      # from Vault / AWS Secrets Manager.
      KB_org_killbill_dao_url:                 jdbc:postgresql://postgres:5432/killbill
      KB_org_killbill_dao_user:                killbill
      KB_org_killbill_dao_password:            killbillpassword
      KB_org_killbill_billing_osgi_dao_url:    jdbc:postgresql://postgres:5432/killbill
      KB_org_killbill_billing_osgi_dao_user:   killbill
      KB_org_killbill_billing_osgi_dao_password: killbillpassword
      KB_ADMIN_PASSWORD:                       admin
      # forgepay-hyperswitch payment plugin. With no key the plugin is not
      # registered and Kill Bill payments fail visibly.
      HYPERSWITCH_BASE_URL:                    http://payment-engine:8080
      HYPERSWITCH_API_KEY:                     ""
    ports:
      - "8020:8080"   # Kill Bill API
      - "8021:8081"   # Kill Bill admin UI (Kaui)
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - forgepay

  # Kill Bill admin UI (Kaui)
  billing-kaui:
    image: killbill/kaui:3.0.10
    environment:
      KAUI_CONFIG_DAO_URL: jdbc:postgresql://postgres:5432/kaui
      KAUI_CONFIG_DAO_USER: killbill
      KAUI_CONFIG_DAO_PASSWORD: killbillpassword
      KAUI_KILLBILL_URL: http://billing-engine:8080
    ports:
      - "9090:8080"
    depends_on:
      - billing-engine
    networks:
      - forgepay
