# ── Kill Bill Hyperswitch Plugin Configuration ────────────────────────────────
# Source: https://github.com/killbill/killbill-hyperswitch-plugin
#
# All secrets injected at runtime via K8s secrets or environment variables.
# Never hardcode API keys here.

# Hyperswitch API endpoint (our payment-engine service)
HYPERSWITCH_API_URL=http://payment-engine:8080

# API key for Kill Bill → payment-engine authentication
# Injected from K8s secret: forgepay-billing-secrets / HYPERSWITCH_API_KEY
HYPERSWITCH_API_KEY=${HYPERSWITCH_API_KEY}

# Webhook endpoint that Hyperswitch posts payment events back to Kill Bill
# Kill Bill uses this to update payment states in its state machine
HYPERSWITCH_WEBHOOK_SECRET=${KILLBILL_HYPERSWITCH_WEBHOOK_SECRET}

# Payment flow: "purchase" (capture immediately) or "authorize" (capture later)
HYPERSWITCH_PAYMENT_FLOW=purchase

# Supported payment method types for Kill Bill recurring charges
# Kill Bill uses stored payment methods (payment_method_id) for recurring billing
HYPERSWITCH_SUPPORTED_METHODS=card,bank_transfer

# Timeout for API calls (ms)
HYPERSWITCH_CONNECTION_TIMEOUT=10000
HYPERSWITCH_READ_TIMEOUT=30000

# Retry configuration (in addition to Kill Bill's built-in retry)
HYPERSWITCH_MAX_RETRIES=2

# Currency handling: Kill Bill passes amounts in currency's smallest unit
# Hyperswitch also expects smallest unit (cents) — no conversion needed for USD/EUR/GBP
HYPERSWITCH_AMOUNT_IN_CENTS=true
