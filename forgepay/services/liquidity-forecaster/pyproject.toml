[tool.poetry]
name = "forgepay-liquidity-forecaster"
version = "0.1.0"
description = "ForgePay Liquidity Forecaster — 7/30/90-day cash flow forecasting, runway calculator, and variance alerts"
authors = ["ForgePay Engineering <eng@forgepay.io>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python            = "^3.12"
fastapi           = "^0.111.0"
uvicorn           = { version = "^0.30.1", extras = ["standard"] }
pydantic          = "^2.7.4"
pydantic-settings = "^2.3.3"
httpx             = "^0.27.0"
numpy             = "^1.26.4"
pandas            = "^2.2.2"
scikit-learn      = "^1.5.0"
statsmodels       = "^0.14.2"
python-dotenv     = "^1.0.1"
structlog         = "^24.2.0"
tenacity          = "^8.4.2"
python-jose       = { version = "^3.3.0", extras = ["cryptography"] }
slowapi            = "^0.1.8"          # Rate limiting for DDoS and fair usage protection
prometheus-client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest            = "^8.2.2"
pytest-asyncio    = "^0.23.7"
httpx             = "^0.27.0"
ruff              = "^0.5.0"
mypy              = "^1.10.1"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict         = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
